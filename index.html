<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>VCL Clarity Scoreboard</title>
<style>
  :root {
    --text: rgba(255, 255, 255, 0.92);
    --muted: rgba(255, 255, 255, 0.45);
    --surface: rgba(255, 255, 255, 0.04);
    --surface-strong: rgba(255, 255, 255, 0.07);
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.18);
    --value: rgba(255, 255, 255, 0.96);
    --green: #22c55e;
    --red: #ef4444;
    --gold: #f59e0b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: transparent;
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 13.5px;
    line-height: 1.45;
    color-scheme: dark;
  }
  .root { padding: 12px; max-width: 1100px; margin: 0 auto; }

  .header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 12px;
    padding: 0 4px;
  }
  .title {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    display: flex; align-items: center; gap: 6px;
  }
  .meta { color: var(--muted); font-size: 11px; }
  .empty { color: var(--muted); font-style: italic; font-weight: 400; }

  /* === Leaderboard table === */
  .lb {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0 3px;
    font-variant-numeric: tabular-nums;
  }
  .lb thead th {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: right;
    padding: 6px 12px;
    border: none;
  }
  .lb thead th:first-child,
  .lb thead th:nth-child(2) { text-align: left; }

  .lb tbody tr {
    background: var(--surface);
    border: 1px solid var(--border);
  }
  .lb tbody td {
    padding: 10px 12px;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    text-align: right;
    background: var(--surface);
  }
  .lb tbody td:first-child {
    border-left: 1px solid var(--border);
    border-radius: 8px 0 0 8px;
    text-align: left;
    width: 38px;
    color: var(--muted);
    font-weight: 600;
    font-size: 12.5px;
  }
  .lb tbody td:nth-child(2) {
    text-align: left;
    /* AVWAP color stripe lives here */
    border-left: 3px solid var(--accent, var(--border-strong));
  }
  .lb tbody td:last-child {
    border-right: 1px solid var(--border);
    border-radius: 0 8px 8px 0;
  }

  .lb tbody tr.rank-1 td { background: color-mix(in srgb, var(--accent, #ffffff) 14%, var(--surface)); }
  .lb tbody tr.rank-1 td:first-child { color: var(--gold); }

  .combo-cell { display: flex; flex-direction: column; gap: 2px; }
  .combo-avwap {
    color: var(--accent, var(--text));
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.005em;
  }
  .combo-method {
    font-size: 11.5px;
    color: var(--muted);
    font-weight: 500;
  }

  .num { font-weight: 600; color: var(--value); font-size: 13px; }
  .num.pos { color: var(--green); }
  .num.neg { color: var(--red); }
  .num.muted { color: var(--muted); font-weight: 500; }
  .num-sub { display: block; font-size: 10.5px; font-weight: 500; color: var(--muted); margin-top: 1px; }

  .footer {
    margin-top: 10px;
    text-align: center;
    color: var(--muted);
    font-size: 10.5px;
  }

  /* AVWAP color tints */
  .avwap-daily              { --accent: #a855f7; }
  .avwap-session-open       { --accent: #d4d4d4; }
  .avwap-session-hl         { --accent: #eab308; }
  .avwap-trend-swing-point  { --accent: #3b82f6; }
  .avwap-sweep-bos          { --accent: #22c55e; }
</style>
</head>
<body>
<div class="root">
  <div class="header">
    <div class="title">🏆 Scoreboard <span class="meta" id="trade-count" style="margin-left:8px"></span></div>
    <div class="meta" id="updated-at">loading…</div>
  </div>

  <table class="lb" id="lb">
    <thead>
      <tr>
        <th>#</th>
        <th>Combo</th>
        <th>Win Rate</th>
        <th>Expectancy</th>
        <th>Total R</th>
        <th>Best Trade</th>
      </tr>
    </thead>
    <tbody id="lb-body">
      <tr><td colspan="6" style="text-align:center;color:var(--muted)">loading…</td></tr>
    </tbody>
  </table>

  <div class="footer" id="footer"></div>
</div>

<script>
  const AVWAP_CLASS = {
    'Daily': 'avwap-daily',
    'Session Open': 'avwap-session-open',
    'Session H/L': 'avwap-session-hl',
    'Trend Swing Point': 'avwap-trend-swing-point',
    'Sweep + BoS': 'avwap-sweep-bos',
  };

  function fmtR(n, withSign = true) {
    if (n === null || n === undefined || Number.isNaN(n)) return '<span class="num muted">—</span>';
    const sign = withSign ? (n >= 0 ? '+' : '') : '';
    const cls = n > 0 ? 'pos' : (n < 0 ? 'neg' : '');
    return `<span class="num ${cls}">${sign}${n.toFixed(2)}R</span>`;
  }
  function fmtPct(n) {
    if (n === null || n === undefined || Number.isNaN(n)) return '<span class="num muted">—</span>';
    return `<span class="num">${(n * 100).toFixed(1)}%</span>`;
  }
  function timeAgo(iso) {
    if (!iso) return '';
    const d = new Date(iso); if (isNaN(d)) return '';
    const sec = Math.floor((Date.now() - d.getTime()) / 1000);
    if (sec < 60) return `updated ${sec}s ago`;
    const min = Math.floor(sec / 60);
    if (min < 60) return `updated ${min}m ago`;
    const hr = Math.floor(min / 60);
    if (hr < 24) return `updated ${hr}h ago`;
    return `updated ${d.toLocaleDateString()}`;
  }

  function render(data) {
    const lb = (data && data.leaderboard) || [];
    const tbody = document.getElementById('lb-body');
    document.getElementById('updated-at').textContent = timeAgo(data?.generatedAt) || '';
    document.getElementById('trade-count').textContent = data?.tradeCount ? `· ${data.tradeCount} trades` : '';
    document.getElementById('footer').textContent = data?.generatedAt
      ? `Last sync: ${new Date(data.generatedAt).toLocaleString()}`
      : '';

    if (!lb.length) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--muted)">No combos yet</td></tr>';
      return;
    }

    tbody.innerHTML = lb.map((c, i) => {
      const cls = AVWAP_CLASS[c.avwap] || '';
      const rankCls = i === 0 ? 'rank-1' : '';
      const rankBadge = i === 0 ? '👑' : (i + 1);
      return `
        <tr class="${cls} ${rankCls}">
          <td>${rankBadge}</td>
          <td>
            <div class="combo-cell">
              <span class="combo-avwap">${c.avwap}</span>
              <span class="combo-method">${c.methodology} · n=${c.trades}</span>
            </div>
          </td>
          <td>${fmtPct(c.winRate)}</td>
          <td>${fmtR(c.expectancy)}</td>
          <td>${fmtR(c.totalR)}</td>
          <td>${fmtR(c.highestR)}</td>
        </tr>`;
    }).join('');
  }

  // Cache-busted fetch each load
  fetch(`./data.json?t=${Date.now()}`, { cache: 'no-store' })
    .then(r => r.ok ? r.json() : Promise.reject(`HTTP ${r.status}`))
    .then(render)
    .catch(err => {
      const tbody = document.getElementById('lb-body');
      tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;color:var(--muted)">Couldn't load scoreboard (${err})</td></tr>`;
    });
</script>
</body>
</html>
