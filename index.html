<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>VCL Clarity Scoreboard</title>
<style>
  :root {
    --text: rgba(255, 255, 255, 0.92);
    --muted: rgba(255, 255, 255, 0.45);
    --surface: rgba(255, 255, 255, 0.04);
    --surface-strong: rgba(255, 255, 255, 0.07);
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.18);
    --value: rgba(255, 255, 255, 0.96);
    --green: #22c55e;
    --red: #ef4444;
    --gold: #f59e0b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: transparent;
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 13px;
    line-height: 1.45;
    color-scheme: dark;
  }
  .root { padding: 12px; max-width: 1280px; margin: 0 auto; }

  .header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 10px;
    padding: 0 4px;
  }
  .title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .meta { color: var(--muted); font-size: 11px; }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  @media (max-width: 880px) {
    .grid { grid-template-columns: 1fr; }
  }

  .panel {
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
    padding: 12px;
  }
  .panel.top {
    border-color: color-mix(in srgb, var(--green) 38%, var(--border));
    background: color-mix(in srgb, var(--green) 6%, var(--surface));
  }
  .panel.bottom {
    border-color: color-mix(in srgb, var(--red) 38%, var(--border));
    background: color-mix(in srgb, var(--red) 6%, var(--surface));
  }
  .panel-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 10px;
    padding: 0 4px;
  }
  .panel-title {
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .panel.top .panel-title { color: var(--green); }
  .panel.bottom .panel-title { color: var(--red); }
  .panel-sub { font-size: 10.5px; color: var(--muted); }

  /* === Tables === */
  .lb {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0 3px;
    font-variant-numeric: tabular-nums;
  }
  .lb thead th {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: right;
    padding: 5px 8px;
    border: none;
  }
  .lb thead th:first-child,
  .lb thead th:nth-child(2) { text-align: left; }

  .lb tbody td {
    padding: 8px 8px;
    background: var(--surface-strong);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    text-align: right;
  }
  .lb tbody td:first-child {
    border-left: 1px solid var(--border);
    border-radius: 7px 0 0 7px;
    text-align: left;
    width: 32px;
    color: var(--muted);
    font-weight: 700;
    font-size: 12px;
  }
  .lb tbody td:nth-child(2) {
    text-align: left;
    border-left: 3px solid var(--accent, var(--border-strong));
  }
  .lb tbody td:last-child {
    border-right: 1px solid var(--border);
    border-radius: 0 7px 7px 0;
  }

  .combo-cell { display: flex; flex-direction: column; gap: 1px; }
  .combo-avwap {
    color: var(--accent, var(--text));
    font-size: 12.5px;
    font-weight: 700;
  }
  .combo-method {
    font-size: 11px;
    color: var(--muted);
    font-weight: 500;
  }

  .num { font-weight: 600; color: var(--value); font-size: 12.5px; }
  .num.pos { color: var(--green); }
  .num.neg { color: var(--red); }
  .num.muted { color: var(--muted); font-weight: 500; }

  .empty {
    text-align: center;
    color: var(--muted);
    font-style: italic;
    padding: 16px;
  }

  .footer {
    margin-top: 10px;
    text-align: center;
    color: var(--muted);
    font-size: 10.5px;
  }

  /* AVWAP color tints */
  .avwap-daily              { --accent: #a855f7; }
  .avwap-session-open       { --accent: #d4d4d4; }
  .avwap-session-hl         { --accent: #eab308; }
  .avwap-trend-swing-point  { --accent: #3b82f6; }
  .avwap-sweep-bos          { --accent: #22c55e; }
</style>
</head>
<body>
<div class="root">
  <div class="header">
    <div class="title">🏆 Scoreboard <span class="meta" id="trade-count" style="margin-left:8px"></span></div>
    <div class="meta" id="updated-at">loading…</div>
  </div>

  <div class="grid">
    <div class="panel top">
      <div class="panel-head">
        <div class="panel-title">🥇 Top 5</div>
        <div class="panel-sub">Highest Total R</div>
      </div>
      <table class="lb">
        <thead>
          <tr>
            <th>#</th>
            <th>Combo</th>
            <th>WR</th>
            <th>Exp</th>
            <th>Total R</th>
            <th>Best</th>
          </tr>
        </thead>
        <tbody id="top-body">
          <tr><td colspan="6" class="empty">loading…</td></tr>
        </tbody>
      </table>
    </div>

    <div class="panel bottom">
      <div class="panel-head">
        <div class="panel-title">⚠️ Bottom 5</div>
        <div class="panel-sub">Lowest Total R</div>
      </div>
      <table class="lb">
        <thead>
          <tr>
            <th>#</th>
            <th>Combo</th>
            <th>WR</th>
            <th>Exp</th>
            <th>Total R</th>
            <th>Best</th>
          </tr>
        </thead>
        <tbody id="bottom-body">
          <tr><td colspan="6" class="empty">loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="footer" id="footer"></div>
</div>

<script>
  const AVWAP_CLASS = {
    'Daily': 'avwap-daily',
    'Session Open': 'avwap-session-open',
    'Session H/L': 'avwap-session-hl',
    'Trend Swing Point': 'avwap-trend-swing-point',
    'Sweep + BoS': 'avwap-sweep-bos',
  };

  function fmtR(n, withSign = true) {
    if (n === null || n === undefined || Number.isNaN(n)) return '<span class="num muted">—</span>';
    const sign = withSign ? (n >= 0 ? '+' : '') : '';
    const cls = n > 0 ? 'pos' : (n < 0 ? 'neg' : '');
    return `<span class="num ${cls}">${sign}${n.toFixed(2)}R</span>`;
  }
  function fmtPct(n) {
    if (n === null || n === undefined || Number.isNaN(n)) return '<span class="num muted">—</span>';
    return `<span class="num">${(n * 100).toFixed(1)}%</span>`;
  }
  function timeAgo(iso) {
    if (!iso) return '';
    const d = new Date(iso); if (isNaN(d)) return '';
    const sec = Math.floor((Date.now() - d.getTime()) / 1000);
    if (sec < 60) return `updated ${sec}s ago`;
    const min = Math.floor(sec / 60);
    if (min < 60) return `updated ${min}m ago`;
    const hr = Math.floor(min / 60);
    if (hr < 24) return `updated ${hr}h ago`;
    return `updated ${d.toLocaleDateString()}`;
  }

  function rowHtml(c, displayRank) {
    const cls = AVWAP_CLASS[c.avwap] || '';
    return `
      <tr class="${cls}">
        <td>${displayRank}</td>
        <td>
          <div class="combo-cell">
            <span class="combo-avwap">${c.avwap}</span>
            <span class="combo-method">${c.methodology} · n=${c.trades}</span>
          </div>
        </td>
        <td>${fmtPct(c.winRate)}</td>
        <td>${fmtR(c.expectancy)}</td>
        <td>${fmtR(c.totalR)}</td>
        <td>${fmtR(c.highestR)}</td>
      </tr>`;
  }

  function render(data) {
    const lb = (data && data.leaderboard) || [];
    document.getElementById('updated-at').textContent = timeAgo(data?.generatedAt) || '';
    document.getElementById('trade-count').textContent = data?.tradeCount ? `· ${data.tradeCount} trades` : '';
    document.getElementById('footer').textContent = data?.generatedAt
      ? `Last sync: ${new Date(data.generatedAt).toLocaleString()}`
      : '';

    // Filter out combos with no trades — they're not "worst", they're "untraded"
    const active = lb.filter(c => (c.trades || 0) > 0);

    const topBody = document.getElementById('top-body');
    const bottomBody = document.getElementById('bottom-body');

    if (!active.length) {
      topBody.innerHTML = '<tr><td colspan="6" class="empty">No combos yet</td></tr>';
      bottomBody.innerHTML = '<tr><td colspan="6" class="empty">No combos yet</td></tr>';
      return;
    }

    // Top 5: best first
    const top5 = active.slice(0, 5);
    topBody.innerHTML = top5.map((c, i) => rowHtml(c, i + 1)).join('');

    // Bottom 5: worst first (last 5 of the sorted-desc list, then reversed)
    const bottom5 = active.slice(-5).reverse();
    bottomBody.innerHTML = bottom5.map((c, i) => rowHtml(c, i + 1)).join('');
  }

  // Cache-busted fetch each load
  fetch(`./data.json?t=${Date.now()}`, { cache: 'no-store' })
    .then(r => r.ok ? r.json() : Promise.reject(`HTTP ${r.status}`))
    .then(render)
    .catch(err => {
      const msg = `<tr><td colspan="6" class="empty">Couldn't load (${err})</td></tr>`;
      document.getElementById('top-body').innerHTML = msg;
      document.getElementById('bottom-body').innerHTML = msg;
    });
</script>
</body>
</html>
