<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VCL Clarity Scoreboard</title>
<style>
  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --border: #334155;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #f59e0b;
    --accent-strong: #fbbf24;
    --good: #22c55e;
    --bad: #ef4444;
    --shadow: 0 1px 3px rgba(0,0,0,0.4), 0 4px 12px rgba(0,0,0,0.25);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }
  .root {
    padding: 16px;
    max-width: 1100px;
    margin: 0 auto;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .title {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .meta {
    color: var(--muted);
    font-size: 12px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 120px;
  }
  .card.headline {
    grid-column: span 2;
    border-color: var(--accent);
    background: linear-gradient(135deg, rgba(245, 158, 11, 0.12) 0%, var(--surface) 60%);
  }
  .card-head {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .card-head .icon { font-size: 16px; }
  .card-label {
    font-size: 16px;
    font-weight: 700;
    line-height: 1.2;
  }
  .card-sublabel {
    font-size: 12px;
    color: var(--muted);
  }
  .card-value {
    font-size: 22px;
    font-weight: 700;
    color: var(--accent-strong);
    margin-top: auto;
    font-variant-numeric: tabular-nums;
  }
  .card.headline .card-value {
    font-size: 28px;
  }
  .footer {
    margin-top: 16px;
    color: var(--muted);
    font-size: 11px;
    text-align: center;
  }
  .empty {
    color: var(--muted);
    font-style: italic;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
    }
  }
</style>
</head>
<body>
<div class="root">
  <div class="header">
    <div class="title">🏆 VCL Clarity Scoreboard</div>
    <div class="meta" id="meta">Loading…</div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="footer" id="footer"></div>
</div>
<script>
(async () => {
  const grid = document.getElementById('grid');
  const meta = document.getElementById('meta');
  const footer = document.getElementById('footer');

  function card(opts) {
    const headline = opts.headline ? ' headline' : '';
    const labelHtml = opts.leader && opts.leader.label
      ? `<div class="card-label">${escapeHtml(opts.leader.label)}</div>`
      : `<div class="card-label empty">No data yet</div>`;
    const subHtml = opts.leader && opts.leader.sublabel
      ? `<div class="card-sublabel">${escapeHtml(opts.leader.sublabel)}</div>`
      : '';
    const valueHtml = opts.leader && opts.leader.value
      ? `<div class="card-value">${escapeHtml(opts.leader.value)}</div>`
      : '';
    return `<div class="card${headline}">
      <div class="card-head"><span class="icon">${opts.icon}</span><span>${escapeHtml(opts.title)}</span></div>
      ${labelHtml}
      ${subHtml}
      ${valueHtml}
    </div>`;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  try {
    const r = await fetch(`./data.json?t=${Date.now()}`, { cache: 'no-store' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    const L = data.leaders || {};

    const cards = [
      card({ icon: '👑', title: 'Best AVWAP × Methodology Combo', leader: L.bestAvwapMethod, headline: true }),
      card({ icon: '🏆', title: 'Top Cumulative R',                leader: L.topCumulativeR }),
      card({ icon: '🎯', title: 'Top Win Rate (≥5 trades)',         leader: L.topWinRate }),
      card({ icon: '📊', title: 'Most Trades',                      leader: L.mostTrades }),
      card({ icon: '⚡', title: 'Top Expectancy',                  leader: L.topExpectancy }),
      card({ icon: '💥', title: 'Biggest Single Trade',             leader: L.biggestTrade }),
      card({ icon: '⚓', title: 'Best AVWAP',                       leader: L.bestAvwap }),
      card({ icon: '🎮', title: 'Best Methodology',                 leader: L.bestMethodology }),
    ];
    grid.innerHTML = cards.join('');

    const generated = new Date(data.generatedAt);
    const ago = Math.round((Date.now() - generated.getTime()) / 60000);
    meta.textContent = `${data.tradeCount} trades · updated ${ago}m ago`;
    footer.textContent = `Data refreshes automatically. Last sync: ${generated.toLocaleString()}`;
  } catch (err) {
    grid.innerHTML = `<div class="card"><div class="card-label empty">Couldn't load scoreboard</div><div class="card-sublabel">${escapeHtml(err.message)}</div></div>`;
    meta.textContent = '';
    footer.textContent = 'Make sure data.json exists and the GitHub Action has run at least once.';
  }
})();
</script>
</body>
</html>
