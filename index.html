<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>VCL Clarity Scoreboard</title>
<style>
  :root {
    --text: rgba(255, 255, 255, 0.92);
    --muted: rgba(255, 255, 255, 0.45);
    --surface: rgba(255, 255, 255, 0.045);
    --surface-strong: rgba(255, 255, 255, 0.075);
    --border: rgba(255, 255, 255, 0.085);
    --border-strong: rgba(255, 255, 255, 0.18);
    --value: rgba(255, 255, 255, 0.96);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 13.5px;
    line-height: 1.5;
    color-scheme: dark;
  }
  .root {
    padding: 12px;
    max-width: 1100px;
    margin: 0 auto;
  }
  .header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 10px;
    padding: 0 4px;
  }
  .title {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .meta {
    color: var(--muted);
    font-size: 11px;
  }
  .podium {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 8px;
    margin-bottom: 8px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 8px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-height: 110px;
  }
  .card.combo {
    /* AVWAP-tinted via inline --accent variable */
    background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 14%, var(--surface)) 0%, var(--surface) 70%);
    border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--border));
  }
  .card-head {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    font-size: 10.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .card.combo .card-head { color: var(--accent); }
  .card-head .icon { font-size: 14px; opacity: 0.85; }
  .card-label {
    font-size: 14.5px;
    font-weight: 600;
    line-height: 1.25;
    color: var(--text);
  }
  .card-label .avwap { color: var(--accent); }
  .card-sublabel {
    font-size: 11.5px;
    color: var(--muted);
  }
  .card-value {
    font-size: 19px;
    font-weight: 600;
    color: var(--value);
    margin-top: auto;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }
  .card.combo .card-value { color: var(--accent); }
  .footer {
    margin-top: 10px;
    color: var(--muted);
    font-size: 10.5px;
    text-align: center;
    opacity: 0.7;
  }
  .empty { color: var(--muted); font-style: italic; font-weight: 400; }
</style>
</head>
<body>
<div class="root">
  <div class="header">
    <div class="title">🏆 Scoreboard</div>
    <div class="meta" id="meta">Loading…</div>
  </div>
  <div class="podium" id="podium"></div>
  <div class="grid" id="grid"></div>
  <div class="footer" id="footer"></div>
</div>
<script>
(async () => {
  const podium = document.getElementById('podium');
  const grid = document.getElementById('grid');
  const meta = document.getElementById('meta');
  const footer = document.getElementById('footer');

  // AVWAP accent colors — match Notion's emoji legend
  const AVWAP_COLORS = {
    'Daily':              '#a855f7', // purple
    'Session Open':       '#d4d4d4', // light gray (the "white" emoji)
    'Session H/L':        '#eab308', // yellow/amber
    'Trend Swing Point':  '#3b82f6', // blue
    'Sweep + BoS':        '#22c55e', // green
  };

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  function comboCard(rank, combo) {
    if (!combo) {
      return `<div class="card combo" style="--accent: var(--muted)">
        <div class="card-head"><span class="icon">${rank.icon}</span><span>${rank.label}</span></div>
        <div class="card-label empty">No data yet</div>
      </div>`;
    }
    const accent = AVWAP_COLORS[combo.avwap] || '#9ca3af';
    return `<div class="card combo" style="--accent: ${accent}">
      <div class="card-head"><span class="icon">${rank.icon}</span><span>${rank.label}</span></div>
      <div class="card-label"><span class="avwap">${escapeHtml(combo.avwap)}</span> × ${escapeHtml(combo.methodology)}</div>
      <div class="card-value">${escapeHtml(combo.value)}</div>
    </div>`;
  }

  function statCard(opts) {
    const labelHtml = opts.leader && opts.leader.label
      ? `<div class="card-label">${escapeHtml(opts.leader.label)}</div>`
      : `<div class="card-label empty">No data yet</div>`;
    const subHtml = opts.leader && opts.leader.sublabel
      ? `<div class="card-sublabel">${escapeHtml(opts.leader.sublabel)}</div>`
      : '';
    const valueHtml = opts.leader && opts.leader.value
      ? `<div class="card-value">${escapeHtml(opts.leader.value)}</div>`
      : '';
    return `<div class="card">
      <div class="card-head"><span class="icon">${opts.icon}</span><span>${opts.title}</span></div>
      ${labelHtml}
      ${subHtml}
      ${valueHtml}
    </div>`;
  }

  try {
    const r = await fetch(`./data.json?t=${Date.now()}`, { cache: 'no-store' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    const L = data.leaders || {};
    const combos = L.topCombos || [];

    podium.innerHTML = [
      comboCard({ icon: '🥇', label: '#1 Best combo' }, combos[0]),
      comboCard({ icon: '🥈', label: '#2 Best combo' }, combos[1]),
      comboCard({ icon: '🥉', label: '#3 Best combo' }, combos[2]),
    ].join('');

    grid.innerHTML = [
      statCard({ icon: '🎯', title: 'Top win rate (≥5 trades)',  leader: L.topWinRate }),
      statCard({ icon: '📊', title: 'Most trades',               leader: L.mostTrades }),
      statCard({ icon: '⚡', title: 'Top expectancy',            leader: L.topExpectancy }),
      statCard({ icon: '💥', title: 'Biggest single trade',      leader: L.biggestTrade }),
    ].join('');

    const generated = new Date(data.generatedAt);
    const ago = Math.round((Date.now() - generated.getTime()) / 60000);
    meta.textContent = `${data.tradeCount} trades · updated ${ago}m ago`;
    footer.textContent = `Last sync: ${generated.toLocaleString()}`;
  } catch (err) {
    podium.innerHTML = '';
    grid.innerHTML = `<div class="card"><div class="card-label empty">Couldn't load scoreboard</div><div class="card-sublabel">${escapeHtml(err.message)}</div></div>`;
    meta.textContent = '';
    footer.textContent = 'Make sure data.json exists and the GitHub Action has run at least once.';
  }
})();
</script>
</body>
</html>
