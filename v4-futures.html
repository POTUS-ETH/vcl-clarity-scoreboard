<div class="wrap">
  <div class="hd">
    <div><h1>VCL v4 SCOREBOARD — FUTURES</h1><div class="sub">Sweep+BoS · 15s only · MNQ / MES / MGC · combo = methodology</div></div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <div class="tg" id="modelTg"><button data-m="ladder" class="on">VCL LADDER</button><button data-m="mario">SUPER MARIO</button></div>
      <div class="tg" id="pairTg"><button data-p="all" class="on">ALL</button><button data-p="MNQ">MNQ</button><button data-p="MES">MES</button><button data-p="MGC">MGC</button></div>
      <div class="mini" id="status">loading…</div>
    </div>
  </div>
  <div id="board"></div>
  <div class="foot" id="foot"></div>

</div>
<script>
// Two models scored off the SAME logged row. They share the fib geometry and differ only
// in where the stop sits and whether there is an L1 leg — so one set of typed prices
// settles both, and neither is a counterfactual needing bar data to reconstruct.
const MGMTS_LADDER=[{k:'f1',label:'Full @1R'},{k:'p1',label:'50% @1R'},{k:'hyA',label:'Hybrid A @1R'},{k:'hyB',label:'Hybrid B @1R'},
  // Full TP @ 2R/3R/5R and 50% + N-R runner variants. Miss defaults to posExit (BoS trail),
  // NOT SM-style -1R — the ladder always has a BoS exit whereas Mario non-TP outcomes are
  // by definition stop-outs. Ladder rows must stay consistent with existing f1/p1.
  // Appended, never prepended: applyModel() reads MGMTS[0].k for RANGE_REF and CAL_MGMT.
  {k:'f2',label:'Full @2R'},{k:'f3',label:'Full @3R'},{k:'f5',label:'Full @5R'},
  {k:'p2',label:'50% @1R + 2R runner'},{k:'p3',label:'50% @1R + 3R runner'},{k:'p5',label:'50% @1R + 5R runner'}];
const MGMTS_MARIO=[{k:'m_trail',label:'Full size \u2192 BE + trail'},{k:'m_half',label:'50% \u2192 uncapped trail'},
  {k:'m_cap3',label:'50% \u2192 cap 1.30'},{k:'m_cap5',label:'50% \u2192 cap 1.95'},
  {k:'m_f1',label:'Full TP @ 1R'},{k:'m_f2',label:'Full TP @ 2R'},{k:'m_f3',label:'Full TP @ 3R'},{k:'m_f5',label:'Full TP @ 5R'}];
const FOOT_LADDER='R math: 1R = full-ladder risk |avg(entry,L1) \u2212 SL|. Losses are full \u22121R (L1 always fills before the stop). Entry-only trades (L1 not filled) are scored at half size, so a "hit 1R" target requires the run to reach that <em>profit</em> \u2014 roughly twice the distance. Full @1R closes the whole position at 1R; 50% @1R banks half at 1R and trails the rest on BoS. Hybrid A picks per-trade by fill type: L1 filled \u2192 50% @1R + runner, entry-only \u2192 Full @1R (the V3 live default). Hybrid B is the inverse. Full @2R/3R/5R hold the whole position for a further target and exit on BoS if it never trades there \u2014 they never book a synthetic \u22121R. 50% + N-R runner locks half at 1R and aims the runner at the higher target; the runner exits on BoS if it doesn\u2019t trade there. Because entry-only trades run at half size, their targets sit at roughly double the distance: with L1 filled 2R/3R/5R are fib 0.828 / 1.104 / 1.656, entry-only 1.486 / 2.038 / 3.142.';
const FOOT_MARIO='R math: single order, no L1 leg. The fib is drawn stop-to-anchor \u2014 <b>fib 0 = stop</b>, 0.325 = entry, 0.65 = TP, 1.0 = anchor \u2014 so the TP is exactly double the entry and sits at 1.000R by construction, which is why Full TP @ 1R is a pure 1:1 bet. Excursions come from <b>SM Max Run / SM Trail Stop</b>, never the ladder\u2019s pair \u2014 the SM trail arms earlier, so the two models close at different moments. <b>Max Adverse decides every stop-out</b>: it is compared against fib 0, and a row without it (or with a 0, which is not a price) is left unscored rather than assumed to have survived \u2014 log it. Clearing the anchor moves the stop to break-even, so the trail cannot finish negative after that. 2R/3R/5R are fib 0.975 / 1.30 / 1.95.';
let MGMTS=MGMTS_LADDER.slice();
let MODEL='ladder';
let RANGE_REF='f1';
let CAL_MGMT='f1', CAL_SESS='all', ALL_TRADES=[], TRADES=[], CAL_MONTH=null, calDefaulted=false;
let PAIR='all';

function num(x){ return (x===null||x===undefined||x==='')?null:Number(x); }

// Super Mario (VCL V5). Geometry solves from the two prices already typed: entry sits at
// fib 0.325 of the span from fib 0 to the anchor, so fib0 = E - 0.325*range.
// Excursions come from SM Max Run / SM Trail Stop and NEVER from the ladder's VCL Max Run /
// VCL Trail Stop: the SM trail arms earlier because its levels sit nearer entry, so on the same
// trade the two models close at different moments and their excursions are different
// numbers. Falling back to the ladder's pair scores a trade neither model would have taken.
// Per-instrument tick grid. Notion now stores SL/SM Stop/L1 rounded to the tick (stops
// away from entry, L1 toward entry) — so we round Max Adverse to the same grid in the
// ADVERSE direction and compare exactly. No tolerance: with both sides on the grid and
// both rounded conservatively, a breach either happened or it didn't. Trades that merely
// grazed the stop score as stop-outs; Super Mario comes out slightly pessimistic rather
// than neutral, which is the correct direction to be wrong in for a backtest.
const TICK={MNQ:0.25, MES:0.25, MGC:0.10};
function marioR(row){
  const E=num(row.EntryPrice), A=num(row.anchor), MR_raw=num(row.SMMaxRun),
        BX=num(row.SMTrailStop), MA_raw=num(row.MaxAdverse);
  const out={m_f1:null,m_f2:null,m_f3:null,m_f5:null,m_trail:null,m_cap3:null,m_cap5:null,m_half:null};
  if(E==null||A==null||MR_raw==null||BX==null) return out;
  // Max Adverse settles the tighter stop and nothing else can stand in for it. Unknown
  // (null) leaves the row unscoreable; 0 is not "never went adverse" — Max Adverse is a
  // PRICE, and 0 would satisfy the Long breach test and book a full loss. Both exit here
  // rather than being assumed survived or assumed stopped.
  if(MA_raw==null||MA_raw===0) return out;
  // Fib redrawn 2026-08-24 so the stop IS fib 0: entry 0.325, TP 0.65 = exactly double it.
  // Same prices as the old 0.085/0.382/0.68 labelling — they agree to 3 cents on a 77pt
  // range — but the TP now lands on 1.000R by construction rather than 1.003R.
  const range=(A-E)/(1-0.325), zero=E-0.325*range, at=f=>zero+f*range;
  const dir=range>0?1:-1, stop=zero, oneR=Math.abs(E-stop);
  if(!oneR) return out;
  // Tick-grid rounding per audit §9 (Max Adverse) and §13 (Max Run). Both round in the
  // pessimistic direction so grid-alignment never manufactures a hit or manufactures a
  // survival.
  //   Max Adverse: AWAY from entry — floor for Long (adverse is below), ceil for Short.
  //   Max Run:     TOWARD entry — floor for Long (favourable is above; rounding down keeps
  //                us from crediting a target the raw print didn't reach), ceil for Short.
  // Note (§13 literal vs intent): §13's operation words say "ceiling for Long, floor for
  // Short" on Max Run, but the stated intent is "toward entry, never credit unless
  // genuinely reached" and "complement of Max Adverse". The operation implemented here
  // matches the intent (floor-Long / ceil-Short). If POTUS confirms the literal wording,
  // flip these two Math calls and re-audit.
  const tick=TICK[row.Pair]||null;
  const MA = tick==null ? MA_raw
           : dir>0 ? Math.floor(MA_raw/tick)*tick   // away from entry (down for Long)
                   : Math.ceil(MA_raw/tick)*tick;
  const MR = tick==null ? MR_raw
           : dir>0 ? Math.floor(MR_raw/tick)*tick   // toward entry (down for Long)
                   : Math.ceil(MR_raw/tick)*tick;
  const R=p=>dir*(p-E)/oneR;
  const stopped = dir*(MA-stop)<=0;                    // compare exactly, no epsilon
  if(stopped){ for(const k in out) out[k]=-1; return out; }
  const mr=R(MR), be=R(BX), tp=R(at(0.65));
  const hit=N=>mr>=N, tpHit=mr>=tp;                    // exact comparison — no TOL
  const runner=cap=>tpHit?0.5*tp+0.5*(hit(cap)?cap:be):-1;
  out.m_f1=hit(1)?1:-1; out.m_f2=hit(2)?2:-1; out.m_f3=hit(3)?3:-1; out.m_f5=hit(5)?5:-1;
  // Clearing the anchor moves the stop to break-even, so the trail cannot finish negative.
  out.m_trail = mr>=R(at(1)) ? Math.max(be,0) : be;
  out.m_cap3=runner(3); out.m_cap5=runner(5);
  out.m_half = tpHit ? 0.5*tp+0.5*be : -1;
  return out;
}

function computeR(row){
  const dir=row.Direction;
  const E=num(row.EntryPrice), L1=num(row.L1Price), SL=num(row.SLPrice),
        MR=num(row.VCLMaxRun), BX=num(row.VCLTrailStop);
  // L1 fill is DERIVED from Max Adverse, not read from the checkbox. L1 sits at a known
  // price, so "did price reach it" is a measurement, not a judgement — and keeping the
  // checkbox as a second source of truth for the same fact is how the two drift apart.
  // The checkbox stays as the fallback for rows logged before Max Adverse existed.
  //
  // Only the BEFORE case is derivable: Max Adverse is the worst price reached before Max
  // Run, so it cannot see an L1 that filled on a retrace afterwards. `L1 after Max Run`
  // stays checkbox-only because nothing else in the row carries it.
  const MA_l1=num(row.MaxAdverse), L1p=num(row.L1Price);
  const dirL1 = dir==='Long'?1:(dir==='Short'?-1:null);
  const bBox=!!row.L1before;
  const bMeasured = (MA_l1!=null && L1p!=null && dirL1!=null) ? dirL1*(MA_l1-L1p)<=1e-9 : null;
  const b = bMeasured===null ? bBox : bMeasured;
  const l1Conflict = bMeasured!==null && bMeasured!==bBox;   // surfaced, never silently resolved
  const a=!!row.L1after, l1=b||a;
  const dirM = dir==='Long'?1:(dir==='Short'?-1:null);
  const iniR = (E!=null&&L1!=null&&SL!=null)?Math.abs((E+L1)/2-SL):null;
  const avg = (E!=null&&L1!=null)?(E+L1)/2:null;
  const basisPeak = b?avg:E, posMpeak = b?1:0.5;
  const basisExit = l1?avg:E, posMexit = l1?1:0.5;
  let r={f1:null,p1:null,hyA:null,hyB:null,f2:null,f3:null,f5:null,p2:null,p3:null,p5:null};
  if(MR!=null&&BX!=null&&iniR&&dirM!=null&&avg!=null){
    const peakR   = posMpeak*(MR-basisPeak)*dirM/iniR;
    const posExit = posMexit*(BX-basisExit)*dirM/iniR;
    r.f1 = peakR>=1 ? 1 : posExit;
    r.p1 = peakR>=1 ? 0.5 + 0.5*posExit : posExit;
    r.hyA = l1 ? r.p1 : r.f1;
    r.hyB = l1 ? r.f1 : r.p1;
    // Full TP at higher R targets — same rule as f1, further threshold, miss exits on BoS.
    r.f2 = peakR>=2 ? 2 : posExit;
    r.f3 = peakR>=3 ? 3 : posExit;
    r.f5 = peakR>=5 ? 5 : posExit;
    // 50% locks at 1R, runner targets a further R multiple — mirrors p1's structure, with
    // the runner half capped at the target instead of trailing to BoS when the target trades.
    r.p2 = peakR>=1 ? (peakR>=2 ? 0.5+0.5*2 : 0.5+0.5*posExit) : posExit;
    r.p3 = peakR>=1 ? (peakR>=3 ? 0.5+0.5*3 : 0.5+0.5*posExit) : posExit;
    r.p5 = peakR>=1 ? (peakR>=5 ? 0.5+0.5*5 : 0.5+0.5*posExit) : posExit;
  }
  Object.assign(r, marioR(row));   // both models on the same row; the toggle only picks keys
  // raw is carried so the board can count what dropped out of scoring without either
  // scorer having to report it — see dropCounts().
  return {pair:row.Pair||null, session:row.Session||null, rangePct:num(row.RangePct), date:row.date||null, dir, l1, l1Conflict, l1Src:bMeasured===null?'checkbox':'maxAdverse', r, raw:row};
}

function applyPairFilter(){ TRADES = PAIR==='all' ? ALL_TRADES.slice() : ALL_TRADES.filter(t=>t.pair===PAIR); }

function serFor(mgmt,pool){ return pool.map(t=>t.r[mgmt]).filter(r=>r!=null); }
function stats(series){ const n=series.length; if(!n) return {n:0};
  const wins=series.filter(r=>r>0).length, total=series.reduce((a,b)=>a+b,0);
  return {n, wins, wr:wins/n, exp:total/n, total}; }
function maxLossStreak(series){ let run=0,len=0,worst=0,worstLen=0;
  for(const r of series){ if(r<0){run+=r;len++;if(run<worst){worst=run;worstLen=len;}} else {run=0;len=0;} }
  return {dd:Math.abs(worst), len:worstLen}; }
function maxDrawdown(series){ let cum=0,peak=0,mdd=0; for(const r of series){ cum+=r; if(cum>peak)peak=cum; const dd=peak-cum; if(dd>mdd)mdd=dd; } return mdd; }
function mgmtStat(mk,pool){ const s=stats(serFor(mk,pool)); s.mk=mk; s.mls=maxLossStreak(serFor(mk,pool)); return s; }
function bestOf(list){ const v=list.filter(s=>s.n>0); if(!v.length) return null; return v.sort((a,b)=>b.exp-a.exp)[0]; }
function bestByTotal(list){ const v=list.filter(s=>s.n>0); if(!v.length) return null; return v.sort((a,b)=>b.total-a.total)[0]; }
function bestMethod(rows){ let best=null; MGMTS.forEach(m=>{ const s=stats(rows.map(t=>t.r[m.k]).filter(x=>x!=null)); if(s.n>0 && (!best||s.exp>best.exp)) best={mk:m.k,label:m.label,n:s.n,exp:s.exp,tot:s.total,wr:s.wr}; }); return best; }
const SESS_ORDER=['Asia','Frankfurt','London','NY AM','NY','NY PM','Late'];
function sessRank(s){ const i=SESS_ORDER.indexOf(s); return i<0?99:i; }
function recoMap(pool){ const map={};
  [...new Set(pool.map(t=>t.session).filter(Boolean))].forEach(se=>{ const b=bestMethod(pool.filter(t=>t.session===se)); if(b) map[se]={mk:b.mk}; });
  return map; }
function recoSeries(pool){ const m=recoMap(pool); return pool.map(t=>{ const p=m[t.session]; return p?t.r[p.mk]:null; }).filter(x=>x!=null); }
function recoCard(pool){
  const sessions=[...new Set(pool.map(t=>t.session).filter(Boolean))];
  const rx=sessions.map(se=>({se,b:bestMethod(pool.filter(t=>t.session===se))})).filter(x=>x.b).sort((a,b)=>sessRank(a.se)-sessRank(b.se));
  const rser=recoSeries(pool), rs=stats(rser), rdd=maxDrawdown(rser), rmls=maxLossStreak(rser);
  if(!rx.length) return `<div class="card top" style="margin-bottom:12px"><div class="crown">🎯 Session prescription</div><div class="empty-note">No trades yet.</div></div>`;
  let sess='';
  rx.forEach(x=>{ const weak=x.b.exp<0.2, thin=x.b.n<5;
    sess+=`<div class="rowline"><span><span class="pill">${x.se}</span> → <b>${x.b.label}</b>${weak?' <span class="mini" style="color:#e0b341">· weak</span>':''}${thin?' <span class="mini">· thin</span>':''}</span><span class="${cls(x.b.exp)}">${fR(x.b.exp)} <span class="mini">${Math.round(x.b.wr*100)}% · n${x.b.n}</span></span></div>`; });
  const L=stats(pool.filter(t=>t.dir==='Long').map(t=>t.r.hyA).filter(x=>x!=null));
  const S=stats(pool.filter(t=>t.dir==='Short').map(t=>t.r.hyA).filter(x=>x!=null));
  let tilt=''; if(L.n&&S.n){ const fav=L.exp>S.exp?'Long':'Short'; tilt=`<div class="lbl" style="margin:14px 0 6px">Tilt</div><div class="rowline"><span>Direction</span><span>L <b class="${cls(L.exp)}">${fR(L.exp)}</b> · S <b class="${cls(S.exp)}">${fR(S.exp)}</b> → <b>${fav}</b></span></div>`; }
  const recoStats=`<div class="stats" style="margin:6px 0 2px">
    <div class="stat"><div class="k">Expectancy</div><div class="v ${cls(rs.exp)}">${fR(rs.exp)}</div></div>
    <div class="stat"><div class="k">Win rate</div><div class="v">${Math.round(rs.wr*100)}%</div></div>
    <div class="stat"><div class="k">Total R</div><div class="v ${cls(rs.total)}">${fR(rs.total)}</div></div>
    <div class="stat"><div class="k">Risk of ruin</div><div class="v neg">-${rdd.toFixed(2)}R <span class="mini">${rmls.len}× streak</span></div></div>
  </div><div class="mini" style="margin-bottom:4px">If each session ran its prescribed exit exclusively · n${rs.n}</div>`;
  return `<div class="card top" style="margin-bottom:12px"><div class="crown">🎯 Session prescription</div>${recoStats}<div class="lbl" style="margin:8px 0 6px">By session, in order</div>${sess}${tilt}<div class="mini" style="margin-top:8px">thin = &lt;5 trades</div></div>`;
}
function fR(x){ return (x>=0?'+':'')+x.toFixed(2)+'R'; }
function cls(x){ return x>0?'pos':(x<0?'neg':'mut'); }
function mgmtLabel(k){ if(k==='reco') return 'Strategic Rec'; return (MGMTS_LADDER.concat(MGMTS_MARIO).find(m=>m.k===k)||{}).label||k; }

function statBlock(s){ if(!s||!s.n) return '<div class="empty-note">No trades yet.</div>';
  return `<div class="stats">
    <div class="stat"><div class="k">Expectancy</div><div class="v ${cls(s.exp)}">${fR(s.exp)}</div></div>
    <div class="stat"><div class="k">Win rate</div><div class="v">${Math.round(s.wr*100)}%</div></div>
    <div class="stat"><div class="k">Total R</div><div class="v ${cls(s.total)}">${fR(s.total)}</div></div>
    <div class="stat"><div class="k">Trades</div><div class="v">${s.n}</div></div>
  </div>`; }

function matrixTable(pool){
  const rows=MGMTS.map(m=>({label:m.label, s:stats(serFor(m.k,pool))}));
  rows.sort((a,b)=> ((a.s.n?0:1)-(b.s.n?0:1)) || ((b.s.exp||-999)-(a.s.exp||-999)));
  let html='';
  rows.forEach((row,i)=>{ const s=row.s; const isBest=i===0&&s.n>0;
    html+=`<tr class="${isBest?'best':''}"><td>${row.label}</td>`+
          `<td class="${s.n?cls(s.exp):'mut'}">${s.n?fR(s.exp):'—'}</td>`+
          `<td>${s.n?Math.round(s.wr*100)+'%':'—'}</td>`+
          `<td class="${s.n?cls(s.total):'mut'}">${s.n?fR(s.total):'—'}</td>`+
          `<td class="mut">${s.n||'—'}</td></tr>`; });
  return `<table class="matrix"><thead><tr><th>Method</th><th>Exp</th><th>Win%</th><th>Tot</th><th>n</th></tr></thead><tbody>${html}</tbody></table>`;
}
function riskList(pool){
  const rows=MGMTS.map(m=>{ const ser=serFor(m.k,pool); return {label:m.label, dd:maxDrawdown(ser), mls:maxLossStreak(ser), n:ser.length}; });
  rows.sort((a,b)=> ((a.n?0:1)-(b.n?0:1)) || (a.dd-b.dd));
  let html='';
  rows.forEach(r=>{ html+=`<div class="rowline"><span>${r.label}</span><span>${r.n?'<span class="neg">-'+r.dd.toFixed(2)+'R</span>':'<span class="mut">—</span>'} <span class="mini">${r.n?'DD · '+r.mls.len+'× in a row':''}</span></span></div>`; });
  return html;
}

// Rows that never reach the matrix, counted for the ACTIVE model only — each model reads
// its own excursion pair, and a row the ladder scores fine can be unscoreable for Super
// Mario. Excluded = the inputs that model needs are blank. Invalid = Max Adverse is
// exactly 0, which is never a legitimate reading because Max Adverse is a PRICE; it is
// counted apart from "excluded" so a mislogged row reads as a logging fault, not a gap.
// Ladder rows are never gated on Max Adverse — computeR() does not read it.
function dropCounts(pool){
  const mario = MODEL==='mario';
  let excluded=0, invalid=0;
  pool.forEach(t=>{
    const raw=t.raw||{};
    const MR=num(mario?raw.SMMaxRun:raw.VCLMaxRun), BX=num(mario?raw.SMTrailStop:raw.VCLTrailStop);
    const MA=num(raw.MaxAdverse);
    if(mario && MA===0){ invalid++; return; }              // one row, one count
    if(MR==null||BX==null||(mario&&MA==null)) excluded++;
  });
  return {excluded, invalid};
}
function dropBadge(pool){
  const {excluded, invalid}=dropCounts(pool);
  if(!excluded && !invalid) return '';                     // nothing dropped, no badge
  const parts=[];
  if(excluded) parts.push(`<div class="midval">${excluded}</div><div class="mini">excluded</div>`);
  if(invalid)  parts.push(`<div class="midval neg">${invalid}</div><div class="mini">invalid</div>`);
  const tip = MODEL==='mario'
    ? 'Excluded: SM Max Run, SM Trail Stop or Max Adverse blank. Invalid: Max Adverse logged as 0, which is not a price.'
    : 'Excluded: VCL Max Run or VCL Trail Stop blank.';
  return `<div class="card daysbadge" title="${tip}">${parts.join('<div class="mini">\u00b7</div>')}</div>`;
}

function pairMixCard(){
  const c={}; ALL_TRADES.forEach(t=>{ const p=t.pair||'—'; c[p]=(c[p]||0)+1; });
  const keys=Object.keys(c).sort();
  if(keys.length<=1) return '';
  let rows='';
  keys.forEach(p=>{ const pct=Math.round(c[p]/ALL_TRADES.length*100); rows+=`<div class="rowline"><span>${p}</span><span><b>${c[p]}</b> <span class="mini">${pct}%</span></span></div>`; });
  return `<div class="card" style="margin-bottom:12px"><div class="lbl">Pair mix (whole log)</div>${rows}<div class="mini" style="margin-top:6px">Use the PAIR toggle in the header to filter to one instrument.</div></div>`;
}
function render(){
  const pool=TRADES, board=document.getElementById('board');
  if(!pool.length){ board.innerHTML='<div class="card"><div class="empty-note">No trades match this filter yet — try switching the PAIR toggle, or log trades to Trade Log — Futures.</div></div>'; renderCalendar(); return; }
  const mstats=MGMTS.map(m=>mgmtStat(m.k,pool));
  const best=bestOf(mstats);
  const sessions=[...new Set(pool.map(t=>t.session).filter(Boolean))];
  let sessRows = sessions.length ? '' : '<div class="empty-note">No Session tagged yet.</div>';
  sessions.forEach(se=>{ const sub=pool.filter(t=>t.session===se); const b=bestByTotal(MGMTS.map(m=>mgmtStat(m.k,sub)));
    const lbl=b?(MGMTS.find(m=>m.k===b.mk)||{}).label||b.mk:'—';
    sessRows+=`<div class="rowline"><span><span class="pill">${se}</span> ${lbl}</span><span class="${b?cls(b.total):'mut'}">${b?fR(b.total):'—'}</span></div>`; });
  let rangeRows=''; const rp=pool.filter(t=>t.rangePct!=null);
  if(!rp.length){ rangeRows='<div class="empty-note">No Range % logged yet.</div>'; }
  else { const groups={}; rp.forEach(t=>{ const k=(t.session||'—'); (groups[k]=groups[k]||[]).push(t); });
    Object.keys(groups).sort().forEach(k=>{ const g=groups[k]; const wins=g.filter(t=>t.r[RANGE_REF]>0); const src=wins.length?wins:g;
      const vals=src.map(t=>t.rangePct); const mn=Math.min(...vals), mx=Math.max(...vals);
      const avg=vals.reduce((a,b)=>a+b,0)/vals.length;
      const band = mn===mx ? mn+'%' : mn+'–'+mx+'%';
      rangeRows+=`<div class="rowline"><span><span class="pill">${k}</span></span><span><b>${band}</b> <span class="mini">avg ${avg.toFixed(2)}% · ${wins.length?'wins':'all'} n${src.length}</span></span></div>`; }); }
  const tdays=ss=>new Set(ss.filter(t=>t.date).map(t=>t.date)).size;
  let freqSess=''; [...new Set(pool.map(t=>t.session).filter(Boolean))].forEach(se=>{
    const sub=pool.filter(t=>t.session===se); const d=tdays(sub);
    freqSess+=`<div class="rowline"><span><span class="pill">${se}</span></span><span><b>${sub.length}</b> <span class="mini">${d?(sub.length/d).toFixed(1):'0'}/day · ${d}d</span></span></div>`;
  });
  const totDays=tdays(pool);
  const pairBadge = PAIR==='all' ? '' : ` <span class="pill" style="margin-left:6px">${PAIR}</span>`;
  board.innerHTML=`
    <div class="daysbadge-row"><div class="card daysbadge"><div class="midval">${totDays}</div><div class="mini">trading day${totDays===1?'':'s'} logged${pairBadge}</div></div>${dropBadge(pool)}</div>
    ${pairMixCard()}
    <div class="grid2">
      <div><div class="card" style="margin-bottom:12px"><div class="lbl">Best methodology</div><div class="combo-md">${best?(MGMTS.find(m=>m.k===best.mk)||{}).label||best.mk:'—'}</div>${statBlock(best)}</div></div>
      <div>${recoCard(pool)}</div>
    </div>
    <div class="card" style="margin-bottom:12px"><div class="lbl">Expectancy matrix — ranked</div>${matrixTable(pool)}</div>
    <div class="card" style="margin-bottom:12px"><div class="lbl">Risk of ruin — per methodology</div>${riskList(pool)}
      <div class="mini" style="margin-top:8px">DD = worst peak-to-trough in cumulative R · streak = losing trades in a row · safest → riskiest</div>
    </div>
    <div class="grid2">
      <div class="card"><div class="lbl">Best method by session</div>${sessRows}</div>
      <div class="card"><div class="lbl">Optimal Range % · by session</div>${rangeRows}</div>
    </div>
    <div class="card" style="margin-bottom:12px"><div class="lbl">Trades by session · avg/day</div>${freqSess}</div>
    <div class="card cal" id="calCard"></div>`;
  renderCalendar();
}

function ym(d){ return d? d.slice(0,7):null; }
function calControls(){
  const mgmtOpts=`<option value="reco" ${CAL_MGMT==='reco'?'selected':''}>★ Strategic Rec</option>`+MGMTS.map(m=>`<option value="${m.k}" ${CAL_MGMT===m.k?'selected':''}>${m.label}</option>`).join('');
  const sessions=[...new Set(TRADES.map(t=>t.session).filter(Boolean))];
  const sessOpts=['all',...sessions].map(s=>`<option value="${s}" ${CAL_SESS===s?'selected':''}>${s==='all'?'All sessions':s}</option>`).join('');
  return `<div class="calfilters">
    <div class="cf"><span class="cflbl">Method</span><select class="calsel" data-f="mgmt">${mgmtOpts}</select></div>
    <div class="cf"><span class="cflbl">Session</span><select class="calsel" data-f="sess">${sessOpts}</select></div>
  </div>`;
}
function wireCalControls(){
  document.querySelectorAll('#calCard .calsel').forEach(sel=>{
    sel.onchange=()=>{ const f=sel.dataset.f, v=sel.value;
      if(f==='mgmt') CAL_MGMT=v; else if(f==='sess') CAL_SESS=v;
      renderCalendar(); };
  });
}
function calTitle(){
  const parts=[mgmtLabel(CAL_MGMT)];
  if(CAL_SESS!=='all') parts.push(CAL_SESS);
  if(PAIR!=='all') parts.push(PAIR);
  return parts.join(' · ');
}
function renderCalendar(){
  const card=document.getElementById('calCard'); if(!card) return;
  if(!calDefaulted && TRADES.length){ CAL_MGMT='reco'; CAL_SESS='all'; calDefaulted=true; }
  const controls=calControls();
  const filtered=TRADES.filter(t=>(CAL_SESS==='all'||t.session===CAL_SESS));
  const dated=filtered.filter(t=>t.date);
  const months=[...new Set(dated.map(t=>ym(t.date)))].sort();
  if(!months.length){
    card.innerHTML=`<div class="lbl">Calendar — net R (${calTitle()})</div>${controls}<div class="empty-note">No trades match this filter yet.</div>`;
    wireCalControls(); return;
  }
  if(!CAL_MONTH||!months.includes(CAL_MONTH)) CAL_MONTH=months[months.length-1];
  const idx=months.indexOf(CAL_MONTH), [Y,M]=CAL_MONTH.split('-').map(Number);
  const first=new Date(Y,M-1,1), start=first.getDay(), dim=new Date(Y,M,0).getDate();
  const byDay={}; const rmap=CAL_MGMT==='reco'?recoMap(TRADES):null;
  dated.filter(t=>ym(t.date)===CAL_MONTH).forEach(t=>{ const d=Number(t.date.slice(8,10)); const rp=rmap?rmap[t.session]:null; const r=rmap?(rp?t.r[rp.mk]:null):t.r[CAL_MGMT];
    if(r==null) return; (byDay[d]=byDay[d]||{sum:0,n:0}); byDay[d].sum+=r; byDay[d].n++; });
  const monthName=first.toLocaleString('en-US',{month:'long',year:'numeric'});
  let cells=''; for(let i=0;i<start;i++) cells+='<div class="day empty"></div>';
  for(let d=1;d<=dim;d++){ const x=byDay[d]; let c='day', body='';
    if(x){ c+= x.sum>0?' win':(x.sum<0?' loss':''); body=`<div class="dr ${cls(x.sum)}">${fR(x.sum)}</div><div class="dc">${x.n} trade${x.n>1?'s':''}</div>`; }
    cells+=`<div class="${c}"><div class="dn">${d}</div>${body}</div>`; }
  card.innerHTML=`<div class="lbl">Calendar — net R (${calTitle()})</div>
    ${controls}
    <div class="calhd"><button ${idx<=0?'disabled':''} id="pm">‹</button><div class="month">${monthName}</div><button ${idx>=months.length-1?'disabled':''} id="nm">›</button></div>
    <div class="dow"><div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div></div>
    <div class="days">${cells}</div>`;
  wireCalControls();
  const pm=document.getElementById('pm'), nm=document.getElementById('nm');
  if(pm) pm.onclick=()=>{ CAL_MONTH=months[idx-1]; renderCalendar(); };
  if(nm) nm.onclick=()=>{ CAL_MONTH=months[idx+1]; renderCalendar(); };
}

function applyModel(){
  MGMTS = MODEL==='mario' ? MGMTS_MARIO.slice() : MGMTS_LADDER.slice();
  RANGE_REF = MGMTS[0].k; CAL_MGMT = MGMTS[0].k;
  const f=document.getElementById('foot'); if(f) f.innerHTML = MODEL==='mario'?FOOT_MARIO:FOOT_LADDER;
}
function wireModelTg(){
  document.querySelectorAll('#modelTg button').forEach(b=>{
    b.onclick=()=>{ const v=b.getAttribute('data-m'); if(v===MODEL) return;
      document.querySelectorAll('#modelTg button').forEach(x=>x.classList.toggle('on',x===b));
      MODEL=v; applyModel(); render(); };
  });
}
function wirePairTg(){
  document.querySelectorAll('#pairTg button').forEach(b=>{
    b.onclick=()=>{ const v=b.dataset.p; if(v===PAIR) return;
      document.querySelectorAll('#pairTg button').forEach(x=>x.classList.toggle('on',x===b));
      PAIR=v; applyPairFilter(); render(); };
  });
}

const WORKER='https://vcl-clarity-scoreboard.potus-eth.workers.dev/?view=v4-futures';
let firstLoad=true;
async function fetchTrades(){
  try{
    const res=await fetch(WORKER+'&t='+Date.now(),{cache:'no-store'});
    if(!res.ok) throw new Error('worker '+res.status);
    const j=await res.json();
    if(j.error) throw new Error(j.error);
    return {j, src:'live'};
  }catch(e){
    const res=await fetch('v4-futures-data.json?t='+Date.now(),{cache:'no-store'});
    if(!res.ok) throw new Error('data '+res.status);
    return {j:await res.json(), src:'cached'};
  }
}
async function poll(){
  const st=document.getElementById('status');
  try{
    const {j,src}=await fetchTrades();
    const rows=(j&&j.trades)||[];
    ALL_TRADES=rows.map(computeR).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    applyPairFilter();
    st.textContent=`${TRADES.length} of ${ALL_TRADES.length} trade${ALL_TRADES.length===1?'':'s'} · ${PAIR.toUpperCase()} · ${src} · ${new Date().toLocaleTimeString()}`;
    render();
    firstLoad=false;
  }catch(e){
    if(firstLoad){
      st.innerHTML='<span class="err">Worker unreachable: '+(e.message||'')+'</span>';
      document.getElementById('board').innerHTML='<div class="card"><div class="empty-note">Worker unreachable and no cached snapshot available. Retrying every 5s.</div></div>';
      renderCalendar();
    }
  }
}
wirePairTg(); wireModelTg(); applyModel();
poll();
setInterval(poll,5000);
</script>
</body></html>
