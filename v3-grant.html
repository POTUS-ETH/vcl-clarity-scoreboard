</style></head><body>
<div class="wrap">
  <div class="hd">
    <div><h1>VCL V5 — SINGLE-ORDER FIB</h1><div class="sub">One entry, one stop, one geometry · SOL / BTC / ETH · 1m · full-position targets vs. 50%-off with a capped runner</div></div>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <div class="tg" id="pairTg"><button data-p="all" class="on">ALL</button><button data-p="SOL">SOL</button><button data-p="BTC">BTC</button><button data-p="ETH">ETH</button></div>
      <div class="mini" id="status">loading…</div>
    </div>
  </div>
  
  <div id="board"></div>
</div>
<script>
/* ============================== stats primitives ============================== */
const num=x=>(x===null||x===undefined||x==='')?null:Number(x);
const fR=x=>{const v=Math.abs(x)<0.005?0:x; return (v>=0?'+':'')+v.toFixed(2)+'R';};
const fDD=d=>d<0.005?'0.00R':'-'+d.toFixed(2)+'R';
const cls=x=>x>0.005?'pos':(x<-0.005?'neg':'mut');
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const sd=a=>{if(a.length<2)return 0; const m=mean(a); return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1));};
const TTAB={2:4.303,3:3.182,4:2.776,5:2.571,6:2.447,7:2.365,8:2.306,9:2.262,10:2.228,11:2.201,12:2.179,13:2.160,14:2.145,15:2.131,16:2.120,17:2.110,18:2.101,19:2.093,20:2.086,21:2.080,22:2.074,23:2.069,24:2.064,25:2.060,26:2.056,27:2.052,28:2.048,29:2.045,30:2.042};
const tCrit=df=>df<2?12.7:df>30?1.96:TTAB[df];
function ci95(series){
  const a=series.filter(x=>x!=null), n=a.length;
  if(!n) return {n:0,mean:null,se:null,lo:null,hi:null};
  const m=mean(a), s=sd(a), se=n>1?s/Math.sqrt(n):0, t=tCrit(n-1);
  return {n, mean:m, se, lo:m-t*se, hi:m+t*se};
}
function maxDD(series){let c=0,p=0,m=0; for(const r of series){c+=r; if(c>p)p=c; const d=p-c; if(d>m)m=d;} return m;}
function maxLossStreak(series){let c=0,m=0; for(const r of series){ if(r<-0.005){ c++; if(c>m)m=c; } else c=0; } return m;}
function maxWinStreak(series){let c=0,m=0; for(const r of series){ if(r>0.005){ c++; if(c>m)m=c; } else c=0; } return m;}
function fullStats(series){
  const ci=ci95(series);
  const wins=series.filter(x=>x>0.005).length, losses=series.filter(x=>x<-0.005).length;
  const scratches=series.length-wins-losses;
  return {...ci, wins, losses, scratches, winRate:(wins+losses)?wins/(wins+losses):0, total:series.reduce((a,b)=>a+b,0), dd:maxDD(series), streak:maxLossStreak(series), winStreak:maxWinStreak(series)};
}

/* ============================== equity curve (identical to Craig's board) ============================== */
let _eqSeq=0;
function equityCurveSVG(series, w, h){
  w=w||300; h=h||44;
  if(!series.length) return `<svg viewBox="0 0 ${w} ${h}"><line x1="0" y1="${h/2}" x2="${w}" y2="${h/2}" stroke="var(--zero)" stroke-width="1"/><text x="4" y="${h/2+4}" fill="#3d4553" font-size="10">no data</text></svg>`;
  const cum=[0]; series.forEach(r=>cum.push(cum[cum.length-1]+r));
  const minV=Math.min(0,...cum), maxV=Math.max(0,...cum);
  const range=(maxV-minV)||1, n=cum.length-1;
  const pad=3;
  const px=i=>(i/n)*w;
  const py=v=>pad+(1-(v-minV)/range)*(h-2*pad);
  const base=py(0);
  const pts=cum.map((v,i)=>({x:px(i), y:py(v), v}));
  const segs=[];
  let seg=[pts[0]], segSign=pts[0].v<0?'neg':'pos';
  for(let i=1;i<pts.length;i++){
    const a=pts[i-1], b=pts[i];
    if((a.v<0&&b.v>0)||(a.v>0&&b.v<0)){
      const t=a.v/(a.v-b.v);
      const cross={x:a.x+(b.x-a.x)*t, y:base, v:0};
      seg.push(cross);
      segs.push({pts:seg, sign:segSign});
      segSign=b.v<0?'neg':'pos';
      seg=[cross,b];
    } else {
      seg.push(b);
      if(b.v<0) segSign='neg'; else if(b.v>0) segSign='pos';
    }
  }
  segs.push({pts:seg, sign:segSign});
  const COL={pos:'#3fb950', neg:'var(--neg)'};
  const gid='eqg'+(_eqSeq++);
  const defs=`<defs>
    <linearGradient id="${gid}p" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${COL.pos}" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="${COL.pos}" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="${gid}n" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${COL.neg}" stop-opacity="0"/>
      <stop offset="100%" stop-color="${COL.neg}" stop-opacity="0.32"/>
    </linearGradient>
  </defs>`;
  let body='';
  segs.forEach(s=>{
    if(s.pts.length<2) return;
    const line=s.pts.map((p,i)=>(i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
    const first=s.pts[0], last=s.pts[s.pts.length-1];
    const area=`${line} L${last.x.toFixed(1)},${base.toFixed(1)} L${first.x.toFixed(1)},${base.toFixed(1)} Z`;
    body += `<path d="${area}" fill="url(#${gid}${s.sign==='pos'?'p':'n'})" stroke="none"/><path d="${line}" fill="none" stroke="${COL[s.sign]}" stroke-width="1.5"/>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}">
    ${defs}
    <line x1="0" y1="${base.toFixed(1)}" x2="${w}" y2="${base.toFixed(1)}" stroke="var(--zero)" stroke-width="1"/>
    ${body}
  </svg>`;
}

/* ============================== VCL V5 schema — single-order fib only ==============================
   Setup Type is gone from the log: there is only one structure now, so a column that always
   held the same value was pure overhead. The formulas no longer gate on it either.
   Six outcomes, two families, off ONE fib. Only four chart levels drive all of them:
   1R = fib 0.65 (the TP) · 2R = 0.975 · 3R = 1.30 · 5R = 1.95.
   The families share the upper two levels at different position sizes — a half-size
   runner must make 2R to move the position 1R, so "runner capped at 1.30" (3R on half)
   and "full TP at 3R" are the same price, scored on different size. */
// Crypto is Super Mario only (2026-08-25). The VCL ladder was retired from this board —
// the L1 leg forces range-sized trades and creates a leverage problem in crypto. The
// VCL vs Super Mario head-to-head lives on the futures board, where both models are
// practicable. A split answer across asset classes is the expected shape of the result.

const FAMILIES_MARIO=[
  {k:'full', label:'Full position · no partial',
   blurb:'Close everything at one fixed target. Binary by construction: +NR if Max Run reached it, -1R if not. No partial, no trail, no breakeven tier.'},
  {k:'part', label:'50% off at the 0.65 TP, runner capped',
   blurb:'Bank half at the 0.65 TP (worth 0.5R, since the TP sits at exactly 1R), stop to breakeven, then the runner. Capped variants full-close the runner at the named fib; the baseline lets the BOS trail run uncapped.'},
];
const MGMT_MARIO=[
  {key:'m_f1', fam:'full', name:'Full TP @ 0.65 for 1R',  short:'F1R', lvl:'fib 0.65',
   desc:'Whole position off at 1R — the 0.65 TP itself. A pure 1:1 bet; expectancy is just 2 x win% - 1.'},
  {key:'m_f2', fam:'full', name:'Full TP @ 0.98 for 2R',  short:'F2R', lvl:'fib 0.98',
   desc:'Whole position off at 2R, just under the 1-of-fib anchor.'},
  {key:'m_f3', fam:'full', name:'Full TP @ 1.30 for 3R',  short:'F3R', lvl:'fib 1.30',
   desc:'Whole position off at 3R, the 1.30 extension.'},
  {key:'m_f5', fam:'full', name:'Full TP @ 1.95 for 5R',  short:'F5R', lvl:'fib 1.95',
   desc:'Whole position off at 5R. Needs a run well past the golden-ratio extension.'},
  {key:'m_trail', fam:'full', name:'Full size @ BE + trail', short:'FTrail', lvl:'no partial, no ceiling',
   desc:'No partial at all. Full size to breakeven, then trail on BOS and take whatever structure gives. Clearing the anchor moves the stop to breakeven, so this cannot finish negative once the anchor prints.'},
  {key:'m_cap3', fam:'part', name:'50% @ 0.65 → cap 1.30 for 2R', short:'C2R', lvl:'runner 3R = 2R net',
   desc:'Half off at the TP, runner trails on BOS but full-closes at fib 1.30. Delivers +2R; if 1.30 never prints the runner is scored at the real BOS exit.'},
  {key:'m_cap5', fam:'part', name:'50% @ 0.65 → cap 1.95 for 3R', short:'C3R', lvl:'runner 5R = 3R net',
   desc:'Same, capped at fib 1.95 instead. Delivers +3R, giving the runner more room before it is taken off.'},
  {key:'m_cap7', fam:'part', name:'50% @ 0.65 → cap 2.60 for 4R', short:'C4R', lvl:'runner 7R = 4R net',
   desc:'Capped at fib 2.60. A half-size runner must reach 7R for the position to deliver 4R.'},
  {key:'m_cap9', fam:'part', name:'50% @ 0.65 → cap 3.25 for 5R', short:'C5R', lvl:'runner 9R = 5R net',
   desc:'Capped at fib 3.25. A half-size runner must reach 9R for the position to deliver 5R.'},
  {key:'m_half', fam:'part', name:'50% @ 0.65 → trail, uncapped', short:'Trail', lvl:'no ceiling',
   desc:'The incumbent: half off at the 0.65 TP, then let the BOS trail run with no target at all. Included as the baseline the capped variants are being tested against.', baseline:true},
];
const MGMT=MGMT_MARIO.slice(), FAMILIES=FAMILIES_MARIO.slice();
const byFam=f=>MGMT.filter(m=>m.fam===f);

let TRADES=[], ALL=[], PAIR='all', firstLoad=true, lastOk=null;
const TF='1m';  // this board tests 1m only, across SOL/BTC/ETH
const OPEN=new Set();

/* ============================== series / stats over Grant's precomputed R fields ============================== */
function seriesFor(prop,pool){ return pool.map(t=>RV(t,prop)).filter(v=>v!=null&&!isNaN(v)); }
function statsFor(prop,pool){ return fullStats(seriesFor(prop,pool)); }
function paired(a,b,pool){
  const d=[]; pool.forEach(t=>{const x=RV(t,a),y=RV(t,b); if(x!=null&&y!=null) d.push(y-x);});
  return ci95(d);
}

/* ============================== filters ============================== */
const SESRANK={'Asia':0,'London':1,'NY AM':2,'NY PM':3};
const chrono=(a,b)=>String(a.date||'').localeCompare(String(b.date||'')) ||
  ((SESRANK[a.Session]??9)-(SESRANK[b.Session]??9)) || String(a.created||'').localeCompare(String(b.created||''));
// Tick grid, derived from the logged price precision rather than assumed: every row on
// this board is SOL and every price is quoted to 0.01.
const TICK={SOL:0.01, BTC:0.1, ETH:0.01};
const MA_REQUIRED=false;  // SM-native log: the trade was managed against this exact stop
function marioR(row){
  const E=num(row.EntryPrice), A=num(row.anchor), MR_raw=num(row.SMMaxRun),
        BX=num(row.SMTrailStop), MA_raw=num(row.MaxAdverse);
  const out={m_f1:null,m_f2:null,m_f3:null,m_f5:null,m_trail:null,m_cap3:null,m_cap5:null,m_cap7:null,m_cap9:null,m_half:null};
  if(E==null||A==null||MR_raw==null||BX==null) return out;
  // Max Adverse settles the tighter stop and nothing else can stand in for it. Unknown
  // (null) leaves the row unscoreable; 0 is not "never went adverse" — Max Adverse is a
  // PRICE, and 0 would satisfy the Long breach test and book a full loss. Both exit here
  // rather than being assumed survived or assumed stopped.
  // MA_REQUIRED is the one honest difference between the two boards, and it is about
  // EVIDENCE, not preference. Futures rows were logged under the VCL ladder, whose stop
  // sits below the Super Mario stop — such a row can read "survived" and still have
  // breached fib 0 on the way, so only Max Adverse settles it and without it the row is
  // unscoreable. Crypto rows were logged natively against this exact fib, so the logged
  // trail exit is real evidence of where the trade ended. Max Adverse still wins wherever
  // it is present, on either board.
  if((MA_raw==null||MA_raw===0) && MA_REQUIRED) return out;
  // Fib redrawn 2026-08-24 so the stop IS fib 0: entry 0.325, TP 0.65 = exactly double it.
  // Same prices as the old 0.085/0.382/0.68 labelling — they agree to 3 cents on a 77pt
  // range — but the TP now lands on 1.000R by construction rather than 1.003R.
  const range=(A-E)/(1-0.325), zero=E-0.325*range, at=f=>zero+f*range;
  const dir=range>0?1:-1, stop=zero, oneR=Math.abs(E-stop);
  if(!oneR) return out;
  // Tick-grid rounding per audit §9 (Max Adverse) and §13 (Max Run). Both round in the
  // pessimistic direction so grid-alignment never manufactures a hit or manufactures a
  // survival.
  //   Max Adverse: AWAY from entry — floor for Long (adverse is below), ceil for Short.
  //   Max Run:     TOWARD entry — floor for Long (favourable is above; rounding down keeps
  //                us from crediting a target the raw print didn't reach), ceil for Short.
  // Note (§13 literal vs intent): §13's operation words say "ceiling for Long, floor for
  // Short" on Max Run, but the stated intent is "toward entry, never credit unless
  // genuinely reached" and "complement of Max Adverse". The operation implemented here
  // matches the intent (floor-Long / ceil-Short). If POTUS confirms the literal wording,
  // flip these two Math calls and re-audit.
  const tick=TICK[row.Pair]||null;
  const MA = (MA_raw==null||MA_raw===0) ? null
           : tick==null ? MA_raw
           : dir>0 ? Math.floor(MA_raw/tick)*tick   // away from entry (down for Long)
                   : Math.ceil(MA_raw/tick)*tick;
  const MR = tick==null ? MR_raw
           : dir>0 ? Math.floor(MR_raw/tick)*tick   // toward entry (down for Long)
                   : Math.ceil(MR_raw/tick)*tick;
  const R=p=>dir*(p-E)/oneR;
  // Max Adverse is the direct measurement; the exit price is the fallback and only tells
  // us the trade ENDED at or through the stop. It cannot see an excursion the trade
  // recovered from, so a board running the fallback can still miss a real stop-out.
  const stopped = MA!=null ? dir*(MA-stop)<=0 : dir*(BX-stop)<=0;
  if(stopped){ for(const k in out) out[k]=-1; return out; }
  const mr=R(MR), be=R(BX), tp=R(at(0.65));
  const hit=N=>mr>=N, tpHit=mr>=tp;                    // exact comparison — no TOL
  // Same correction on the partial family. If the TP never printed there was no partial,
  // so the whole position rode the trail — score the real exit. The old -1R put a full
  // loss on trades that never lost: a row surviving its stop and trailing out at +0.26R
  // scored -1.00R here, a 1.26R error.
  const runner=cap=>tpHit?0.5*tp+0.5*(hit(cap)?cap:be):be;
  // A missed target is NOT a loss. The `stopped` branch above already booked every real
  // stop-out at -1R, so anything reaching here survived its stop and was closed on the
  // trail — score it there. Booking -1R would assert a stop-out that never traded: on the
  // current log 0 of 4 rows hit the SM stop, yet the old rule printed -1R in six cells.
  // (The ladder side has always scored misses this way; this makes the two agree.)
  // Caveat kept in view: the trail exit is a proxy. A fixed-target rule does not trail, so
  // live this position would still be open at session end. It is the closest logged price.
  out.m_f1=hit(1)?1:be; out.m_f2=hit(2)?2:be; out.m_f3=hit(3)?3:be; out.m_f5=hit(5)?5:be;
  // Clearing the anchor moves the stop to break-even, so the trail cannot finish negative.
  out.m_trail = mr>=R(at(1)) ? Math.max(be,0) : be;
  out.m_cap3=runner(3); out.m_cap5=runner(5); out.m_cap7=runner(7); out.m_cap9=runner(9);
  out.m_half = tpHit ? 0.5*tp+0.5*be : be;
  return out;
}

function applyFilters(){
  // This board scores its own trades. It used to read eight precomputed Notion formula
  // columns; those coerced a blank Max Run to 0 and so booked a full -1R loss on all 32
  // imported rows that have no outcome data yet, and drove the BE+trail method to a -127R
  // mean out of raw price arithmetic. Scoring here returns null for a row without
  // evidence, and the drop counter reports it, so an unfilled row is visibly absent
  // rather than silently counted as a loss.
  TRADES = ALL.filter(t => t.Timeframe===TF && (PAIR==='all' || t.Pair===PAIR)).sort(chrono);
  // Adapter. The shared components read t.session / t.pair; this board's payload spells
  // them Session / Pair. Normalising here means every ported component runs unchanged.
  TRADES.forEach(t=>{
    t.session=t.session||t.Session; t.pair=t.pair||t.Pair;
    t.r = marioR({EntryPrice:t.entry, anchor:t.anchor, SMMaxRun:t.maxRun,
                  SMTrailStop:t.bosExit, MaxAdverse:t.maxAdverse, Pair:t.Pair});
  });
}

/* ============================== L0 — the verdict ==============================
   Deliberately NOT a winner's podium. At this sample nothing separates, and a hero
   card with a rising green curve makes a claim the data cannot support. A board that
   can decline to crown something is the only kind worth trusting when it does. */
function verdictLine(pool){
  const rows=MGMT.map(m=>({m,s:statsFor(m.key,pool)})).filter(x=>x.s.n);
  if(!rows.length) return '';
  rows.sort((a,b)=>b.s.mean-a.s.mean);
  const sig=rows.filter(r=>r.s.lo>0);
  const days=new Set(pool.map(t=>t.date).filter(Boolean)).size;
  const n=rows[0].s.n;
  const width=rows[0].s.hi-rows[0].s.lo;
  const spread=rows[0].s.mean-rows[Math.min(3,rows.length-1)].s.mean;
  const head = sig.length
    ? `${n} TRADES · ${days} DAY${days===1?'':'S'} · ${sig.length} OUTCOME${sig.length===1?'':'S'} CLEAR ZERO`
    : `${n} TRADES · ${days} DAY${days===1?'':'S'} · NOTHING SEPARATES YET`;
  const body = sig.length
    ? `${sig.map(r=>r.m.name).join(', ')} hold${sig.length===1?'s':''} above zero at 95%. Everything else is still a lean.`
    : `The top four land within ${fR(spread)} of each other, and this board resolves about ${'±'+ (width/2).toFixed(1)}R. No change indicated — keep the trail.`;
  return `<div style="border-left:2px solid var(--closeable);padding:2px 0 2px 10px;margin-bottom:11px">
    <div style="font-size:15px;font-weight:700;color:var(--ink);letter-spacing:.3px">${head}</div>
    <div style="font-size:11px;color:var(--mut);line-height:1.5;margin-top:2px">${body}</div></div>`;
}

/* ============================== L0 — the winner card ==============================
   Names a leader, but the card grades its own claim. The lead is only called a result
   when the leader's own interval clears zero AND its paired margin over the runner-up
   clears zero too -- those are different questions and both have to pass. Otherwise it
   still shows the leader (that is what a scoreboard is for) and says outright that the
   gap has not separated, so the headline can never outrun the evidence under it. */
function winnerCard(pool){
  const rows=MGMT.map(m=>({m,s:statsFor(m.key,pool)})).filter(x=>x.s.n);
  if(!rows.length) return '';
  // One definition of the leader, shared with the matrix. Sorting this card by mean while
  // the table below ranked on the interval put two different winners on the same screen.
  const LDR=leaderOf(pool); const best=LDR.best, up=LDR.up, order=LDR.order, s=best.s;
  const beatsZero = s.lo>0;
  const margin = up ? paired(up.m.key,best.m.key,pool) : null;
  const beatsNext = margin && margin.n>0 && margin.lo>0;
  const solid = beatsZero && beatsNext;
  const ties = rows.slice(1).filter(r=>{
    const p=paired(best.m.key,r.m.key,pool); return p.n>0 && !(p.lo>0);
  });
  const days=new Set(pool.map(t=>t.date).filter(Boolean)).size;
  return `<div class="card answer">
    <div class="eyebrow">${solid?'Leader — clears zero and beats the runner-up':'Leading so far — not yet a separation'}</div>
    <div class="policy">${best.m.name} <span class="mut" style="font-size:12px;font-weight:400">${best.m.lvl}</span></div>
    <div class="band"><div class="bandnum ${cls(s.mean)}">${fR(s.mean)}</div>
      <div class="bandci">expectancy · 95% CI [${fR(s.lo)}, ${fR(s.hi)}] · n${s.n} over ${days} day${days===1?'':'s'}
      ${beatsZero?'<span class="sig">clears zero</span>':'<span class="mut">· interval still crosses zero</span>'}</div></div>
    <div class="curve">${equityCurveSVG(seriesFor(best.m.key,pool),600,70)}</div>
    <div class="fsub">${best.m.desc}</div>
    <div class="stats">
      <div class="stat"><div class="k">Win rate</div><div class="v">${Math.round(s.winRate*100)}% <span class="mini">${s.wins}/${s.scratches}/${s.losses}</span></div></div>
      <div class="stat"><div class="k">Total R</div><div class="v ${cls(s.total)}">${fR(s.total)}</div></div>
      <div class="stat"><div class="k">Max drawdown</div><div class="v neg">${fDD(s.dd)}</div></div>
      <div class="stat"><div class="k">LIS</div><div class="v ${s.streak?'neg':'mut'}">${s.streak}</div></div>
      <div class="stat"><div class="k">WIS</div><div class="v ${s.winStreak?'pos':'mut'}">${s.winStreak}</div></div>
      <div class="stat"><div class="k">Trading days</div><div class="v mut">${days}</div></div>
    </div>
    ${up?`<div class="ctlstrip" style="margin-top:9px">Runner-up: <b style="color:var(--ink)">${up.m.name}</b> at ${fR(up.s.mean)} — leader is ahead by
      <b class="${margin.n?cls(margin.mean):''}">${margin.n?fR(margin.mean):'—'}</b> paired${beatsNext?' <span class="sig">significant</span>':' · not significant'}.</div>`:''}
    ${solid?'':`<div class="caveat" style="margin-top:9px">
      <b>Read this as a lean, not a verdict.</b> ${ties.length?`Statistically tied with: ${ties.map(t=>t.m.name).join(', ')}. `:''}
      ${beatsZero?'The leader clears zero on its own, but its margin over the runner-up does not — those are different claims.':'The leader\'s own interval still includes zero.'}</div>`}
  </div>`;
}

/* ============================== L1 — the reach ladder ==============================
   The most honest object available: the six trades themselves, with the four decision
   levels drawn across them. Every strategy on this board is just "which horizontal line
   do you exit at" — raise it and fewer bars clear but each pays more. One picture holds
   the whole question, and it is a chart, which is what Grant actually reads. */
function reachLadderSVG(pool){
  // Above ~24 trades the per-trade bars stop being readable, so the same data is
  // drawn as a survival curve instead: what share of trades reached at least X R.
  // Same information, and it gets MORE legible as n grows rather than less.
  // Always the survival curve — POTUS chose one format for both boards, and it is the
  // one that gets MORE legible as n grows. The per-trade bar variant is retired.
  return reachCurveSVG(pool);
  const dirOf=t=>t.Direction==='Long'?1:-1;
  const rOf=t=>{const d=dirOf(t),risk=d*(t.entry-t.stop);
    return (risk>0 && t.maxRun!=null) ? d*(t.maxRun-t.entry)/risk : null;};
  const rows=pool.map(t=>({t,r:rOf(t)})).filter(x=>x.r!=null);
  if(!rows.length) return '';
  const W=1000,H=250,padL=6,padR=138,padT=22,padB=36;
  const maxR=Math.max(5.6,...rows.map(x=>x.r))*1.06, minR=-1.7;
  const pw=W-padL-padR, ph=H-padT-padB;
  const y=r=>padT+(1-(r-minR)/(maxR-minR))*ph;
  const n=rows.length, slot=pw/n, bw=Math.min(46,slot*0.54);
  const LV=[{r:1,f:'0.65'},{r:2,f:'0.975'},{r:3,f:'1.30'},{r:5,f:'1.95'}];
  const zero=y(0);

  let grid='';
  LV.forEach(l=>{
    const hits=rows.filter(x=>x.r>=l.r).length, yy=y(l.r);
    grid+=`<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${(W-padR+6).toFixed(1)}" y2="${yy.toFixed(1)}" stroke="#2a3140" stroke-width="1"/>`
       +  `<text x="${W-padR+13}" y="${(yy+3.5).toFixed(1)}" font-size="11" fill="#8b93a1">`
       +  `<tspan font-weight="700" fill="#c3c9d4">${l.r}R</tspan>  fib ${l.f}  `
       +  `<tspan font-weight="700" fill="${hits?'#e6e8ec':'#4a5568'}">${hits}/${rows.length}</tspan></text>`;
  });

  let bars='';
  rows.forEach((x,i)=>{
    const cx=padL+slot*i+slot/2, win=x.r>0;
    const top=y(Math.max(x.r,0)), bot=y(Math.min(x.r,0));
    const col=win?'#3fb950':'var(--neg)';
    bars+=`<rect x="${(cx-bw/2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1,bot-top).toFixed(1)}" fill="${col}" fill-opacity="0.20"/>`
       +  `<line x1="${(cx-bw/2).toFixed(1)}" y1="${(win?top:bot).toFixed(1)}" x2="${(cx+bw/2).toFixed(1)}" y2="${(win?top:bot).toFixed(1)}" stroke="${col}" stroke-width="2"/>`
       +  `<text x="${cx.toFixed(1)}" y="${(win?top-5:bot+12).toFixed(1)}" font-size="10" font-weight="700" fill="${col}" text-anchor="middle">${(x.r>=0?'+':'')+x.r.toFixed(2)}R</text>`;
    const dt=(x.t.date||'').slice(5), ses=(x.t.Session||'').replace('London','Ldn').replace('NY AM','NYam').replace('NY PM','NYpm');
    bars+=`<text x="${cx.toFixed(1)}" y="${(H-padB+14).toFixed(1)}" font-size="8.5" fill="#8b93a1" text-anchor="middle">${dt}</text>`
       +  `<text x="${cx.toFixed(1)}" y="${(H-padB+24).toFixed(1)}" font-size="8.5" fill="#6b7280" text-anchor="middle">${ses}</text>`;
    // a visible seam wherever the log jumps to a different day — clustering you can see
    if(i>0 && rows[i-1].t.date && x.t.date && rows[i-1].t.date!==x.t.date){
      const dx=(padL+slot*i).toFixed(1);
      bars+=`<line x1="${dx}" y1="${padT-6}" x2="${dx}" y2="${H-padB+2}" stroke="#3d4553" stroke-width="1" stroke-dasharray="2 3"/>`;
    }
  });

  return `<div class="card" style="padding:12px 14px 8px">
    <div class="lbl">How far each trade actually ran — and what each exit level would have caught</div>
    <svg viewBox="0 0 ${W} ${H}" style="display:block;width:100%;height:auto">
      ${grid}
      <line x1="${padL}" y1="${zero.toFixed(1)}" x2="${(W-padR+6).toFixed(1)}" y2="${zero.toFixed(1)}" stroke="#5a6478" stroke-width="1.5"/>
      ${bars}
    </svg>
    <div class="fsub" style="margin:6px 0 0">Every outcome on this board is this one picture read at a different height. The levels do not fail independently — a trade that misses 3R misses 5R too — so two outcomes agreeing is not two pieces of evidence.</div>
  </div>`;
}

/* ============================== L1 (large-n form) — the reach curve ============================== */
function reachCurveSVG(pool){
  const dirOf=t=>t.Direction==='Long'?1:-1;
  const rOf=t=>{const d=dirOf(t),risk=d*(t.entry-t.stop);
    return (risk>0 && t.maxRun!=null) ? d*(t.maxRun-t.entry)/risk : null;};
  const rs=pool.map(rOf).filter(v=>v!=null).sort((a,b)=>a-b);
  if(!rs.length) return '';
  const W=1000,H=230,padL=52,padR=130,padT=20,padB=34;
  const maxR=Math.max(6,rs[rs.length-1])*1.05, minR=Math.min(-1.5,rs[0]);
  const pw=W-padL-padR, ph=H-padT-padB;
  const x=r=>padL+(r-minR)/(maxR-minR)*pw, y=p=>padT+(1-p)*ph;
  const surv=r=>rs.filter(v=>v>=r).length/rs.length;
  let path='';
  for(let i=0;i<=160;i++){
    const r=minR+(maxR-minR)*i/160;
    path+=(i?'L':'M')+x(r).toFixed(1)+','+y(surv(r)).toFixed(1);
  }
  let grid='';
  [1,2,3,5].forEach((N,i)=>{
    const f=['0.65','0.975','1.30','1.95'][i], p=surv(N);
    grid+=`<line x1="${x(N).toFixed(1)}" y1="${padT-4}" x2="${x(N).toFixed(1)}" y2="${(H-padB).toFixed(1)}" stroke="#2a3140" stroke-width="1"/>`
       +  `<circle cx="${x(N).toFixed(1)}" cy="${y(p).toFixed(1)}" r="3.5" fill="#3fb950"/>`
       +  `<text x="${x(N).toFixed(1)}" y="${(H-padB+13).toFixed(1)}" font-size="9" fill="#c3c9d4" text-anchor="middle" font-weight="700">${N}R</text>`
       +  `<text x="${x(N).toFixed(1)}" y="${(H-padB+23).toFixed(1)}" font-size="8" fill="#6b7280" text-anchor="middle">${f}</text>`
       +  `<text x="${(x(N)+5).toFixed(1)}" y="${(y(p)-6).toFixed(1)}" font-size="9.5" font-weight="700" fill="#e6e8ec">${Math.round(p*100)}%</text>`;
  });
  let yax='';
  [0,0.25,0.5,0.75,1].forEach(p=>{
    yax+=`<line x1="${padL}" y1="${y(p).toFixed(1)}" x2="${(W-padR).toFixed(1)}" y2="${y(p).toFixed(1)}" stroke="#1f2735" stroke-width="1"/>`
      +  `<text x="${padL-7}" y="${(y(p)+3.5).toFixed(1)}" font-size="9" fill="#6b7280" text-anchor="end">${Math.round(p*100)}%</text>`;
  });
  return `<div class="card" style="padding:12px 14px 8px">
    <div class="lbl">Reach curve — share of trades that ran at least this far (n=${rs.length})</div>
    <svg viewBox="0 0 ${W} ${H}" style="display:block;width:100%;height:auto">
      ${yax}${grid}
      <path d="${path}" fill="none" stroke="#3fb950" stroke-width="2"/>
      <text x="${W-padR+12}" y="${padT+10}" font-size="10" fill="#8b93a1">median run</text>
      <text x="${W-padR+12}" y="${padT+24}" font-size="13" font-weight="700" fill="#e6e8ec">${rs[Math.floor(rs.length/2)].toFixed(2)}R</text>
    </svg>
    <div class="fsub" style="margin:6px 0 0">Each dot is one exit level: how often price reached it at all. Every outcome on this board is a point on this curve weighed against what it pays.</div>
  </div>`;
}

/* ============================== L1b — the interval strip ==============================
   Replaces two tables and eight sparklines. One continuous vertical zero line is the
   load-bearing element: every interval that crosses it is grey, so "we cannot tell these
   apart" arrives before a single word is read. Colour encodes separation, never sentiment. */
function intervalStripSVG(pool){
  const rows=MGMT.map(m=>({m,s:statsFor(m.key,pool)})).filter(x=>x.s.n);
  if(!rows.length) return '';
  rows.sort((a,b)=>b.s.mean-a.s.mean);
  const W=1000,labW=196,valW=66,padT=20,padB=20,rh=17;
  const H=padT+padB+rows.length*rh;
  const lo=Math.min(-1.3,...rows.map(r=>r.s.lo)), hi=Math.max(1.3,...rows.map(r=>r.s.hi));
  const pw=W-labW-valW, x=v=>labW+(v-lo)/(hi-lo)*pw;
  const lead=rows[0].s;

  let ticks='';
  for(let v=Math.ceil(lo);v<=Math.floor(hi);v++){
    if(v===0) continue;
    ticks+=`<line x1="${x(v).toFixed(1)}" y1="${padT-6}" x2="${x(v).toFixed(1)}" y2="${(H-padB+2).toFixed(1)}" stroke="#232a36" stroke-width="1"/>`
        +  `<text x="${x(v).toFixed(1)}" y="${(H-padB+14).toFixed(1)}" font-size="8.5" fill="#6b7280" text-anchor="middle">${v>0?'+':''}${v}R</text>`;
  }
  let body='';
  rows.forEach((r,i)=>{
    const yy=padT+i*rh+rh/2, s=r.s;
    const crosses=s.lo<0&&s.hi>0;
    const col=crosses?'#4a5568':(s.lo>0?'#3fb950':'var(--neg)');
    const dot=crosses?'#8b93a1':col;
    body+=`<text x="0" y="${(yy+3.5).toFixed(1)}" font-size="10" fill="#c3c9d4">${r.m.name}</text>`
       +  `<line x1="${x(s.lo).toFixed(1)}" y1="${yy.toFixed(1)}" x2="${x(s.hi).toFixed(1)}" y2="${yy.toFixed(1)}" stroke="${col}" stroke-width="2"/>`
       +  `<circle cx="${x(s.mean).toFixed(1)}" cy="${yy.toFixed(1)}" r="3.5" fill="${dot}"/>`
       +  `<text x="${W}" y="${(yy+3.5).toFixed(1)}" font-size="10" font-weight="700" fill="${crosses?'#8b93a1':col}" text-anchor="end">${fR(s.mean)}</text>`;
  });
  const allGrey=rows.every(r=>r.s.lo<0&&r.s.hi>0);
  return `<div class="card" style="padding:12px 14px 10px;margin-top:8px">
    <div class="lbl">All ${rows.length} outcomes · 95% confidence intervals on one axis</div>
    <svg viewBox="0 0 ${W} ${H}" style="display:block;width:100%;height:auto">
      <rect x="${x(lead.lo).toFixed(1)}" y="${padT-4}" width="${(x(lead.hi)-x(lead.lo)).toFixed(1)}" height="${(rows.length*rh+6).toFixed(1)}" fill="#9dc0f6" fill-opacity="0.06"/>
      ${ticks}
      <line x1="${x(0).toFixed(1)}" y1="${padT-8}" x2="${x(0).toFixed(1)}" y2="${(H-padB+2).toFixed(1)}" stroke="#5a6478" stroke-width="1.5"/>
      ${body}
    </svg>
    <div class="fsub" style="margin:6px 0 0">Dot = expectancy, bar = 95% interval. <b>Grey means the bar crosses zero</b> — that outcome is not yet distinguishable from no edge at all. The shaded band is the leader's interval: anything whose dot sits inside it is not distinguishable from the leader either${allGrey?', and right now every one of them does':''}.</div>
  </div>`;
}

/* ============================== L2 — both, ranked ============================== */
function rankedTable(pool){
  const rows=MGMT.map(m=>({m,prop:m.key,s:statsFor(m.key,pool)}));
  rows.sort((a,b)=>(b.s.n?b.s.mean:-99)-(a.s.n?a.s.mean:-99));
  let h='';
  rows.forEach(r=>{
    const s=r.s, sig=s.n && s.lo>0;
    h+=`<tr><td><span class="tag">${r.m.short}</span> ${r.m.name}<div class="mini" style="font-weight:400;margin-top:2px">${r.m.desc}</div></td>
      <td style="width:150px">${s.n?equityCurveSVG(seriesFor(r.prop,pool),140,32):'<span class="na">no data</span>'}</td>
      <td class="${s.n?cls(s.mean):'na'}">${s.n?fR(s.mean):'—'}${sig?' <span class="sig">sig</span>':''}</td>
      <td class="mut" style="white-space:nowrap">${s.n?`[${fR(s.lo)}, ${fR(s.hi)}]`:'—'}</td>
      <td>${s.n?Math.round(s.winRate*100)+'%':'<span class="na">—</span>'}</td>
      <td class="${s.n?cls(s.total):'na'}">${s.n?fR(s.total):'—'}</td>
      <td class="${s.n?'neg':'na'}">${s.n?fDD(s.dd):'—'}</td>
      <td class="${s.n&&s.streak?'neg':'mut'}">${s.n?s.streak:'—'}</td>
      <td class="${s.n&&s.winStreak?'pos':'mut'}">${s.n?s.winStreak:'—'}</td>
      <td class="mut">${s.n||'—'}</td></tr>`;
  });
  return `<div class="fsub">Every row is the same ${pool.length} trade${pool.length===1?'':'s'} read a different way, not eight separate samples — do not add the n column up. If a row is tagged <span class="sig">sig</span>, its edge over scratch holds at 95% confidence on its own.</div>
    <div class="tblwrap"><table class="matrix"><thead><tr><th>Outcome</th><th>curve</th><th>expectancy</th><th>95% CI</th><th>win%</th><th>total R</th><th>max DD</th><th>LIS</th><th>WIS</th><th>n</th></tr></thead><tbody>${h}</tbody></table></div>`;
}

/* ============================== render ============================== */
function disclosure(id,title,bodyHtml){
  const open=OPEN.has(id);
  return `<details class="l2" id="${id}" ${open?'open':''}><summary>${title}</summary><div class="body">${bodyHtml}</div></details>`;
}
/* A synthetic row must never be mistakable for a real chart read. This is deliberately
   the loudest element on the page, and it counts rows rather than trusting a flag set
   once -- if even one fake row is in the pool, every number above it is fiction. */
function testBanner(pool){
  const n=pool.filter(t=>t.isTest).length;
  if(!n) return '';
  const all=n===pool.length;
  return `<div class="testbanner">
    <div class="t">⚠ SYNTHETIC TEST DATA — ${all?'every number on this board is fake':`${n} of ${pool.length} rows are fake`}</div>
    <div class="d">Generated to check the board renders at scale. These are not chart reads and carry no information about the strategy.
    Delete every row whose name starts with <b>TEST-</b> in Notion before reading a single figure here.</div></div>`;
}

const ym=d=>d?d.slice(0,7):null;
const maxDrawdown=maxDD;
function serFor(k,pool){return seriesFor(k,pool);}
function stats(series){const n=series.length;if(!n)return{n:0};const wins=series.filter(r=>r>0).length,total=series.reduce((a,b)=>a+b,0);return {n,wins,wr:wins/n,exp:total/n,total};}
// Ranking is by expectancy — mean R per trade — POTUS's call 2026-08-29. It answers the
// question the board is actually asked: over many trades, which management earns the most
// per trade? The confidence interval stays printed on every row, so how much of that mean
// rests on one outlier is still visible — it just no longer decides the order. Exact ties
// fall back to the lower bound, so equal earners are led by the steadier one.
const rankKey = s => s.mean ?? -999;
const RV=(t,k)=>(t&&t.r)?t.r[k]:null;
const MGMTS = MGMT;
let MODEL='mario';

// Per-method copy. `what` is the rule; `test` is which logged field settles the
// outcome, at which level, and what happens on a miss — the line a reader needs to
// judge whether a number means anything. Keys are crypto's; the futures board holds
// the same text under its own keys.
const MARIO_PREAMBLE='One order, no ladder leg. The fib is drawn stop-to-anchor: <b>fib 0 is the stop</b>, 0.325 entry, 0.65 TP, 1.0 anchor. The TP is exactly double the entry, so it sits at <b>1.000R by construction</b>. 2R = fib 0.98, 3R = 1.30, 5R = 1.95. Max Adverse decides every stop-out.';
const LADDER_PREAMBLE=MARIO_PREAMBLE;
const METHOD_INFO={
  m_f1:{what:'Close the whole position at the TP, fib 0.65.',
      test:'Gated by <b>SM Max Run</b> against the TP, with <b>Max Adverse</b> settling the stop-out first.',
      fail:'The TP is exactly 1R away, so expectancy here is nothing but 2 × win% − 1. It carries no information beyond the win rate, and discards the entire tail.'},
  m_f2:{what:'Whole position off at 2R, fib 0.98 — just inside the anchor.',
      test:'Gated by <b>SM Max Run</b>; <b>Max Adverse</b> settles the stop first. A miss is scored at the real trail exit, not a synthetic loss.',
      fail:'Shares its fate with 3R and 5R on any trade that misses 2R.'},
  m_f3:{what:'Whole position off at 3R, fib 1.30.',
      test:'Gated by <b>SM Max Run</b>; <b>Max Adverse</b> settles the stop first.',
      fail:'Only a minority of trades ever reach it, so it spends most of its life at or below break-even.'},
  m_f5:{what:'Whole position off at 5R, fib 1.95 — well past the golden-ratio extension.',
      test:'Gated by <b>SM Max Run</b>; <b>Max Adverse</b> settles the stop first.',
      fail:'Reached rarely. Its drawdown is a property of the target choice, not of the stop.'},
  m_trail:{what:'No partial, no ceiling. Hold full size; once price clears the anchor at 2.077R the stop moves to break-even, so the trade cannot finish negative from there. Exit wherever the BoS trail took it.',
      test:'Gated by <b>SM Max Run</b> for the break-even arming, then <b>entirely by the logged trail exit</b> — a hand-read chart judgement, not a level.',
      fail:'Cannot be reproduced from the logged row. It inherits whatever the reader’s swing-high discretion was that session.'},
  m_cap3:{what:'Bank half at the TP (worth 0.5R), stop to break-even, runner to fib 1.30 \u2014 the 3R level \u2014 and close it there. The runner is half size, so reaching 3R pays 1.5R; with the banked half the position tops out at +2.00R. That is what the name states: the level the runner exits at, and what the trade delivers.',
      test:'Gated by <b>SM Max Run</b> for the partial and the cap; if 1.30 never prints the runner is scored at the <b>logged trail exit</b>.',
      fail:'Identical to the uncapped variant on any trade that clears the TP but not fib 1.30.'},
  m_cap5:{what:'The same, runner to fib 1.95 \u2014 the 5R level. Half size reaching 5R pays 2.5R, so the position tops out at +3.00R.',
      test:'Identical gates — SM Max Run for the partial and the cap, logged trail exit on a cap miss.',
      fail:'Distinguishable from the 2R delivery only on trades running past fib 1.30.'},
  m_cap7:{what:'The same, capped at fib 2.60 \u2014 the 7R level. A half-size runner reaching 7R pays 3.5R, so the position tops out at +4.00R.',
      test:'Identical gates \u2014 SM Max Run for the partial and the cap, logged trail exit on a cap miss.',
      fail:'Differs from cap 1.95 only on trades running past 5R.'},
  m_cap9:{what:'The same, capped at fib 3.25 \u2014 the 9R level. A half-size runner reaching 9R pays 4.5R, so the position tops out at +5.00R.',
      test:'Identical gates \u2014 SM Max Run for the partial and the cap, logged trail exit on a cap miss.',
      fail:'Differs from cap 2.60 only on trades running past 7R. At small n it will read identically to the uncapped trail.'},
  m_half:{what:'The incumbent, and the control the capped variants are measured against: half off at the TP, stop to break-even, then let the BoS trail run with no target.',
      test:'Gated by <b>SM Max Run</b> for the partial, then <b>entirely by the logged trail exit</b> for the runner.',
      fail:'A hand-read exit that cannot be rebuilt from the logged prices — and it is the baseline, which is where reader drift does the most damage.'}
};

let OPEN_ROW=null, OPEN_MONTH={}, SEL_DAY={};
const SESS_ORDER=['Asia','Frankfurt','London','NY AM','NY','NY PM','Late'];

// ── ported from v4-futures-next.html; keep the two in sync ──
function miniCal(key,pool){
  const dated=pool.filter(t=>t.date && RV(t,key)!=null);
  if(!dated.length) return '<div class="mini">No dated trades for this method.</div>';
  const months=[...new Set(dated.map(t=>ym(t.date)))].sort();
  const cur=OPEN_MONTH[key]&&months.includes(OPEN_MONTH[key])?OPEN_MONTH[key]:months[months.length-1];
  const idx=months.indexOf(cur), [Y,M]=cur.split('-').map(Number);
  const first=new Date(Y,M-1,1), start=first.getDay(), dim=new Date(Y,M,0).getDate();
  const byDay={};
  if(!SEL_DAY[key]){ const ds=[...new Set(dated.map(t=>t.date))].sort(); SEL_DAY[key]=ds[ds.length-1]; }
  dated.filter(t=>ym(t.date)===cur).forEach(t=>{ const d=Number(t.date.slice(8,10)), r=RV(t,key);
    (byDay[d]=byDay[d]||{sum:0,n:0}); byDay[d].sum+=r; byDay[d].n++; });
  let cells='';
  for(let i=0;i<start;i++) cells+='<div class="mc-d mc-e"></div>';
  for(let d=1;d<=dim;d++){ const x=byDay[d];
    const iso=`${cur}-${String(d).padStart(2,'0')}`, sel=SEL_DAY[key]===iso;
    cells+=`<div class="mc-d${x?(x.sum>0?' mc-w':(x.sum<0?' mc-l':' mc-f')):''}${sel?' mc-s':''}${x?' mc-c':''}" `+
           `${x?`data-day="${iso}" data-cal="${key}" title="${fR(x.sum)} · ${x.n} trade${x.n>1?'s':''}"`:''}>`+
           `<span class="mc-n">${d}</span>${x?`<span class="mc-r ${cls(x.sum)}">${fR(x.sum)}</span>`:''}</div>`; }
  const nav=months.length>1
    ? `<button class="mc-b" data-cal="${key}" data-mo="${months[idx-1]||''}" ${idx<=0?'disabled':''}>‹</button>`+
      `<button class="mc-b" data-cal="${key}" data-mo="${months[idx+1]||''}" ${idx>=months.length-1?'disabled':''}>›</button>` : '';
  return `<div class="mc-h"><span>${first.toLocaleString('en-US',{month:'long',year:'numeric'})}</span><span>${nav}</span></div>
    <div class="mc-w7"><i>S</i><i>M</i><i>T</i><i>W</i><i>T</i><i>F</i><i>S</i></div>
    <div class="mc-g">${cells}</div>`;
}

// Trades on one day, for the method whose drawer is open. Prices come through tradeFields(), which
// normalises the two payload shapes: futures nests them under t.raw with model-prefixed
// names (SMMaxRun / VCLTrailStop), crypto keeps them flat (maxRun / bosExit). A field a
// board does not have is simply omitted rather than rendered as a dash — crypto has no L1
// leg and no Max Adverse column, so those rows must not appear there at all.
function tradeFields(t){
  const w = t.raw || t;
  const mario = (typeof MODEL!=='undefined') && MODEL==='mario';
  const pick = (...ks)=>{ for(const k of ks){ const v=num(w[k]); if(v!=null) return v; } return null; };
  return {
    pair: w.Pair || t.pair || null,
    dir:  w.Direction || t.dir || null,
    time: w.entryTime || w['Entry Time (HHMM)'] || null,
    tz:   w.tz || w.Timezone || null,
    entry:  pick('EntryPrice','entry'),
    anchor: pick('anchor','1 of Fib Price'),
    maxRun: pick(mario?'SMMaxRun':'VCLMaxRun','SMMaxRun','VCLMaxRun','maxRun'),
    exit:   pick(mario?'SMTrailStop':'VCLTrailStop','SMTrailStop','VCLTrailStop','bosExit'),
    adverse: pick('MaxAdverse'),
    l1: (t.l1===undefined) ? null : t.l1,
    l1Src: t.l1Src || null,
  };
}
function dayDetail(key,pool){
  const day=SEL_DAY[key];
  const ts=pool.filter(t=>t.date===day && RV(t,key)!=null);
  if(!day||!ts.length) return `<div class="dd-empty">Select a day with trades.</div>`;
  const tot=ts.reduce((a,t)=>a+RV(t,key),0);
  const px=v=>v==null?null:Number(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  const rows=ts.map(t=>{
    const R=RV(t,key), f=tradeFields(t);
    const cell=(label,val)=>val==null?'':`<span>${label}</span><b>${val}</b>`;
    const fields=[
      cell('entry',px(f.entry)), cell('1 of fib',px(f.anchor)),
      cell('max run',px(f.maxRun)), cell('exit',px(f.exit)),
      cell('max adverse',px(f.adverse)),
      f.l1==null?'':cell('L1 filled',`${f.l1?'yes':'no'} <span class="mini">${f.l1Src==='maxAdverse'?'measured':'checkbox'}</span>`),
    ].filter(Boolean).join('');
    return `<div class="dd-t">
      <div class="dd-hd">
        <span><span class="pill">${f.pair||'—'}</span> <b>${f.dir||'—'}</b>
          <span class="mini">${t.session||''}${f.time?' · '+f.time:''}${f.tz?' '+f.tz:''}</span></span>
        <span class="dd-r ${cls(R)}">${fR(R)}</span>
      </div>
      <div class="dd-g">${fields}</div>${t.l1Conflict?'<div class="dd-warn">L1 checkbox disagrees with Max Adverse on this row.</div>':''}
    </div>`;}).join('');
  return `<div class="dd-h"><span>${day}</span><span class="${cls(tot)}">${fR(tot)} · ${ts.length} trade${ts.length>1?'s':''}</span></div>`+
         `<div class="dd-l">${rows}</div>`;
}

function methodDrawer(m,pool){
  const inf=METHOD_INFO[m.key]||{}, s=fullStats(seriesFor(m.key,pool));
  const pre = String(m.key).startsWith('m_') ? MARIO_PREAMBLE : LADDER_PREAMBLE;
  return `<tr class="dr" data-drawer="${m.key}"><td colspan="8"><div class="dr-in">
    <div class="dr-g">
      <div class="dr-b"><div class="dr-k">What it is</div><p>${inf.what||'<span class="mut">Not yet described.</span>'}</p></div>
      <div class="dr-b"><div class="dr-k">How it is tested</div><p>${inf.test||'<span class="mut">—</span>'}</p></div>
    </div>
    <div class="dr-b dr-cal"><div class="dr-k">By day — this method only <span class="dr-hint">click a day</span></div>${miniCal(m.key,pool)}</div>
    <div class="dr-b dr-day"><div class="dr-k">Trades on the selected day</div>${dayDetail(m.key,pool)}</div>
    <div class="dr-pre">${pre}</div>
  </div></td></tr>`;
}

function matrixTable(pool){
  // MGMT, not MGMTS: the normalised list carries .key/.name on both boards. Reading
  // m.k here emitted data-row="undefined", which set OPEN_ROW to the string
  // "undefined" and made every drawer unopenable on the crypto side.
  let rows=MGMT.map(m=>({m, s:fullStats(seriesFor(m.key,pool))}));   // reassigned by rankRows below
  const scored=rows.filter(r=>r.s.n), unscored=rows.filter(r=>!r.s.n);
  rows = rankRows(scored,pool).concat(unscored);
  // A zero-width interval is every observation landing on the same number, not confidence.
  // It must not take the crown.
  const winner=rows.find(r=>r.s.n>0);
  // One trading day cannot produce a meaningful drawdown or streak — there is no order to
  // speak of. Grey the whole group below 10 days rather than printing numbers that look
  // like measurements.
  const days=new Set(pool.map(t=>t.date).filter(Boolean)).size;
  const dim = days<10 ? ' dimc' : '';
  let html='';
  rows.forEach(r=>{
    const s=r.s, open=OPEN_ROW===r.m.key, isBest=winner&&r.m.key===winner.m.key&&s.n>0;
    const ci = s.n>1
      ? `<span class="${s.degenerate?'mut':(s.lo>0?'pos':'')}">[${fR(s.lo)}, ${fR(s.hi)}]</span>${s.degenerate?' <span class="flag" title="Every trade scored the same number — zero variance, not confidence">±0</span>':''}`
      : '<span class="mut">—</span>';
    html+=`<tr class="mrow ${isBest?'best':''} ${open?'is-open':''}" data-row="${r.m.key}">`+
      `<td class="mname"><button class="chev" aria-expanded="${open}" data-row="${r.m.key}">${open?'▾':'▸'}</button>${r.m.name}</td>`+
      `<td class="${s.n?cls(s.mean):'mut'}">${s.n?fR(s.mean):'—'}</td>`+
      `<td class="cicol">${ci}</td>`+
      `<td>${s.n?Math.round(s.winRate*100)+'%':'—'}</td>`+
      `<td class="${s.n?cls(s.total):'mut'}">${s.n?fR(s.total):'—'}</td>`+
      `<td class="mut">${s.n||'—'}</td>`+
      // Path group. Drawdown and streak depend on the ORDER these trades happened in;
      // expectancy and win% do not. Reshuffle the log and only these two move — so they
      // sit behind a divider under their own heading rather than reading as peers.
      `<td class="pathc${dim}">${s.n?(s.losses===0?'<span class="mut">none</span>':'<b class="neg">-'+s.dd.toFixed(2)+'R</b>'):'—'}</td>`+
      `<td class="pathc${dim}">${s.n?(s.losses===0?'<span class="mut">—</span>':s.streak+'×'):'—'}</td></tr>`;
    if(open) html+=methodDrawer(r.m,pool);
  });
  const note = days<10
    ? `Worst run and streak describe the order these ${pool.length} trades happened in, not the strategy — and ${days} trading day${days===1?'':'s'} is not enough order to describe. Reshuffle the log and they change; expectancy and win% do not.`
    : `Worst run and streak describe the order these trades happened in, not the strategy. Reshuffle the log and they change; expectancy and win% do not.`;
  return `<table class="matrix"><thead>
    <tr class="grp"><th></th><th colspan="4">Distribution — order-independent</th><th></th>
        <th colspan="2" class="pathh${dim}">Path — depends on trade order</th></tr>
    <tr><th>Method</th><th>Exp</th><th>95% CI</th><th>Win%</th><th>Tot</th><th>n</th>
        <th class="pathc${dim}">Worst run</th><th class="pathc${dim}">Streak</th></tr>
    </thead><tbody>${html}</tbody></table>
    <div class="mnote">${note}</div>`;
}

function wireMatrix(){
  document.querySelectorAll('.matrix .chev, .matrix .mrow .mname').forEach(el=>{
    el.onclick=e=>{ e.stopPropagation();

      OPEN_ROW = OPEN_ROW===k ? null : k; render(); };
  });
  document.querySelectorAll('.mc-d[data-day]').forEach(c=>{
    c.onclick=e=>{ e.stopPropagation(); const {cal,day}=e.currentTarget.dataset;
      SEL_DAY[cal]=day; render(); };
  });
  document.querySelectorAll('.mc-b').forEach(b=>{
    b.onclick=e=>{ e.stopPropagation(); const {cal,mo}=e.currentTarget.dataset;
      if(mo){ OPEN_MONTH[cal]=mo; render(); } };
  });
}

function evidenceBar(pool, all){
  const days=new Set(pool.map(t=>t.date).filter(Boolean)).size;
  // Pairs are derived from the data, not hardcoded — the same component runs on a board
  // of MNQ/MES/MGC and one of SOL/BTC/ETH. `all` is the unfiltered log, passed in because
  // the two boards hold it under different names.
  const src = all || pool;
  const mix = [...new Set(src.map(t=>t.pair||t.Pair).filter(Boolean))].sort()
    .map(k=>`${k} ${src.filter(t=>(t.pair||t.Pair)===k).length}`).join(' · ');
  const drops=dropCounts(pool), dropN=Object.values(drops).reduce((a,b)=>a+b,0);
  const conflicts=pool.filter(t=>t.l1Conflict).length;
  const notes=[];
  if(dropN) notes.push(`${dropN} row${dropN>1?'s':''} excluded from scoring`);
  if(conflicts) notes.push(`<b class="warn">${conflicts} row${conflicts>1?'s':''}: L1 checkbox disagrees with Max Adverse</b>`);
  return `<div class="ebar">
    ${verdictLine(pool)}
    <div class="eb2">${mix}${PAIR==='all'?'':' · filtered to '+PAIR}${notes.length?' — '+notes.join(' · '):''}</div>
  </div>`;
}

function sessionProfile(pool){
  const ss=[...new Set(pool.map(t=>t.session).filter(Boolean))].sort((a,b)=>sessRank(a)-sessRank(b));
  if(!ss.length) return '<div class="empty-note">No session tagged yet.</div>';
  const allDays=new Set(pool.filter(t=>t.date).map(t=>t.date)).size;
  let rows='';
  ss.forEach(se=>{
    const sub=pool.filter(t=>t.session===se);
    const d=new Set(sub.filter(t=>t.date).map(t=>t.date)).size;
    const rp=sub.filter(t=>t.rangePct!=null).map(t=>t.rangePct);
    const avg = rp.length ? (rp.reduce((a,b)=>a+b,0)/rp.length).toFixed(2)+'%' : '—';
    rows+=`<tr><td><span class="pill">${se}</span></td>
      <td class="spn"><b>${sub.length}</b></td>
      <td class="spn"><b>${d?(sub.length/d).toFixed(1):'0'}</b> <span class="mini">/day</span></td>
      <td class="spn mut">${d}d</td>
      <td class="spn"><b>${avg}</b></td></tr>`;
  });
  // Totals. Two different averages, and they answer different questions: how busy a
  // trading day is, and how many of those trades a given session accounts for.
  const perDay = allDays ? (pool.length/allDays).toFixed(1) : '0';
  const perSession = ss.length ? (pool.length/ss.length).toFixed(1) : '0';
  const allRp = pool.filter(t=>t.rangePct!=null).map(t=>t.rangePct);
  const allAvg = allRp.length ? (allRp.reduce((a,b)=>a+b,0)/allRp.length).toFixed(2)+'%' : '—';
  // Per-session sits beside the trade count, not in the range column — it is a count, and
  // a count in a column headed "Avg range %" reads as a percentage.
  rows+=`<tr class="sptot"><td><b>All</b></td>
      <td class="spn"><b>${pool.length}</b> <span class="mini">${perSession}/session</span></td>
      <td class="spn"><b>${perDay}</b> <span class="mini">/day</span></td>
      <td class="spn mut">${allDays}d</td>
      <td class="spn"><b>${allAvg}</b></td></tr>`;
  return `<table class="sp"><thead><tr><th>Session</th><th>Trades</th><th>Rate</th><th>Days</th><th>Avg range %</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="mnote">Counts and rates are descriptive at any sample size. Which exit is best <em>per session</em> is deliberately not shown — at these counts every cell would be two or three trades, and a method name in a cell reads as a recommendation.</div>`;
}

function primerBlock(){
  return `<div class="card prim">
    <div class="primhd" id="primTog"><span>How to read this board</span><span class="mini">${PRIMER_OPEN?'– collapse':'+ expand'}</span></div>
    ${PRIMER_OPEN?`<div class="primbody">
      <p><b>Every row is the same trades read a different way.</b> Ten exit rules scored against one log — not ten separate samples. Do not add the n column up.</p>
      <p><b>Two models, two rulers.</b> The VCL ladder enters at fib 0.382 with an L1 at 0.17 and its stop at fib 0; Super Mario is a single order whose stop <em>is</em> fib 0, entering at 0.325 with the TP at 0.65. Both enter at the same price, but <b>ladder 1R is about 1.86× Super Mario 1R</b>. R does not convert across the toggle — never compare a number from one against the other.</p>
      <p><b>Ranked by the lower bound of the 95% interval</b>, not raw expectancy. A method that pays well because of one outlier has a wide interval and a poor lower bound; one that pays consistently ranks above it. An interval of ±0 means every trade scored the same number — that is zero variance, not confidence, and it cannot take the top spot.</p>
      <p><b>Worst run and streak sit behind a divider</b> because they depend on the order the trades happened in. Reshuffle the log and they change; expectancy and win% do not.</p>
    </div>`:''}
  </div>`;
}

// Ranking, tie-aware. The lower bound decides who is in contention — it penalises an
// edge that rests on one outlier. But it must not DECIDE between methods the data cannot
// separate: on the crypto log it put `cap 1.95` above `uncapped trail` on a 0.0198R
// difference in lower bound, while a paired test of the two on the same trades returned
// [-0.152, +0.249] — no separation at all. So: take the best lower bound, gather everything
// statistically tied with it (paired difference straddling zero), and order that group by
// expectancy. Ties resolve on the number a reader is actually comparing.
function rankRows(rows, pool){
  if(rows.length<2) return rows;
  return [...rows].sort((a,b)=>
    (rankKey(b.s)-rankKey(a.s)) || ((b.s.lo??-999)-(a.s.lo??-999)));
}

function leaderOf(pool){
  const rows=MGMT.map(m=>({m,s:statsFor(m.key,pool)})).filter(x=>x.s.n);
  if(!rows.length) return null;
  const order=rankRows(rows,pool);
  return {best:order[0], up:order[1], order};
}

function recoCard(pool){
  const sessions=[...new Set(pool.map(t=>t.session).filter(Boolean))];
  const rx=sessions.map(se=>({se,b:bestMethod(pool.filter(t=>t.session===se))})).filter(x=>x.b).sort((a,b)=>sessRank(a.se)-sessRank(b.se));
  const rser=recoSeries(pool), rs=stats(rser), rdd=maxDrawdown(rser), rmls=maxLossStreak(rser);
  if(!rx.length) return `<div class="card top" style="margin-bottom:12px"><div class="crown">Session prescription</div><div class="empty-note">No trades yet.</div></div>`;
  let sess='';
  rx.forEach(x=>{ const weak=x.b.exp<0.2, thin=x.b.n<5;
    sess+=`<tr><td><span class="pill">${x.se}</span></td>
      <td class="pm">${x.b.label}${weak?' <span class="mini" style="color:#e0b341">weak</span>':''}${thin?' <span class="mini">thin</span>':''}</td>
      <td class="pr ${cls(x.b.exp)}">${fR(x.b.exp)}</td>
      <td class="pci mut">${x.b.deg?'<span class="flag">±0</span>':`[${fR(x.b.lo)}, ${fR(x.b.hi)}]`}</td>
      <td class="pn mut">n${x.b.n}</td></tr>`; });
  // Tilt is measured on whatever method currently leads, not a hardcoded one — `hyA`
  // does not exist on the crypto board.
  const tk=(leaderOf(pool)||{}).best, TK=tk?tk.m.key:(MGMT[0]||{}).key;
  const dirOf=t=>t.dir||t.Direction;
  const L=stats(pool.filter(t=>dirOf(t)==='Long').map(t=>RV(t,TK)).filter(x=>x!=null));
  const S=stats(pool.filter(t=>dirOf(t)==='Short').map(t=>RV(t,TK)).filter(x=>x!=null));
  let tilt=''; if(L.n&&S.n){ const fav=L.exp>S.exp?'Long':'Short'; tilt=`<div class="ptilt"><span class="lbl">Direction tilt</span><span>L <b class="${cls(L.exp)}">${fR(L.exp)}</b> · S <b class="${cls(S.exp)}">${fR(S.exp)}</b> → <b>${fav}</b></span></div>`; }
  // Reported as a DELTA against simply running the leader throughout. As its own headline
  // number it competed with the answer card and lost, which read as a second opinion
  // rather than as the answer to the question it actually asks: is switching by session
  // worth anything over not switching?
  const LD=leaderOf(pool), lead=LD?LD.best:null, leadExp=lead?lead.s.mean:null;
  const delta = (leadExp!=null && rs.exp!=null) ? rs.exp-leadExp : null;
  const verdict = delta==null ? ''
    : Math.abs(delta)<0.05 ? 'no different from not switching at all'
    : delta>0 ? `better than <b>${lead.m.name}</b> alone`
              : `<b>worse</b> than <b>${lead.m.name}</b> alone`;
  const recoStats=`<div class="band" style="margin:4px 0 2px">
      <div class="bandnum ${delta==null?'mut':cls(delta)}">${delta==null?'—':(delta>=0?'+':'')+delta.toFixed(2)+'R'}</div>
      <div class="bandci">per trade vs the leader · ${verdict}</div></div>
    <div class="mini" style="margin-bottom:6px">${fR(rs.exp)} switching · ${leadExp==null?'—':fR(leadExp)} not switching · n${rs.n}</div>`;
  return `<div class="card top" style="margin-bottom:12px"><div class="crown">Session prescription</div>${recoStats}<div class="lbl" style="margin:8px 0 5px">By session, in order</div><table class="ptab">${sess}</table>${tilt}<div class="mini" style="margin-top:8px">thin = &lt;5 trades</div></div>`;
}

function recoMap(pool){ const map={};
  [...new Set(pool.map(t=>t.session).filter(Boolean))].forEach(se=>{ const b=bestMethod(pool.filter(t=>t.session===se)); if(b) map[se]={mk:b.mk}; });
  return map; }

function recoSeries(pool){ const m=recoMap(pool); return pool.map(t=>{ const p=m[t.session]; return p?RV(t,p.mk):null; }).filter(x=>x!=null); }

function bestMethod(rows){
  let best=null;
  // Reads through MGMT + RV, never t.r[m.k]: that shape is one board's, and this function
  // runs on both.
  MGMT.forEach(m=>{
    const s=fullStats(rows.map(t=>RV(t,m.key)).filter(x=>x!=null));
    if(!s.n) return;
    if(!best || rankKey(s) > rankKey(best.s))
      best={mk:m.key,label:m.name,n:s.n,exp:s.mean,lo:s.lo,hi:s.hi,deg:s.degenerate,tot:s.total,wr:s.winRate,s};
  });
  return best; }

function sessRank(s){ const i=SESS_ORDER.indexOf(s); return i<0?99:i; }

function dropCounts(pool){
  // Board-agnostic: a row is EXCLUDED when it scores no outcome at all, and INVALID when a
  // field the scorer depends on is present but impossible. Written against the method keys
  // rather than one board's column names so the same function runs on both.
  let excluded=0, invalid=0;
  pool.forEach(t=>{
    const scored = MGMT.some(m=>RV(t,m.key)!=null);
    const raw = t.raw||t;
    const ma  = num(raw.MaxAdverse);
    if(ma===0){ invalid++; return; }          // a logged zero is a placeholder, not a price
    if(!scored) excluded++;
  });
  return {excluded, invalid};
}

let MATRIX_OPEN=true, PRIMER_OPEN=false;
function render(){
  const pool=TRADES, board=document.getElementById('board');
  if(!pool.length){ board.innerHTML=testBanner(ALL)+'<div class="card"><div class="empty-note">No VCL V5 trades logged for this pair yet.</div></div>'; return; }
  const matrixSummary=(()=>{
    const rows=MGMT.map(m=>statsFor(m.key,pool)).filter(x=>x.n);
    return `${MGMT.length} outcomes on the same ${pool.length} trades · ${rows.filter(x=>x.lo>0).length} clear zero`;
  })();
  board.innerHTML = testBanner(pool) + `
    ${evidenceBar(pool, ALL)}
    ${primerBlock()}
    <div class="grid2">
      <div>${winnerCard(pool)}</div>
      <div>
        <div class="card"><div class="lbl">Session profile</div>${sessionProfile(pool)}</div>
      </div>
    </div>
    <div class="card" style="margin-bottom:12px">
      <div class="primhd" id="matTog"><span>Full numbers — every outcome, ranked</span>
        <span class="mini">${matrixSummary} &nbsp; ${MATRIX_OPEN?'– collapse':'+ expand'}</span></div>
      ${MATRIX_OPEN?matrixTable(pool):''}
    </div>
    <div class="card" style="margin-bottom:12px">${intervalStripSVG(pool)}</div>
    <div class="card" style="margin-bottom:12px">${reachLadderSVG(pool)}</div>
    <div class="foot">Every outcome is paired on identical trades — the same ${pool.length} trades read a different way, not eight separate samples. Trades cluster by trading day; treat n as an upper bound on independent evidence.</div>`;
  const pt=document.getElementById('primTog'); if(pt) pt.onclick=()=>{PRIMER_OPEN=!PRIMER_OPEN; render();};
  const mt=document.getElementById('matTog'); if(mt) mt.onclick=()=>{MATRIX_OPEN=!MATRIX_OPEN; render();};
  if(MATRIX_OPEN) wireMatrix();
}

/* ============================== data + wiring ============================== */
const WORKER='https://vcl-clarity-scoreboard.potus-eth.workers.dev/?view=grant';
async function poll(){
  const st=document.getElementById('status');
  try{
    const res=await fetch(WORKER+'&t='+Date.now(),{cache:'no-store'});
    if(!res.ok) throw new Error('worker '+res.status);
    const j=await res.json();
    ALL=(j&&j.trades)||[];
    applyFilters(); render();
    lastOk=Date.now();
    st.textContent=`1M · ${PAIR==='all'?'all pairs':PAIR} · ${TRADES.length} trade${TRADES.length===1?'':'s'} · ${new Date().toLocaleTimeString()}`;
    firstLoad=false;
  }catch(e){
    if(firstLoad){ st.innerHTML='<span class="err">Worker unreachable: '+(e.message||'')+'</span>';
      document.getElementById('board').innerHTML='<div class="card"><div class="empty-note">Worker unreachable — no cached fallback for this board. Retrying every 5s.</div></div>'; }
    else{ const age=Math.round((Date.now()-lastOk)/1000);
      st.innerHTML=`<span class="err">STALE — worker unreachable, figures are ${age}s old</span>`; }
  }
}
function wire(id,attr,set){
  document.querySelectorAll('#'+id+' button').forEach(b=>{
    b.onclick=()=>{ const v=b.dataset[attr]; if(v===set()) return;
      document.querySelectorAll('#'+id+' button').forEach(x=>x.classList.toggle('on',x===b));
      set(v); applyFilters(); render();
      document.getElementById('status').textContent=`1M · ${PAIR==='all'?'all pairs':PAIR} · ${TRADES.length} trades`; };});
}
wire('pairTg','p', v=>{ if(v===undefined) return PAIR; PAIR=v; });
poll(); setInterval(poll,5000);
</script>
