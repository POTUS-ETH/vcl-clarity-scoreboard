<div class="wrap">
  <div class="hd">
    <div><h1>TCLV</h1><div class="sub">TCL 2.0 ladder off a swing-high AVWAP · two fills · futures 15s + crypto 1m · stop 0 / L1 0.17 / entry 0.382 / TP 0.618 / runner 1.272 · 1R = the full ladder</div></div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <div class="tg" id="classTg"><button data-c="all" class="on">ALL</button><button data-c="futures">FUTURES</button><button data-c="crypto">CRYPTO</button></div>
      <div class="tg" id="pairTg"></div>
      <div class="tg" id="traderTg" title="who took the trade"></div>
      <div class="tg" id="tfTg" title="chart timeframe"></div>
      <div class="mini" id="status">loading…</div>
    </div>
  </div>
  <div id="board"></div>

</div>
<script>
// Two models scored off the SAME logged row. They share the fib geometry and differ only
// in where the stop sits and whether there is an L1 leg — so one set of typed prices
// settles both, and neither is a counterfactual needing bar data to reconstruct.
// Nine methods, all named by what they DELIVER on the whole position. The partial is
// banked before the runner sets off, so only half the position is still working:
//   partial at 1R -> delivering NR needs the runner at 2N-1
//   partial at 2R -> delivering NR needs the runner at 2N-2
// The fib is drawn stop-to-entry, so the box IS 1R and XR sits at fib X+1. Runner caps:
// on the 1R-partial fib the cap delivering N is fib 2N; on the 2R-partial fib it is 2N-1.
// The full-size target levels every reach chart marks. Fib = R + 1: the box is 1R and
// entry sits at fib 1. One list, so the curve and the ladder cannot disagree on which
// targets exist. This has now drifted TWICE — 4R went unmarked for a week after Full @ 4R
// was added, and 1.25/1.75/2.25/2.75 went unmarked when the quarter families landed. Adding
// a Full-TP target without adding its level here is the known failure mode of this file:
// the chart quietly stops marking a target the matrix is still scoring.
// `minor` is the quarter positions (x.25 / x.75). They get a line and a small label so that
// every target has a mark, but no fib sub-label and neither percentage callout: at roughly
// 31px per quarter-R on a 1000-wide viewBox those overlap into noise.
// Where the ladder's own levels sit in R, nominally: 1R is 0.552 of the fib, so R at fib x is
// (x − 0.382)/0.552. The scorer's per-trade figures sit within a tick of these.
const R_LEVELS=[{r:(0.618-0.382)/0.552, f:'fib 0.618 · TP', lab:'0.43R', minor:false},
                {r:(1.000-0.382)/0.552, f:'fib 1 · anchor', lab:'1.12R', minor:false},
                {r:(1.272-0.382)/0.552, f:'fib 1.272 · runner', lab:'1.61R', minor:false}];
const MGMTS_OBVS=[
  {k:'bh',   fam:'full', label:'Base hit · 100% @ 0.618',                                  short:'BH',   mid:'Base\u00a0hit'},
  {k:'runE', fam:'p1',   label:'Run · 50% @ 0.618, stop to entry, runner to 1.272',        short:'RunE', mid:'Run\u00a0· entry\u00a0stop'},
  {k:'runS', fam:'p2',   label:'Run · 50% @ 0.618, stop under swing low, runner to 1.272', short:'RunS', mid:'Run\u00a0· swing\u00a0stop'}];
const FOOT_OBVS='R math: you type four prices — the stop at fib 0, the swing at fib 1, Max Run and your exit. The board solves L1 at 0.17, entry at 0.382, TP at 0.618 and the runner at 1.272, each snapped to the instrument\'s tick (MNQ and MES 0.25, MGC 0.10, MYM 1, crypto 0.02), and 1R is the risk of those snapped orders, (entry − stop) + (L1 − stop), on every trade whether or not L1 filled — 0.552 of the fib before snapping, so a base hit pays about +0.43R, L1 back to entry about +0.38R, a run to 1.272 about +1.02R and one back to entry about +0.21R. Max Run touching a snapped price is that order filling. The exit settles the rest: at or through the stop is the stop-out (both units, −1R), through the L1 price means L1 filled, and after the partial the runner closes at 1.272 if it printed, otherwise wherever you got out. As traded — half at 0.618, the rest at your exit — is the dashed line on the reach curve. A typed Back to Entry Time is the one thing the exit cannot show; an exit at or below entry counts as yes. The four clocks — TP, 1.272, back to entry, exit — give every method its own time in trade.';
let MGMTS=MGMTS_OBVS.slice();
// Instrument class filter — futures and crypto share this log, so the top toggle splits
// them. 'all' is legitimate: the R math is identical, only the tick grid differs.
// ── this board ───────────────────────────────────────────────────────────────
// TCLV is its own file: the scorer is the TCL 2.0 two-fill ladder, not the single-fill R
// ladder the V6 family shares. Everything downstream of computeR — stats, matrix, fan,
// session, range, calendar — is the same code as v6-obvs.html.
const BOARD={view:'tclv', title:'TCLV', log:'Trade Log — TCLV', futuresOnly:false,
  sub:'TCL 2.0 ladder off a swing-high AVWAP · two fills · futures 15s + crypto 1m · stop 0 / L1 0.17 / entry 0.382 / TP 0.618 / runner 1.272 · 1R = the full ladder'};
const CARDS={ema:false, anchor:false, minutes:true, emas:true};
document.title=BOARD.title;
{ const h=document.querySelector('h1'), sb=document.querySelector('.sub');
  if(h) h.textContent=BOARD.title.toUpperCase(); if(sb) sb.textContent=BOARD.sub; }
let CLASS='all';
const FUTURES=['MNQ','MES','MGC','MYM'];
const isFutures=p=>FUTURES.includes(p);
let ALL_TRADES=[], TRADES=[];
let PAIR='all';
// Two people test TCLV — POTUS on the 15s, Gonza on the 1m (POTUS 2026-10-29) — so the board
// flips by who took the trade and by chart timeframe, on top of class and pair.
let TRADER='all', TF='all';

function num(x){ return (x===null||x===undefined||x==='')?null:Number(x); }

// ── TCLV scorer ───────────────────────────────────────────────────────────────
// TCL 2.0, two fills on one fib. Four typed prices: the two ends of the fib you draw — the
// stop at 0 and the swing at 1 — plus Max Run and the exit. The ladder is solved from the
// first two (L1 at 0.17, entry at 0.382, first target 0.618, runner target 1.272), every order
// snapped to the instrument's tick, and 1R is the risk of those snapped orders — the full
// two-fill risk, (entry − stop) + (L1 − stop), whether or not L1 filled. The exit settles the
// rest (POTUS 2026-10-29, "a simple exit price"): at or through the stop is the stop-out,
// through the L1 price means L1 filled, and after the partial the runner closes at 1.272 if
// Max Run reached it, otherwise wherever the trade got out. One more typed fact remains — Back
// to Entry Time — because an exit cannot show whether price revisited entry on the way up; it
// doubles as that exit's clock. Four clock times give every method its own time in trade.
const TICK={MNQ:0.25, MES:0.25, MGC:0.1, MYM:1, BTC:0.02, ETH:0.02, SOL:0.02};
const FIB={stop:0, l1:0.17, entry:0.382, tp:0.618, anchor:1, t1272:1.272, oneR:0.552};
function computeR(row){
  const S=num(row.StopPrice), A=num(row.Anchor), MR=num(row.MaxRun), X=num(row.ExitPrice);
  const r={bh:null, runE:null, runS:null};
  const base={pair:row.Pair||null, session:row.Session||null, date:row.date||null, n:row.n??null, dir:row.Direction||null,
              tz:row.Timezone||null, entryTime:row.EntryTime||null,
              l1:!!row.L1Filled, hitEntry:hhmmToMin(row.BackTime)!=null, emaAligned:!!row.EmaAligned,
              times:{entry:row.EntryTime||null, tp:row.TpTime||null, t1272:row.T1272Time||null, back:row.BackTime||null, exit:row.ExitTime||null}, tIn:null,
              trader:row.Trader||null, timeframe:row.Timeframe||null,
              stop:S, anchor:A, exit:X, r, raw:row, why:null, note:null};
  if(S==null||A==null){ if(S!=null||A!=null) base.why='stop price or 1 of fib price missing'; return base; }
  const dir = row.Direction==='Long' ? 1 : row.Direction==='Short' ? -1 : null;
  if(dir==null){ base.why='no direction'; return base; }
  if(dir*(A-S)<=0){ base.badAnchor=true; base.why='1 of fib is on the wrong side of the stop for a '+row.Direction; return base; }
  const span=A-S, tick=TICK[row.Pair]||null;
  const snap=p=>tick ? +(Math.round(p/tick)*tick).toFixed(6) : p, at=x=>snap(S+x*span);
  const E=at(FIB.entry), L1=at(FIB.l1), TP=at(FIB.tp), T=at(FIB.t1272);
  base.entry=E; base.l1Price=L1; base.tp=TP; base.t1272=T;
  const oneR=dir*(E-S)+dir*(L1-S);              // the two fills' risk, as the orders sit
  base.oneR=oneR; base.rangePct=oneR/E*100;
  if(!(oneR>0)||!(dir*(TP-E)>0)){ base.why='the ladder collapses on the '+row.Pair+' tick grid — fib too small to place'; return base; }
  const halfTick = tick ? tick/2 : 1e-9;
  const reached=p=>MR!=null && dir*(MR-p)>=-1e-9;   // Max Run touching a snapped order price is that order filling
  base.maxRunR = MR!=null ? dir*(MR-E)/oneR : null;
  if(X!=null && MR!=null && dir*(X-MR)>halfTick) base.why='exit is beyond Max Run — check Max Run';
  // What the exit says. Through the L1 price means L1 filled whether or not the box was ticked
  // (the order sat in the way); at or through the stop is the stop-out.
  base.stopped = X!=null && dir*(X-S)<=halfTick;
  const throughL1 = X!=null && dir*(X-L1)<=halfTick;
  if(!base.l1 && throughL1) base.note='exit sits at or through the L1 price, so L1 must have filled — box left unticked, scored as filled';
  base.l1Inferred = base.l1 || throughL1;
  // ── L1 filled: both units on, both close at the exit. Back at entry is +0.38R; the stop is −1R.
  if(base.l1Inferred){
    if(X==null){ base.why='L1 filled but no exit price'; return base; }
    const v=(dir*(X-E)+dir*(X-L1))/oneR; r.bh=v; r.runE=v; r.runS=v; base.exitR=v;
    base.tIn=sameTimes(base.times,'exit');
    return base;
  }
  // ── Entry only, 0.618 never printed. Price cannot reach the stop without filling L1, so this
  // is a close above L1 at the exit — or, with no exit logged, the stop-out it must have been.
  if(MR==null && X==null){ base.why='no Max Run and no exit price — nothing to score against'; return base; }
  if(!reached(TP)){
    if(X!=null && dir*(X-TP)>=-1e-9 && !base.why) base.why='exit is at or beyond 0.618 but Max Run is short of it — check Max Run';
    const v = X!=null ? dir*(X-E)/oneR : -1;
    r.bh=v; r.runE=v; r.runS=v; base.exitR = X!=null ? v : null;
    base.tIn=sameTimes(base.times,'exit');
    if(!base.note) base.note = X!=null ? 'entry only, closed before 0.618 — every method scored at the exit'
                                       : 'entry only, never reached 0.618, no exit price — a closed trade that never printed TP is a stop-out, −1R on every method';
    return base;
  }
  // ── 0.618 printed. Base hit banks it all; the runs bank half and settle the runner.
  const half=0.5*dir*(TP-E), runnerT=0.5*dir*(T-E), runnerX = X!=null ? 0.5*dir*(X-E) : null;
  r.bh = dir*(TP-E)/oneR;
  base.exitR = runnerX!=null ? (half+runnerX)/oneR : null;      // as traded: half at 0.618, the rest at the exit
  // 1.272 printed → the runner order filled there; otherwise the runner closed wherever the trade got out.
  const runner = reached(T) ? runnerT : runnerX;
  // Entry stop: a return to entry closes the runner there. The box says so; so does an exit at or below entry.
  const backToEntry = base.hitEntry || (X!=null && dir*(X-E)<=halfTick);
  if(!base.hitEntry && X!=null && dir*(X-E)<=halfTick && !base.note) base.note='exit is at or below entry, so price came back after the partial — box left unticked; the entry-stop run is scored at entry';
  r.runE = backToEntry ? half/oneR : runner!=null ? (half+runner)/oneR : null;
  r.runS = runner!=null ? (half+runner)/oneR : null;
  if(runner==null && !base.why && !base.note) base.note='no exit price and 1.272 did not print — the runner exits are unknown';
  // Time in trade per method: the clock of the event that closed it, measured from the entry.
  const mb=k=>minsBetween(base.times.entry, base.times[k]);
  const tExit=mb('exit'), tRun = reached(T) ? mb('t1272') : tExit;
  base.tIn={ bh:mb('tp'), trail:tExit, runS:tRun, runE: backToEntry ? (base.times.back ? mb('back') : tExit) : tRun };
  return base;
}

function applyFilters(){
  let pool=ALL_TRADES.slice();
  if(PAIR!=='all') pool=pool.filter(t=>t.pair===PAIR);
  if(CLASS!=='all') pool=pool.filter(t=>isFutures(t.pair)===(CLASS==='futures'));
  if(TRADER!=='all') pool=pool.filter(t=>t.trader===TRADER);
  if(TF!=='all') pool=pool.filter(t=>t.timeframe===TF);
  TRADES = decorate(pool);
}

// ── stats engine, shared verbatim with the crypto board ──────────────────────
// Futures previously had no interval of any kind: stats() returned n/wins/wr/exp/total.
// The board with 4 trades on one day had none of the hedging the 28-trade board has.
const TTAB={2:4.303,3:3.182,4:2.776,5:2.571,6:2.447,7:2.365,8:2.306,9:2.262,10:2.228,11:2.201,12:2.179,13:2.160,14:2.145,15:2.131,16:2.120,17:2.110,18:2.101,19:2.093,20:2.086,21:2.080,22:2.074,23:2.069,24:2.064,25:2.060,26:2.056,27:2.052,28:2.048,29:2.045,30:2.042};
const tCrit=df=>df<2?12.7:df>30?1.96:TTAB[df];
const mean_=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const sd_=a=>{if(a.length<2)return 0;const m=mean_(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1));};
function ci95(series){
  const a=series.filter(x=>x!=null), n=a.length;
  if(!n) return {n:0,mean:null,lo:null,hi:null,degenerate:false};
  const m=mean_(a), sdv=sd_(a), se=n>1?sdv/Math.sqrt(n):0, t=tCrit(n-1);
  // A zero-width interval is NOT confidence — it is every observation landing on the same
  // number. At n=4 that is four identical readings, which must never outrank a method
  // whose interval is honest about its spread.
  return {n, mean:m, se, lo:m-t*se, hi:m+t*se, degenerate:n>1&&sdv===0};
}
function fullStats(series){
  const c=ci95(series);
  const wins=series.filter(x=>x>0.005).length, losses=series.filter(x=>x<-0.005).length;
  const scratches=series.length-wins-losses;
  let run=0,ws=0; for(const x of series){ if(x>0.005){run++; if(run>ws)ws=run;} else run=0; }
  return {...c, wins, losses, scratches, winStreak:ws, winRate:(wins+losses)?wins/(wins+losses):0,
          total:series.reduce((a,b)=>a+b,0), dd:maxDrawdown(series), streak:maxLossStreak(series).len||0};
}

// ── per-method copy ──────────────────────────────────────────────────────────
// `what` is the rule. `test` is the line that was missing everywhere: which logged field
// settles this outcome, at which level, and what happens on a miss. A reader cannot judge
// a number without knowing what produced it.

const MARIO_PREAMBLE=LADDER_PREAMBLE;
const METHOD_INFO={};
Object.assign(METHOD_INFO,{
  bh:{what:'Entry only: close the whole position at 0.618. L1 filled: both units close at your exit — back at entry +0.38R, the stop −1R.',
      test:'Gated by <b>Max Run</b> touching the snapped 0.618 price. L1 is a logged fact, or read off an exit through the L1 price. An entry-only trade that never reached 0.618 scores at its exit.',
      fail:'The lowest-variance method on the board: +0.43R or −1R on entry-only trades, nothing in between.'},
  runE:{what:'Entry only: half off at 0.618, stop to entry, runner to 1.272. Comes back to entry → +0.21R; 1.272 prints → +1.02R; otherwise the runner closes wherever the trade got out.',
      test:'<b>Back to Entry Time</b> — or an exit at or below entry — settles the runner at entry; otherwise <b>Max Run</b> against 1.272, else the runner is scored at your <b>Exit Price</b>.',

  runS:{what:'Entry only: half off at 0.618, stop under the swing low, runner to 1.272. 1.272 prints → +1.02R; otherwise the runner closes at your exit — the swing stop, a trailed stop, wherever you got out.',
      test:'<b>Max Run</b> against 1.272 settles a filled runner; otherwise the runner half is scored at your <b>Exit Price</b>.',
      fail:'Survives the pullback that takes out the entry stop, at the cost of a bigger give-back when the swing fails. The whole TCLV question is whether that trade is worth it.'},

// ── THE SEAM ─────────────────────────────────────────────────────────────────
// The only structural difference between this board and the crypto one. Futures nests
// outcomes under t.r (the widget computes both models itself); crypto reads them straight
// off the trade (Notion formulas wrote them). Everything else above and below is identical
// code in both files — keep it that way or the boards drift apart again.
//   crypto:  const RV=(t,k)=>t[k];
const RV=(t,k)=>(t&&t.r)?t.r[k]:null;

function serFor(mgmt,pool){ return pool.map(t=>t.r[mgmt]).filter(r=>r!=null); }
function stats(series){ const n=series.length; if(!n) return {n:0};
  const wins=series.filter(r=>r>0).length, total=series.reduce((a,b)=>a+b,0);
  return {n, wins, wr:wins/n, exp:total/n, total}; }
function maxLossStreak(series){ let run=0,len=0,worst=0,worstLen=0;
  for(const r of series){ if(r<0){run+=r;len++;if(run<worst){worst=run;worstLen=len;}} else {run=0;len=0;} }
  return {dd:Math.abs(worst), len:worstLen}; }
function maxDrawdown(series){ let cum=0,peak=0,mdd=0; for(const r of series){ cum+=r; if(cum>peak)peak=cum; const dd=peak-cum; if(dd>mdd)mdd=dd; } return mdd; }
function bestOf(list){ const v=list.filter(s=>s.n>0); if(!v.length) return null; return v.sort((a,b)=>b.exp-a.exp)[0]; }
// Ranking by total R rewards whichever method was scored on more trades — a volume
// artifact, not an edge. It agreed with bestOf() only because every session happened to
// hold exactly 2 trades; at unequal n they diverge and the board prints two different
// "best method" for one session. One ranking rule, by expectancy, everywhere.
const bestByTotal = bestOf;
// Same rule as the answer card and the matrix: lower bound of the 95% interval, with a
// zero-variance interval barred from winning. This card used to rank by raw expectancy,
// which is why it kept naming a method the rest of the board had just ranked last.
function bestMethod(rows){
  let best=null;
  // Reads through MGMT + RV, never t.r[m.k]: that shape is one board's, and this function
  // runs on both.
  MGMT.forEach(m=>{
    const s=fullStats(rows.map(t=>RV(t,m.key)).filter(x=>x!=null));
    if(!s.n) return;
    if(!best || rankKey(s) > rankKey(best.s))
      best={mk:m.key,label:m.name,n:s.n,exp:s.mean,lo:s.lo,hi:s.hi,deg:s.degenerate,tot:s.total,wr:s.winRate,s};
  });
  return best; }
const SESS_ORDER=['Asia','Frankfurt','London','NY AM','NY','NY PM','Late'];
function sessRank(s){ const i=SESS_ORDER.indexOf(s); return i<0?99:i; }
function recoMap(pool){ const map={};
  [...new Set(pool.map(t=>t.session).filter(Boolean))].forEach(se=>{ const b=bestMethod(pool.filter(t=>t.session===se)); if(b) map[se]={mk:b.mk}; });
  return map; }
function recoSeries(pool){ const m=recoMap(pool); return pool.map(t=>{ const p=m[t.session]; return p?RV(t,p.mk):null; }).filter(x=>x!=null); }
function recoCard(pool){
  const sessions=[...new Set(pool.map(t=>t.session).filter(Boolean))];
  const rx=sessions.map(se=>({se,b:bestMethod(pool.filter(t=>t.session===se))})).filter(x=>x.b).sort((a,b)=>sessRank(a.se)-sessRank(b.se));
  const rser=recoSeries(pool), rs=stats(rser), rdd=maxDrawdown(rser), rmls=maxLossStreak(rser);
  if(!rx.length) return `<div class="card top" style="margin-bottom:12px"><div class="crown">Session prescription</div><div class="empty-note">No trades yet.</div></div>`;
  let sess='';
  rx.forEach(x=>{ const weak=x.b.exp<0.2, thin=x.b.n<5;
    sess+=`<tr><td><span class="pill">${x.se}</span></td>
      <td class="pm">${x.b.label}${weak?' <span class="mini" style="color:#e0b341">weak</span>':''}${thin?' <span class="mini">thin</span>':''}</td>
      <td class="pr ${cls(x.b.exp)}">${fR(x.b.exp)}</td>
      <td class="pci mut">${x.b.deg?'<span class="flag">±0</span>':`[${fR(x.b.lo)}, ${fR(x.b.hi)}]`}</td>
      <td class="pn mut">n${x.b.n}</td></tr>`; });
  // Tilt is measured on whatever method currently leads, not a hardcoded one — `hyA`
  // does not exist on the crypto board.
  const tk=(leaderOf(pool)||{}).best, TK=tk?tk.m.key:(MGMT[0]||{}).key;
  const dirOf=t=>t.dir||t.Direction;
  const L=stats(pool.filter(t=>dirOf(t)==='Long').map(t=>RV(t,TK)).filter(x=>x!=null));
  const S=stats(pool.filter(t=>dirOf(t)==='Short').map(t=>RV(t,TK)).filter(x=>x!=null));
  let tilt=''; if(L.n&&S.n){ const fav=L.exp>S.exp?'Long':'Short'; tilt=`<div class="ptilt"><span class="lbl">Direction tilt</span><span>L <b class="${cls(L.exp)}">${fR(L.exp)}</b> · S <b class="${cls(S.exp)}">${fR(S.exp)}</b> → <b>${fav}</b></span></div>`; }
  // Reported as a DELTA against simply running the leader throughout. As its own headline
  // number it competed with the answer card and lost, which read as a second opinion
  // rather than as the answer to the question it actually asks: is switching by session
  // worth anything over not switching?
  const LD=leaderOf(pool), lead=LD?LD.best:null, leadExp=lead?lead.s.mean:null;
  const delta = (leadExp!=null && rs.exp!=null) ? rs.exp-leadExp : null;
  const verdict = delta==null ? ''
    : Math.abs(delta)<0.05 ? 'no different from not switching at all'
    : delta>0 ? `better than <b>${lead.m.name}</b> alone`
              : `<b>worse</b> than <b>${lead.m.name}</b> alone`;
  const recoStats=`<div class="band" style="margin:4px 0 2px">
      <div class="bandnum ${delta==null?'mut':cls(delta)}">${delta==null?'—':(delta>=0?'+':'')+delta.toFixed(2)+'R'}</div>
      <div class="bandci">per trade vs the leader · ${verdict}</div></div>
    <div class="mini" style="margin-bottom:6px">${fR(rs.exp)} switching · ${leadExp==null?'—':fR(leadExp)} not switching · n${rs.n}</div>`;
  return `<div class="card top" style="margin-bottom:12px"><div class="crown">Session prescription</div>${recoStats}<div class="lbl" style="margin:8px 0 5px">By session, in order</div><table class="ptab">${sess}</table>${tilt}<div class="mini" style="margin-top:8px">thin = &lt;5 trades</div></div>`;
}
// ── 200 EMA at entry ─────────────────────────────────────────────────────────
// The log stores ONE number — the 200 EMA's price on the entry candle — and every state
// below is solved from it, oriented to the trade. A price can be re-bucketed later; a
// category cannot be un-bucketed. The logger never decides whether the 200 was protection
// or a headwind: that flips with Direction and is exactly what a human gets backwards on
// a short. A long feeds DOWN into the AVWAP, so a 200 below entry is the backstop; a short
// feeds UP into it, so a 200 above entry is.
//
//   Aligned     — within ALIGN_R of entry: the trade is entering ON the 200
//   In front    — on the target side of entry, beyond the band: in the path of the run
//   Behind      — on the stop side of entry, beyond the band, still inside the box: backing the trade
//   Out of box  — beyond the stop: not interacting with the setup at all
//
// "Aligned" is measured in R, not in price or percent. The box (entry → stop) is the
// trade's own risk unit and already scales with the instrument and the day: a 3-point
// box on MES and a 40-point box on MNQ each define what "close to entry" means for that
// trade. A percent-of-price band would need a table per instrument — and the logged
// boxes vary tenfold WITHIN one instrument (MNQ 0.02%–0.70% of price) — so it could never
// be right for both a quiet and a fast session. 0.25R was chosen on the first 64 readings:
// it puts ~40% of trades in the aligned bucket and leaves the other three states enough
// to say something; 0.10R (12%) starves the bucket, 0.50R (70%) swallows the rest.
const ALIGN_R = 0.25;
const EMA_STATES = ['Aligned','In front of entry','Behind entry','Out of box'];
// A 200 EMA more than 5% of price away from entry is not a reading, it is a typo — a
// 200-period average on a 15s or 1m chart cannot sit that far from price. Such a row is
// left unscored and named in the card, rather than silently filed under "Out of box".
const EMA_SANE = 0.05;
function emaSuspect(t){ const p=t.ema200, E=t.entry; return p!=null&&E!=null&&Math.abs(p-E)/E>EMA_SANE; }
function emaState(t){
  const p=t.ema200, E=t.entry, S=t.stop;
  if(p==null||E==null||S==null) return null;
  if(emaSuspect(t)) return null;
  const d = t.dir==='Long' ? 1 : t.dir==='Short' ? -1 : null;
  if(d==null) return null;
  const oneR=Math.abs(E-S); if(!oneR) return null;
  const off=d*(p-E)/oneR;                      // +: target side of entry, −: stop side
  if(Math.abs(off)<=ALIGN_R) return 'Aligned';
  if(off>0) return 'In front of entry';
  if(d*(p-S)<0) return 'Out of box';           // past the stop
  return 'Behind entry';                       // between the band and the stop
}
// ── shared bucket card ───────────────────────────────────────────────────────
// One categorical split of the same trades, scored the same way every time. Kept generic
// so a second split can be added later without inventing a second standard of evidence.
//
// Scored on whatever method currently leads, the same key the direction tilt uses, so this
// can never name a method the rest of the board has just ranked last.
function bucketCard({pool, label, keyFn, order, note, emptyNote, multi=false}){
  // multi: keyFn returns an array and a trade can sit in several buckets.
  const has = multi ? (t=>Array.isArray(keyFn(t))&&keyFn(t).length>0) : (t=>keyFn(t)!=null);
  const inB = multi ? ((t,k)=>keyFn(t).includes(k)) : ((t,k)=>keyFn(t)===k);
  const scored=pool.filter(has);
  const missing=pool.length-scored.length;
  if(!scored.length) return `<div class="card" style="margin-bottom:12px"><div class="lbl">${label}</div>
    <div class="empty-note">${emptyNote}</div></div>`;
  const LD=leaderOf(pool), TK=LD?LD.best.m.key:(MGMT[0]||{}).key, tname=LD?LD.best.m.name:'';
  const keys = order || [...new Set(multi ? scored.flatMap(keyFn) : scored.map(keyFn))];
  const rows=keys.map(k=>({k, s:fullStats(scored.filter(t=>inB(t,k)).map(t=>RV(t,TK)).filter(x=>x!=null))}))
                 .filter(x=>x.s.n);
  const ranked=[...rows].sort((a,b)=>(rankKey(b.s)-rankKey(a.s))||((b.s.lo??-999)-(a.s.lo??-999)));
  const top=ranked[0];
  // A winner is only named when the bucket is not thin AND its interval clears zero.
  // The failure mode this exists to stop is a 100% win rate off one trade reading as edge.
  const solid = top && top.s.n>=5 && top.s.lo>0 && !top.s.degenerate;
  const head = solid
    ? `<div class="band" style="margin:4px 0 2px">
         <div class="bandnum ${cls(top.s.mean)}">${top.k}</div>
         <div class="bandci">best of the set · ${fR(top.s.mean)} per trade · 95% CI [${fR(top.s.lo)}, ${fR(top.s.hi)}] · n${top.s.n}</div></div>`
    : `<div class="band" style="margin:4px 0 2px">
         <div class="bandnum mut">${top?top.k:'—'}</div>
         <div class="bandci">leading so far — <b>not</b> yet an edge${top?` · ${fR(top.s.mean)} on n${top.s.n}${top.s.n<5?', needs 5+':(top.s.lo<=0?', interval still spans zero':'')}`:''}</div></div>`;
  let body='';
  rows.forEach(x=>{ const thin=x.s.n<5;
    body+=`<tr><td><span class="pill">${x.k}</span></td>
      <td class="pm">${Math.round(x.s.winRate*100)}% win <span class="mini">${x.s.wins}/${x.s.scratches}/${x.s.losses}</span>${thin?' <span class="mini">thin</span>':''}</td>
      <td class="pr ${cls(x.s.mean)}">${fR(x.s.mean)}</td>
      <td class="pci mut">${x.s.n<2?'<span class="flag">no interval</span>':x.s.degenerate?'<span class="flag">±0</span>':`[${fR(x.s.lo)}, ${fR(x.s.hi)}]`}</td>

      const d=maxDrawdown(ser), l=maxLossStreak(ser).len||0; let run=0,w=0;
      for(const x of ser){ if(x>0.005){run++; if(run>w)w=run;} else run=0; }
      if(d>dd.v) dd={v:d,p}; if(l>ls.v) ls={v:l,p}; if(w>ws.v) ws={v:w,p}; });
    s.dd=dd.v; s.ddPair=dd.p; s.streak=ls.v; s.streakPair=ls.p; s.winStreak=ws.v; s.winStreakPair=ws.p; s.perPair=true;

}
function paired(a,b,pool){
  const d=[]; pool.forEach(t=>{const x=RV(t,a),y=RV(t,b); if(x!=null&&y!=null) d.push(y-x);});
  return ci95(d);
}
// Attach the flat fields the ported chart code reads. Called once per filter pass.
function decorate(pool){
  pool.forEach(t=>{ const w=t.raw||{}; t.Direction=w.Direction; t.maxRun=num(w.MaxRun); t.minFromOpen=minutesFromOpen(t); });
  return pool;
}

function equityCurveSVG(series, w, h){
  w=w||300; h=h||44;
  if(!series.length) return `<svg viewBox="0 0 ${w} ${h}"><line x1="0" y1="${h/2}" x2="${w}" y2="${h/2}" stroke="var(--zero)" stroke-width="1"/><text x="4" y="${h/2+4}" fill="#3d4553" font-size="10">no data</text></svg>`;
  const cum=[0]; series.forEach(r=>cum.push(cum[cum.length-1]+r));
  const minV=Math.min(0,...cum), maxV=Math.max(0,...cum);
  const range=(maxV-minV)||1, n=cum.length-1;
  const pad=3;
  const px=i=>(i/n)*w;
  const py=v=>pad+(1-(v-minV)/range)*(h-2*pad);
  const base=py(0);
  const pts=cum.map((v,i)=>({x:px(i), y:py(v), v}));
  const segs=[];
  let seg=[pts[0]], segSign=pts[0].v<0?'neg':'pos';
  for(let i=1;i<pts.length;i++){
    const a=pts[i-1], b=pts[i];
    if((a.v<0&&b.v>0)||(a.v>0&&b.v<0)){
      const t=a.v/(a.v-b.v);
      const cross={x:a.x+(b.x-a.x)*t, y:base, v:0};
      seg.push(cross);
      segs.push({pts:seg, sign:segSign});
      segSign=b.v<0?'neg':'pos';
      seg=[cross,b];
    } else {
      seg.push(b);
      if(b.v<0) segSign='neg'; else if(b.v>0) segSign='pos';
    }
  }
  segs.push({pts:seg, sign:segSign});
  const COL={pos:'#3fb950', neg:'var(--neg)'};
  const gid='eqg'+(_eqSeq++);
  const defs=`<defs>
    <linearGradient id="${gid}p" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${COL.pos}" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="${COL.pos}" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="${gid}n" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${COL.neg}" stop-opacity="0"/>
      <stop offset="100%" stop-color="${COL.neg}" stop-opacity="0.32"/>
    </linearGradient>
  </defs>`;
  let body='';
  segs.forEach(s=>{
    if(s.pts.length<2) return;
    const line=s.pts.map((p,i)=>(i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
    const first=s.pts[0], last=s.pts[s.pts.length-1];
    const area=`${line} L${last.x.toFixed(1)},${base.toFixed(1)} L${first.x.toFixed(1)},${base.toFixed(1)} Z`;
    body += `<path d="${area}" fill="url(#${gid}${s.sign==='pos'?'p':'n'})" stroke="none"/><path d="${line}" fill="none" stroke="${COL[s.sign]}" stroke-width="1.5"/>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}">
    ${defs}
    <line x1="0" y1="${base.toFixed(1)}" x2="${w}" y2="${base.toFixed(1)}" stroke="var(--zero)" stroke-width="1"/>

  </svg>`;
}
const fDD=d=>d<0.005?'0.00R':'-'+d.toFixed(2)+'R';

// One definition of the leader, used by every card that needs it. Ranked on the lower
// bound of the 95% interval; a zero-variance interval is every trade scoring the same
// number and cannot take the top spot. Previously the answer card and the prescription
// card each had their own rule and named different methods on the same screen.
// Ranking key. A zero-variance sample is NOT unrankable — every trade landing on the same
// number means the observed spread is zero, so the best estimate of the lower bound is the
// mean itself. Barring it outright (the earlier rule) handed session picks to strictly
// worse methods: in Asia it preferred 50% @1R at +0.65R over Full @1R at +1.00R purely
// because the better one had no spread. The ±0 flag still marks it, because zero observed
// variance in 2-4 binary outcomes is a short streak, not consistency.
// Ranking is by the lower bound of the 95% interval — POTUS's call 2026-09-07. It answers the
// question the board is actually asked: over many trades, which management earns the most
// per trade? The confidence interval stays printed on every row, so how much of that mean
// rests on one outlier is still visible — it just no longer decides the order. Exact ties
// fall back to the lower bound, so equal earners are led by the steadier one.
// Ranked on the LOWER BOUND of the 95% interval, not the mean — POTUS's call 2026-09-07.
// The mean rewards whichever method happened to catch the fattest tail: Full @4R has the
// highest mean on this log AND the widest spread of the nine, so it tops a mean ranking
// while being the least dependable. The lower bound asks the other question — what does
// this method clear even on an unlucky read of the same evidence — and drops it to fourth.
// A zero-width interval still cannot win (see rankKey), because that is not confidence,
// it is every observation landing on the same number.
// Ranking is by expectancy — mean R per trade — POTUS's call 2026-08-29. It answers the
// question the board is actually asked: over many trades, which management earns the most
// per trade? The confidence interval stays printed on every row, so how much of that mean
// rests on one outlier is still visible — it just no longer decides the order. Exact ties
// fall back to the lower bound, so equal earners are led by the steadier one.
const rankKey = s => s.mean ?? -999;
function rankRows(rows, pool){
  if(rows.length<2) return rows;
  return [...rows].sort((a,b)=>
    (rankKey(b.s)-rankKey(a.s)) || ((b.s.lo??-999)-(a.s.lo??-999)));
}

function leaderOf(pool){
  const rows=MGMT.map(m=>({m,s:statsFor(m.key,pool)})).filter(x=>x.s.n);
  if(!rows.length) return null;
  const order=rankRows(rows,pool);
  return {best:order[0], up:order[1], order};
}

function winnerCard(pool){
  const rows=MGMT.map(m=>({m,s:statsFor(m.key,pool)})).filter(x=>x.s.n);
  if(!rows.length) return '';
  // Same rule as the matrix: lower bound of the interval, and a zero-width interval
  // cannot take the top spot. Ranking this card by mean while the table below it ranks by

  const L=leaderOf(pool); const best=L.best, up=L.up, order=L.order, s=best.s;
  const beatsZero = s.lo>0;
  const margin = up ? paired(up.m.key,best.m.key,pool) : null;
  const beatsNext = margin && margin.n>0 && margin.lo>0;
  const solid = beatsZero && beatsNext;
  const ties = rows.slice(1).filter(r=>{
    const p=paired(best.m.key,r.m.key,pool); return p.n>0 && !(p.lo>0);

    <div class="fsub">${best.m.desc}</div>

      <div class="stat"><div class="k">Total R</div><div class="v ${cls(s.total)}">${fR(s.total)}</div></div>
      <div class="stat"><div class="k">Max drawdown</div><div class="v neg">${fDD(s.dd)}${s.ddPair?` <span class="mini">${s.ddPair}</span>`:''}</div></div>
      <div class="stat"><div class="k">LIS</div><div class="v ${s.streak?'neg':'mut'}">${s.streak}${s.streakPair?` <span class="mini">${s.streakPair}</span>`:''}</div></div>
      <div class="stat"><div class="k">WIS</div><div class="v ${s.winStreak?'pos':'mut'}">${s.winStreak}${s.winStreakPair?` <span class="mini">${s.winStreakPair}</span>`:''}</div></div>
      <div class="stat"><div class="k">Trading days</div><div class="v mut">${days}</div></div>
    </div>
    ${up?`<div class="ctlstrip" style="margin-top:9px">Runner-up: <b style="color:var(--ink)">${up.m.name}</b> at ${fR(up.s.mean)} — leader is ahead by
      <b class="${margin.n?cls(margin.mean):''}">${margin.n?fR(margin.mean):'—'}</b> paired${beatsNext?' <span class="sig">significant</span>':' · not significant'}.</div>`:''}
    ${solid?'':`<div class="caveat" style="margin-top:9px">
      <b>Read this as a lean, not a verdict.</b> ${ties.length?`Statistically tied with: ${ties.map(t=>t.m.name).join(', ')}. `:''}
      ${beatsZero?'The leader clears zero on its own, but its margin over the runner-up does not — those are different claims.':'The leader\'s own interval still includes zero.'}</div>`}
  </div>`;
}

function reachLadderSVG(pool){
  // Above ~24 trades the per-trade bars stop being readable, so the same data is
  // drawn as a survival curve instead: what share of trades reached at least X R.
  // Same information, and it gets MORE legible as n grows rather than less.
  // Always the survival curve — POTUS chose one format for both boards, and it is the
  // one that gets MORE legible as n grows. The per-trade bar variant is retired.
  return reachCurveSVG(pool);
}

// One colour per method on the reach fan. Warm for the Full family, cool for the 1R
// partials, violet for the 2R partials, so a family still reads as a group — but every
// line is its own hue. Green is reserved for the reach itself; nothing here is green.
// Colours are generated, not hand-picked: 39 lines need a system. Fulls walk yellow→red as the
// target rises; each partial family owns a hue and ramps darker as its cap rises. Green stays
// reserved for the reach itself.
const FAM_HUE={p1:215, 'p1.25':195, 'p1.5':170, 'p1.75':50, p2:270, 'p2.25':300, 'p2.5':330, 'p2.75':30};
const M_COLOR=(()=>{ const out={trail:'#9aa3b2'}, byFam={};
  MGMTS_OBVS.forEach(m=>(byFam[m.fam]=byFam[m.fam]||[]).push(m.k));
  Object.entries(byFam).forEach(([fam,ks])=>ks.forEach((k,i)=>{
    const n=Math.max(ks.length-1,1);
    out[k]= fam==='full' ? `hsl(${Math.round(52-52*i/n)},95%,60%)`
          : `hsl(${FAM_HUE[fam]??0},${fam==='p2.75'?45:85}%,${Math.round(74-32*i/n)}%)`; }));
  return out; })();
function reachCurveSVG(pool){
  // Green is what PRICE did — max run — and is the same for every method. Every other
  // line is what one exit rule would have kept on the same trades: the twelve methods
  // plus the trade as it was actually run (dashed). Each is a survival curve: at any R,
  // the share of trades that still held at least that much when that rule closed them.
  // Every line sits on or under green, because a rule can only keep what ran; the
  // vertical gap to green is that rule's unsecured R.
  //
  // The determination on top ranks the rules by MEAN gap per trade, in R. Green is fixed,
  // so the smallest gap is exactly the largest total R — the same method the board leads
  // with, seen from what it leaves behind. "As traded" is not a scored method anywhere
  // else on the board, so its place in this ranking is the one thing here the matrix
  // cannot tell you.
  // One pool for every line: a trade whose runner exit is unknown on either run is left
  // out of the fan altogether, so all three curves and the reach share one denominator.
  const whole=t=>t.maxRunR!=null && t.exitR!=null && MGMT.every(m=>RV(t,m.key)!=null);
  const scored=pool.filter(whole);
  const unknown=pool.filter(t=>t.maxRunR!=null && !whole(t)).length;
  if(!scored.length) return '';
  const LD=leaderOf(pool);
  const keys=['trail', ...MGMT.map(m=>m.key)];
  const sel = keys.includes(REACH_KEY) ? REACH_KEY : (LD?LD.best.m.key:'trail');
  const keptOf = k => k==='trail' ? (t=>t.exitR) : (t=>RV(t,k));
  const nameOf = k => k==='trail' ? 'as traded' : (MGMT.find(m=>m.key===k)||{}).mid||k;
  const run=scored.map(t=>t.maxRunR).sort((a,b)=>a-b);
  const offered=scored.reduce((a,t)=>a+Math.max(t.maxRunR,0),0);
  const series = keys.map(k=>{ const f=keptOf(k), vals=scored.map(f);
    const gap=vals.reduce((a,v,i)=>a+(scored[i].maxRunR-v),0)/vals.length;      // mean R per trade left on the table
    const banked=vals.reduce((a,v)=>a+v,0);
    return {k, vals:[...vals].sort((a,b)=>a-b), gap, capture:offered>0?banked/offered:null}; });
  const bySer=Object.fromEntries(series.map(x=>[x.k,x]));
  const selS=bySer[sel];
  const ranked=[...series].sort((a,b)=>a.gap-b.gap);
  const bestM=ranked.find(x=>x.k!=='trail'), worstM=[...ranked].reverse().find(x=>x.k!=='trail'), tr=bySer.trail;
  const trailBeats = tr.gap < bestM.gap - 1e-9;
  const med=a=>a[Math.floor(a.length/2)];
  const W=1000,H=256,padL=52,padR=24,padT=30,padB=34;
  const TOPROW=21;   // reached-% band, entirely above the plot area so it never meets a curve
  // Axis pinned to the target band: 1R at the left edge, a hair past 5R at the right.
  // The old axis spent 24–28% of its width below 1R on curve tails that carried no mark,
  // and another 19–30% past the last target. Reclaiming both puts the eleven marks 56.3px
  // apart instead of 26.1px, which is what finally lets every label render at full size.
  // Fixing both ends also makes that spacing CONSTANT. It used to shrink every time the
  // log grew a longer runner, because the right edge tracked the 95th percentile — so the
  // chart got harder to read the more data it had. Nothing is lost: what falls outside
  // either end is counted in the footnote, and the share that never reached 1R is simply
  // where the green line starts.
  // TCLV: entry at the left edge, a hair past the 1.272 runner target (1.61R) at the right.
  const minR=0, maxR=2.0;
  const offChart=run.filter(v=>v>maxR).length, longest=run[run.length-1];
  const below=run.filter(v=>v<minR).length;
  const pw=W-padL-padR, ph=H-padT-padB;
  const surv=(rs,r)=>rs.filter(v=>v>=r).length/rs.length;
  // The Y axis stops just above the highest point any curve reaches, not at 100%. Green is
  // the upper envelope — a rule can only keep what ran — and survival is non-increasing, so
  // the single highest plotted value is green at the left edge: 70% on the V6 board today.
  // Everything above that was dead band no curve could enter, and it was spending ~30% of
  // the plot height that the forty-line fan needs to separate.
  // Snap up to the next 5%, and take one more step if that would leave the top curve
  // kissing the ceiling. The 0.1 floor stops a pool where almost nothing reached 1R from
  // collapsing the chart to no height at all.
  const yMax=surv(run,minR);

  const x=r=>padL+(r-minR)/(maxR-minR)*pw, y=p=>padT+(1-p/yCap)*ph;
  const pathOf=rs=>{ let d=''; for(let i=0;i<=160;i++){ const r=minR+(maxR-minR)*i/160;
    d+=(i?'L':'M')+x(r).toFixed(1)+','+y(surv(rs,r)).toFixed(1); } return d; };
  const GREEN='#3fb950', SELC=M_COLOR[sel];
  let grid='';
