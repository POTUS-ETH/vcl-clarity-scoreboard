  // radius, no opacity step. At 56.3px spacing every string clears comfortably — "1.25R"
  // is 27.0px, "fib 2.25" 38.4px, "100%" 22.8px — which is what the two-tier version and
  // the A/B row experiments were both working around. Reclaiming the axis removed the
  // problem rather than dressing it.
  // Reached-% sits in its own band above the plot, so the fan carries no text at all.
  // Kept-% is gone: with 39 methodologies a single selected method's per-level readout was
  // one number out of 39 competing for the busiest part of the chart. The selected method
  // is still drawn — it is the heavy line in the fan — and still summarised in the stats
  // row below, which is where a single-method figure belongs.
  R_LEVELS.forEach(({r:N,f,lab})=>{
    const pr=surv(run,N), X=x(N).toFixed(1);
    grid+=`<line x1="${X}" y1="${padT-4}" x2="${X}" y2="${(H-padB).toFixed(1)}" stroke="#2a3140" stroke-width="1"/>`
       +  `<text x="${X}" y="${(H-padB+13).toFixed(1)}" font-size="9" fill="#c3c9d4" text-anchor="middle" font-weight="700">${lab||N+'R'}</text>`
       +  `<text x="${X}" y="${(H-padB+23).toFixed(1)}" font-size="8" fill="#6b7280" text-anchor="middle">${f}</text>`
       +  `<circle cx="${X}" cy="${y(pr).toFixed(1)}" r="3.5" fill="${GREEN}"/>`
       +  `<text x="${X}" y="${TOPROW}" font-size="9.5" font-weight="700" fill="${GREEN}" text-anchor="middle">${Math.round(pr*100)}%</text>`;
  });
  let yax='';
  // Gridline step picked to land on round percentages and divide the cap evenly, falling
  // back to quarters. The cap itself always gets a line, so the ceiling is always labelled
  // even when it is not a multiple of the step.
  const yStep=[0.25,0.2,0.1].find(s=>Math.abs(yCap/s-Math.round(yCap/s))<1e-9 && yCap/s<=5)||0.25;
  const yTicks=[]; for(let p=0;p<=yCap+1e-9;p+=yStep) yTicks.push(+p.toFixed(4));
  if(Math.abs(yTicks[yTicks.length-1]-yCap)>1e-9) yTicks.push(+yCap.toFixed(4));
  yTicks.forEach(p=>{
    yax+=`<line x1="${padL}" y1="${y(p).toFixed(1)}" x2="${(W-padR).toFixed(1)}" y2="${y(p).toFixed(1)}" stroke="#1f2735" stroke-width="1"/>`
      +  `<text x="${padL-7}" y="${(y(p)+3.5).toFixed(1)}" font-size="9" fill="#6b7280" text-anchor="end">${Math.round(p*100)}%</text>`;
  });
  // Twelve thin lines under one heavy green; the selected line a touch heavier and on top.
  const fan = series.filter(x=>x.k!==sel).map(x=>
    `<path d="${pathOf(x.vals)}" fill="none" stroke="${M_COLOR[x.k]}" stroke-width="0.9" opacity="0.8"${x.k==='trail'?' stroke-dasharray="4 3"':''}/>`).join('');
  const selPath = `<path d="${pathOf(selS.vals)}" fill="none" stroke="${SELC}" stroke-width="1.8"${sel==='trail'?' stroke-dasharray="6 3"':''}/>`;
  // Legend doubles as the picker. Selected chip carries its colour as a border.
  const chip=(k,extra='',rank=null)=>`<span class="rchip${k===sel?' on':''}" data-reach="${k}" style="--c:${M_COLOR[k]}">${rank?`<u>${rank}</u>`:''}<i></i>${nameOf(k)}${extra}</span>`;
  // Chips in capture order, best first — the same order as smallest gap, since both are
  // just total R kept. A rank number on each so the order survives wrapping onto two rows.
  const legend=`<div class="rleg"><span class="rchip" style="--c:${GREEN};cursor:default"><i></i>reached · max run</span>${ranked.map((x,i)=>chip(x.k, ` <b>${x.capture==null?'—':(x.capture*100).toFixed(1)+'%'}</b>`, i+1)).join('')}</div>`;
  const head=`<div class="band" style="margin:4px 0 6px">
      <div class="bandnum" style="color:${M_COLOR[bestM.k]}">${nameOf(bestM.k)}</div>
      <div class="bandci"><b>smallest gap</b> to the reach — leaves <b>${bestM.gap.toFixed(2)}R</b> per trade on the table, keeps ${Math.round(bestM.capture*100)}% of the R price offered
        · ${trailBeats?`<span style="color:${M_COLOR.trail}"><b>as traded beats it</b> at ${tr.gap.toFixed(2)}R — your actual exits kept more than any fixed rule</span>`:`as traded ${tr.gap.toFixed(2)}R`}
        · widest: ${nameOf(worstM.k)} ${worstM.gap.toFixed(2)}R</div></div>`;
  const stats=`<div class="rstats">
      <span><i>median run</i><b>${med(run).toFixed(2)}R</b></span>
      <span><i>median kept · ${nameOf(sel)}</i><b style="color:${SELC}">${med(selS.vals).toFixed(2)}R</b></span>
      <span><i>mean gap · ${nameOf(sel)}</i><b>${selS.gap.toFixed(2)}R</b></span>
      <span><i>captured · ${nameOf(sel)}</i><b style="color:${selS.capture==null?'#6b7280':selS.capture>=0?'#e6e8ec':'#e66767'}">${selS.capture==null?'—':Math.round(selS.capture*100)+'%'}</b></span></div>`;
  return `<div class="card answer" style="padding:12px 14px 8px">
    <div class="lbl">Reach curve — % of trades that reached each target, and what each exit kept (n=${scored.length})</div>
    ${head}
    <svg viewBox="0 0 ${W} ${H}" style="display:block;width:100%;height:auto">
      ${yax}${fan}
      <path d="${pathOf(run)}" fill="none" stroke="${GREEN}" stroke-width="3"/>
      ${selPath}${grid}
    </svg>
    ${legend}${stats}
    <div class="fsub" style="margin:6px 0 0">Green is how often price reached each level at all — the same for every method, because it is what price did. Each thin line is how often one exit still held that level when it closed the trade: Base hit stops at 0.43R because it can never keep more; the two runs step up to 1.02R only on trades where 1.272 printed, and otherwise sit wherever the runner got out. The dashed line is the trade as traded: half at 0.618, the rest at your exit. Names are ordered best to worst by how much of the offered R each exit captured — the figure beside each — and that order is by definition the expectancy order too. Click a name to make its line bold and read its numbers. The axis runs from entry (0R) to just past the 1.272 runner target. Marks sit at the fib's nominal R; with orders snapped to the tick, a trade's own figure lands within a tick of its mark.${below?` <b>${below} trade${below===1?'':'s'}</b> carry a Max Run below entry — check the log.`:''}${offChart?` <b>${offChart} trade${offChart===1?'':'s'}</b> ran past ${maxR}R, the longest to ${longest.toFixed(1)}R.`:''}${unknown?` <b>${unknown} trade${unknown===1?'':'s'}</b> left out: no exit price, or a runner exit unknown, so no single pool could carry every line.`:''} Everything outside the axis is still counted in every number here.</div>
  </div>`;
}

function intervalStripSVG(pool){
  const rows=MGMT.map(m=>({m,s:statsFor(m.key,pool)})).filter(x=>x.s.n);
  if(!rows.length) return '';
  rows.sort((a,b)=>b.s.mean-a.s.mean);
  const W=1000,labW=196,valW=66,padT=20,padB=20,rh=17;
  const H=padT+padB+rows.length*rh;
  const lo=Math.min(-1.3,...rows.map(r=>r.s.lo)), hi=Math.max(1.3,...rows.map(r=>r.s.hi));
  const pw=W-labW-valW, x=v=>labW+(v-lo)/(hi-lo)*pw;
  const lead=rows[0].s;

  let ticks='';
  for(let v=Math.ceil(lo);v<=Math.floor(hi);v++){
    if(v===0) continue;
    ticks+=`<line x1="${x(v).toFixed(1)}" y1="${padT-6}" x2="${x(v).toFixed(1)}" y2="${(H-padB+2).toFixed(1)}" stroke="#232a36" stroke-width="1"/>`
        +  `<text x="${x(v).toFixed(1)}" y="${(H-padB+14).toFixed(1)}" font-size="8.5" fill="#6b7280" text-anchor="middle">${v>0?'+':''}${v}R</text>`;
  }
  let body='';
  rows.forEach((r,i)=>{
    const yy=padT+i*rh+rh/2, s=r.s;
    const crosses=s.lo<0&&s.hi>0;
    const col=crosses?'#4a5568':(s.lo>0?'#3fb950':'var(--neg)');
    const dot=crosses?'#8b93a1':col;
    body+=`<text x="0" y="${(yy+3.5).toFixed(1)}" font-size="10" fill="#c3c9d4">${r.m.name}</text>`
       +  `<line x1="${x(s.lo).toFixed(1)}" y1="${yy.toFixed(1)}" x2="${x(s.hi).toFixed(1)}" y2="${yy.toFixed(1)}" stroke="${col}" stroke-width="2"/>`
       +  `<circle cx="${x(s.mean).toFixed(1)}" cy="${yy.toFixed(1)}" r="3.5" fill="${dot}"/>`
       +  `<text x="${W}" y="${(yy+3.5).toFixed(1)}" font-size="10" font-weight="700" fill="${crosses?'#8b93a1':col}" text-anchor="end">${fR(s.mean)}</text>`;
  });
  const allGrey=rows.every(r=>r.s.lo<0&&r.s.hi>0);
  return `<div class="card" style="padding:12px 14px 10px;margin-top:8px">
    <div class="lbl">All ${rows.length} outcomes · 95% confidence intervals on one axis</div>
    <svg viewBox="0 0 ${W} ${H}" style="display:block;width:100%;height:auto">
      <rect x="${x(lead.lo).toFixed(1)}" y="${padT-4}" width="${(x(lead.hi)-x(lead.lo)).toFixed(1)}" height="${(rows.length*rh+6).toFixed(1)}" fill="#9dc0f6" fill-opacity="0.06"/>
      ${ticks}
      <line x1="${x(0).toFixed(1)}" y1="${padT-8}" x2="${x(0).toFixed(1)}" y2="${(H-padB+2).toFixed(1)}" stroke="#5a6478" stroke-width="1.5"/>
      ${body}
    </svg>
    <div class="fsub" style="margin:6px 0 0">Dot = expectancy, bar = 95% interval. <b>Grey means the bar crosses zero</b> — that outcome is not yet distinguishable from no edge at all. The shaded band is the leader's interval: anything whose dot sits inside it is not distinguishable from the leader either${allGrey?', and right now every one of them does':''}.</div>
  </div>`;
}

// ── expectancy matrix with per-method drawer ─────────────────────────────────
// Module-level so the 5s poll cannot clobber it: render() rebuilds the whole board, and
// an open row must survive that.
let OPEN_ROW=null, OPEN_MONTH={}, SEL_DAY={};

// A compact month grid for ONE method, rendered inside its drawer. This replaces the big
// shared calendar at the foot of the board: the calendar always answered a per-method
// question, so it belongs with the method rather than behind its own selector.
function miniCal(key,pool){
  const dated=pool.filter(t=>t.date && RV(t,key)!=null);
  if(!dated.length) return '<div class="mini">No dated trades for this method.</div>';
  const months=[...new Set(dated.map(t=>ym(t.date)))].sort();
  const cur=OPEN_MONTH[key]&&months.includes(OPEN_MONTH[key])?OPEN_MONTH[key]:months[months.length-1];
  const idx=months.indexOf(cur), [Y,M]=cur.split('-').map(Number);
  const first=new Date(Y,M-1,1), start=first.getDay(), dim=new Date(Y,M,0).getDate();
  const byDay={};
  if(!SEL_DAY[key]){ const ds=[...new Set(dated.map(t=>t.date))].sort(); SEL_DAY[key]=ds[ds.length-1]; }
  dated.filter(t=>ym(t.date)===cur).forEach(t=>{ const d=Number(t.date.slice(8,10)), r=RV(t,key);
    (byDay[d]=byDay[d]||{sum:0,n:0}); byDay[d].sum+=r; byDay[d].n++; });
  let cells='';
  for(let i=0;i<start;i++) cells+='<div class="mc-d mc-e"></div>';
  for(let d=1;d<=dim;d++){ const x=byDay[d];
    const iso=`${cur}-${String(d).padStart(2,'0')}`, sel=SEL_DAY[key]===iso;
    cells+=`<div class="mc-d${x?(x.sum>0?' mc-w':(x.sum<0?' mc-l':' mc-f')):''}${sel?' mc-s':''}${x?' mc-c':''}" `+
           `${x?`data-day="${iso}" data-cal="${key}" title="${fR(x.sum)} · ${x.n} trade${x.n>1?'s':''}"`:''}>`+
           `<span class="mc-n">${d}</span>${x?`<span class="mc-r ${cls(x.sum)}">${fR(x.sum)}</span>`:''}</div>`; }
  const nav=months.length>1
    ? `<button class="mc-b" data-cal="${key}" data-mo="${months[idx-1]||''}" ${idx<=0?'disabled':''}>‹</button>`+
      `<button class="mc-b" data-cal="${key}" data-mo="${months[idx+1]||''}" ${idx>=months.length-1?'disabled':''}>›</button>` : '';
  return `<div class="mc-h"><span>${first.toLocaleString('en-US',{month:'long',year:'numeric'})}</span><span>${nav}</span></div>
    <div class="mc-w7"><i>S</i><i>M</i><i>T</i><i>W</i><i>T</i><i>F</i><i>S</i></div>
    <div class="mc-g">${cells}</div>`;
}

// Trades on one day, for the method whose drawer is open. The calendar answers "when";
// this answers "which trades, and what did they actually do". They belong side by side —
// the space to the right of a month grid was otherwise dead.
// Trades on one day, for the method whose drawer is open. Prices come through tradeFields(), which
// normalises the two payload shapes: futures nests them under t.raw with model-prefixed
// names (SMMaxRun / VCLTrailStop), crypto keeps them flat (maxRun / bosExit). A field a
// board does not have is simply omitted rather than rendered as a dash — crypto has no L1
// leg and no Max Adverse column, so those rows must not appear there at all.
function tradeFields(t){
  const w=t.raw||{};
  return {
    pair:t.pair||w.Pair||null, dir:t.dir||w.Direction||null, trader:t.trader||w.Trader||null,
    time:w.EntryTime||null, tz:w.Timezone||null, min:t.minFromOpen??null,
    entry:t.entry??null, anchor:t.anchor??null, stop:t.stop??null, l1Price:t.l1Price??null, tp:t.tp??null, t1272:t.t1272??null,
    maxRun:num(w.MaxRun), exit:num(w.ExitPrice),
    tpTime:w.TpTime||null, t1272Time:w.T1272Time||null, backTime:w.BackTime||null, exitTime:w.ExitTime||null, tIn:t.tIn||null,
    l1:!!w.L1Filled, l1Inferred:!!t.l1Inferred, hitEntry:!!w.HitEntry, ema:!!w.EmaAligned, stopped:!!t.stopped, why:t.why||null, note:t.note||null };
}
function dayDetail(key,pool){
  const day=SEL_DAY[key];
  const ts=pool.filter(t=>t.date===day && RV(t,key)!=null);
  if(!day||!ts.length) return `<div class="dd-empty">Select a day with trades.</div>`;
  const tot=ts.reduce((a,t)=>a+RV(t,key),0);
  const px=v=>v==null?null:Number(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  const rows=ts.map(t=>{
    const R=RV(t,key), f=tradeFields(t);
    const cell=(label,val)=>val==null?'':`<span>${label}</span><b>${val}</b>`;
    const fields=[
      cell('stop · fib 0',px(f.stop)), cell('1 of fib · swing',px(f.anchor)), cell('entry · 0.382',px(f.entry)), cell('L1 · 0.17',px(f.l1Price)),
      cell('TP · 0.618',px(f.tp)), cell('runner · 1.272',px(f.t1272)), cell('max run',px(f.maxRun)), cell('exit',px(f.exit)),
      cell('L1 filled',f.l1?'yes':f.l1Inferred?'yes (from the exit)':'no'), cell('stopped out',f.stopped?'yes (exit at the stop)':'no'),
      cell('back to entry',f.backTime?f.backTime:(f.hitEntry?'yes (from the exit)':'no')), cell('EMAs aligned',f.ema?'yes':'no'), f.min==null?'':cell('min from open',String(f.min)),
      cell('TP time',f.tpTime), cell('1.272 time',f.t1272Time), cell('exit time',f.exitTime), f.tIn&&f.tIn.trail!=null?cell('in trade',f.tIn.trail+' min'):'',
      f.why?`<span>fix</span><b class="flag" style="cursor:default">${f.why}</b>`:'',
      f.note?`<span>note</span><b class="mut" style="font-weight:400">${f.note}</b>`:'',
    ].filter(Boolean).join('');
    return `<div class="dd-t">
      <div class="dd-hd">
        <span><span class="pill">${f.pair||'—'}</span> <b>${f.dir||'—'}</b>
          <span class="mini">${f.trader?f.trader+' · ':''}${t.session||''}${f.time?' · '+f.time:''}${f.tz?' '+f.tz:''}</span></span>
        <span class="dd-r ${cls(R)}">${fR(R)}</span>
      </div>
      <div class="dd-g">${fields}</div>
    </div>`;}).join('');
  return `<div class="dd-h"><span>${day}</span><span class="${cls(tot)}">${fR(tot)} · ${ts.length} trade${ts.length>1?'s':''}</span></div>`+
         `<div class="dd-l">${rows}</div>`;
}

function methodDrawer(m,pool){
  const inf=METHOD_INFO[m.key]||{}, s=statsFor(m.key,pool);
  const pre = String(m.key).startsWith('m_') ? MARIO_PREAMBLE : LADDER_PREAMBLE;
  return `<tr class="dr" data-drawer="${m.key}"><td colspan="8"><div class="dr-in">
    <div class="dr-g">
      <div class="dr-b"><div class="dr-k">What it is</div><p>${inf.what||'<span class="mut">Not yet described.</span>'}</p></div>
      <div class="dr-b"><div class="dr-k">How it is tested</div><p>${inf.test||'<span class="mut">—</span>'}</p></div>
    </div>
    <div class="dr-b dr-cal"><div class="dr-k">By day — this method only <span class="dr-hint">click a day</span></div>${miniCal(m.key,pool)}</div>
    <div class="dr-b dr-day"><div class="dr-k">Trades on the selected day</div>${dayDetail(m.key,pool)}</div>
    <div class="dr-pre">${pre}</div>
  </div></td></tr>`;
}

// Column sort over the SCORED rows only. dir -1 descending, +1 ascending, so (a-b)*dir
// reads straight off the toggle. Ties fall back to the board's own ranking so a column of
// identical values still lists the better method first.
// n<2 has no interval to compare — lo and hi exist but equal the mean, and the cell renders
// a dash — so a CI sort parks those rows after the real intervals instead of interleaving
// them with numbers the reader cannot see.
function sortRows(rows){
  const {key,dir}=MATRIX_SORT;
  const noCI = r => key==='lo' && !(r.s.n>1);
  return [...rows].sort((a,b)=>{
    const an=noCI(a), bn=noCI(b);
    if(an!==bn) return an?1:-1;                 // dash rows last in BOTH directions
    if(an&&bn) return 0;
    return (((a.s[key]??0)-(b.s[key]??0))*dir) || (rankKey(b.s)-rankKey(a.s));
  });
}
// One sortable header. The arrow slot is always present (hidden when inactive) to keep
// column widths fixed; ▾ reads as descending, ▴ as ascending.
function sortHead(key,label,extra){
  const on=MATRIX_SORT&&MATRIX_SORT.key===key;
  const arw=on&&MATRIX_SORT.dir>0 ? '▴' : '▾';
  return `<th class="srt${on?' on':''}${extra||''}" data-sort="${key}">${label}`
       + `<span class="sarw${on?'':' off'}">${arw}</span></th>`;
}

// Rank by the LOWER BOUND of the 95% interval, not raw expectancy. That is what "best
// return with least pain" actually is: a method that pays well and behaves consistently
// has a high lower bound; one that pays well by way of a single outlier does not. It is
// also order-independent, unlike drawdown or losing streak.
function matrixTable(pool){
  // MGMT, not MGMTS: the normalised list carries .key/.name on both boards. Reading
  // m.k here emitted data-row="undefined", which set OPEN_ROW to the string
  // "undefined" and made every drawer unopenable on the crypto side.
  let rows=MGMT.map(m=>({m, s:statsFor(m.key,pool)}));   // reassigned by rankRows below; statsFor carries the per-pair path stats
  const scored=rows.filter(r=>r.s.n), unscored=rows.filter(r=>!r.s.n);
  const ranked=rankRows(scored,pool);
  // A zero-width interval is every observation landing on the same number, not confidence.
  // It must not take the crown.
  // Read off the RANKED order, never the displayed one. This used to be rows.find(), i.e.
  // simply "whatever sits in row 1" — fine while display order WAS merit order, but a
  // user-chosen column sort decides row 1, and an ascending sort would then hand the crown
  // to the worst method on the board.
  const winner=ranked.find(r=>r.s.n>0);
  // Unscored rows carry no metric to compare, so they stay pinned last under every sort
  // rather than filling the top of an ascending one with dashes.
  rows = (MATRIX_SORT ? sortRows(ranked) : ranked).concat(unscored);
  // One trading day cannot produce a meaningful drawdown or streak — there is no order to
  // speak of. Grey the whole group below 10 days rather than printing numbers that look
  // like measurements.
  const days=new Set(pool.map(t=>t.date).filter(Boolean)).size;
  const dim = days<10 ? ' dimc' : '';
  let html='';
  rows.forEach(r=>{
    const s=r.s, open=OPEN_ROW===r.m.key, isBest=winner&&r.m.key===winner.m.key&&s.n>0;
    const ci = s.n>1
      ? `<span class="${s.degenerate?'mut':(s.lo>0?'pos':'')}">[${fR(s.lo)}, ${fR(s.hi)}]</span>${s.degenerate?' <span class="flag" title="Every trade scored the same number — zero variance, not confidence">±0</span>':''}`
      : '<span class="mut">—</span>';
    html+=`<tr class="mrow ${isBest?'best':''} ${open?'is-open':''}" data-row="${r.m.key}">`+
      `<td class="mname"><button class="chev" aria-expanded="${open}" data-row="${r.m.key}">${open?'▾':'▸'}</button>${r.m.name}</td>`+
      `<td class="${s.n?cls(s.mean):'mut'}">${s.n?fR(s.mean):'—'}</td>`+
      `<td class="cicol">${ci}</td>`+
      `<td>${s.n?Math.round(s.winRate*100)+'%':'—'}</td>`+
      `<td class="${s.n?cls(s.total):'mut'}">${s.n?fR(s.total):'—'}</td>`+
      `<td class="mut">${s.n||'—'}</td>`+
      // Path group. Drawdown and streak depend on the ORDER these trades happened in;
      // expectancy and win% do not. Reshuffle the log and only these two move — so they
      // sit behind a divider under their own heading rather than reading as peers.
      `<td class="pathc${dim}">${s.n?(s.losses===0?'<span class="mut">none</span>':'<b class="neg">-'+s.dd.toFixed(2)+'R</b>'+(s.ddPair?' <span class="mini">'+s.ddPair+'</span>':'')):'—'}</td>`+
      `<td class="pathc${dim}">${s.n?(s.losses===0?'<span class="mut">—</span>':s.streak+'×'+(s.streakPair?' <span class="mini">'+s.streakPair+'</span>':'')):'—'}</td></tr>`;
    if(open) html+=methodDrawer(r.m,pool);
  });
  const note = days<10
    ? `Worst run and streak describe the order these ${pool.length} trades happened in, not the strategy — and ${days} trading day${days===1?'':'s'} is not enough order to describe. Reshuffle the log and they change; expectancy and win% do not.`
    : `Worst run and streak describe the order these trades happened in, not the strategy. Reshuffle the log and they change; expectancy and win% do not. With several pairs in view each is the single worst pair's own run, named beside it — never the interleaved log.`;
  return `<table class="matrix"><thead>
    <tr class="grp"><th></th><th colspan="4">Distribution — order-independent</th><th></th>
        <th colspan="2" class="pathh${dim}">Path — depends on trade order</th></tr>
    <tr><th class="srt${MATRIX_SORT?'':' on'}" data-sort="default" title="Back to the board's own ranking">Method</th>${sortHead('mean','Exp')}${sortHead('lo','95% CI')}${sortHead('winRate','Win%')}${sortHead('total','Tot')}<th>n</th>
        ${sortHead('dd','Worst run',' pathc'+dim)}${sortHead('streak','Streak',' pathc'+dim)}</tr>
    </thead><tbody>${html}</tbody></table>
    <div class="mnote">${note}</div>`;
}

function wireMatrix(){
  document.querySelectorAll('.matrix .chev, .matrix .mrow .mname').forEach(el=>{
    el.onclick=e=>{ e.stopPropagation();
      const k=(e.currentTarget.dataset.row)||(e.currentTarget.closest('tr').dataset.row);
      OPEN_ROW = OPEN_ROW===k ? null : k; render(); };
  });
  // Column headers. Scoped to the data row: the group row's spanning headers carry no
  // data-sort and stay inert. First click on a column is descending; clicking the active
  // column flips direction and never clears the sort — Method is the only reset.
  document.querySelectorAll('.matrix thead tr:not(.grp) th[data-sort]').forEach(th=>{
    th.onclick=e=>{ e.stopPropagation();
      const k=e.currentTarget.dataset.sort;
      if(k==='default') MATRIX_SORT=null;
      else if(MATRIX_SORT&&MATRIX_SORT.key===k) MATRIX_SORT={key:k, dir:-MATRIX_SORT.dir};
      else MATRIX_SORT={key:k, dir:-1};          // -1 = descending, greatest first
      render(); };
  });
}
// Controls that live outside the matrix — the calendars' month/day buttons and the reach
// curve's method picker — are wired on every render. They used to sit inside wireMatrix,
// which only runs while the matrix is expanded, so collapsing it silently killed them.
function wireControls(){
  document.querySelectorAll('.mc-d[data-day]').forEach(c=>{
    c.onclick=e=>{ e.stopPropagation(); const {cal,day}=e.currentTarget.dataset;
      SEL_DAY[cal]=day; render(); };
  });
  document.querySelectorAll('.mc-b').forEach(b=>{
    b.onclick=e=>{ e.stopPropagation(); const {cal,mo}=e.currentTarget.dataset;
      if(mo){ OPEN_MONTH[cal]=mo; render(); } };
  });
  document.querySelectorAll('.rchip[data-reach]').forEach(c=>{
    c.onclick=e=>{ e.stopPropagation(); REACH_KEY=e.currentTarget.dataset.reach; render(); };
  });
}
// Rows that never reach the matrix, counted for the ACTIVE model only — each model reads
// its own excursion pair, and a row the ladder scores fine can be unscoreable for Super
// Mario. Excluded = the inputs that model needs are blank. Invalid = Max Adverse is
// exactly 0, which is never a legitimate reading because Max Adverse is a PRICE; it is
// counted apart from "excluded" so a mislogged row reads as a logging fault, not a gap.
// Ladder rows are never gated on Max Adverse — computeR() does not read it.
function dropCounts(pool){
  // Board-agnostic: a row is EXCLUDED when it scores no outcome at all, and INVALID when a
  // field the scorer depends on is present but impossible. Written against the method keys
  // rather than one board's column names so the same function runs on both.
  // OBVS carries no Max Adverse, so there is no placeholder-zero class of invalid row
  // here. A row is simply EXCLUDED when it scores no outcome — which on this model means
  // one of Entry, anchor, Max Run or Trail Stop is missing.
  let excluded=0;
  pool.forEach(t=>{ if(!MGMT.some(m=>RV(t,m.key)!=null)) excluded++; });
  return {excluded};
}
let MATRIX_OPEN=true, PRIMER_OPEN=false;
let REACH_KEY=null;   // blue line on the reach curve: null = whichever method leads, 'trail' = as traded
// Matrix column sort. null = the board's own ranking (rankRows: expectancy desc, CI lower
// bound as tie-break). Otherwise {key, dir} with dir -1 descending / +1 ascending. First
// click on a column sorts DESCENDING; clicking the active column flips direction and never
// returns to null — the Method header is the only way back to the default order.
// A global, not a class on the header: render() rebuilds the board from scratch on every
// 5s poll, so anything held in the DOM is gone by the next tick.
let MATRIX_SORT=null;

// Replaces the days badge, drop badge, pair-mix card and verdict line — roughly 230px of
// card chrome to show four integers and a sentence. How much evidence exists has to come
// BEFORE any claim, and it has to be one glance.
function evidenceBar(pool, all){
  const days=new Set(pool.map(t=>t.date).filter(Boolean)).size;
  // Pairs are derived from the data, not hardcoded — the same component runs on a board
  // of MNQ/MES/MGC and one of SOL/BTC/ETH. `all` is the unfiltered log, passed in because
  // the two boards hold it under different names.
  const src = all || pool;
  const mix = [...new Set(src.map(t=>t.pair||t.Pair).filter(Boolean))].sort()
    .map(k=>`${k} ${src.filter(t=>(t.pair||t.Pair)===k).length}`).join(' · ');
  const who=[...new Set(src.map(t=>t.trader).filter(Boolean))].sort().map(k=>`${k} ${src.filter(t=>t.trader===k).length}`).join(' · ');
  const drops=dropCounts(pool), dropN=Object.values(drops).reduce((a,b)=>a+b,0);
  const notes=[];
  if(dropN) notes.push(`${dropN} row${dropN>1?'s':''} excluded from scoring`);
  const l1n=pool.filter(t=>t.l1Inferred||t.l1).length;
  if(pool.length) notes.push(`L1 filled on ${l1n} of ${pool.length} (${Math.round(100*l1n/pool.length)}%)`);
  const flagged=pool.filter(t=>t.why), assumed=pool.filter(t=>t.note&&!t.why);
  if(flagged.length) notes.push(`<span class="flag" title="${flagged.map(t=>'#'+(t.n??'?')+' '+t.why).join(' · ').replace(/"/g,'&quot;')}">${flagged.length} row${flagged.length>1?'s':''} need${flagged.length>1?'':'s'} a look: ${flagged.map(t=>'#'+(t.n??'?')).join(', ')}</span>`);
  if(assumed.length) notes.push(`<span title="${assumed.map(t=>'#'+(t.n??'?')+' '+t.note).join(' · ').replace(/"/g,'&quot;')}" style="cursor:help">${assumed.length} scored on the ladder's own logic — hover, or open a day</span>`);
  return `<div class="ebar">
    ${verdictLine(pool)}
    <div class="eb2">${mix}${who?' · by trader: '+who:''}${PAIR==='all'?'':' · filtered to '+PAIR}${CLASS==='all'?'':' · '+CLASS.toUpperCase()}${TRADER==='all'?'':' · '+TRADER}${TF==='all'?'':' · '+TF}${notes.length?' — '+notes.join(' · '):''}</div>
  </div>`;
}

// The three session cards were three cuts of one axis. One table, and per Franklin the
// "best method by session" column is gone entirely — at two trades a cell it was a
// recommendation dressed as a finding. Counts are true at any n; a ranking is not.
function sessionProfile(pool){
  const ss=[...new Set(pool.map(t=>t.session).filter(Boolean))].sort((a,b)=>sessRank(a)-sessRank(b));
  if(!ss.length) return '<div class="empty-note">No session tagged yet.</div>';
  const allDays=new Set(pool.filter(t=>t.date).map(t=>t.date)).size;
  // Win rate and expectancy per session, scored on whatever method currently leads the
  // board — the same key every bucket card uses, so this card can never name a number the
  // matrix has just ranked last. A cell under 5 trades is marked thin; the interval is
  // printed small so a +1.5R on four trades reads as what it is.
  const LD=leaderOf(pool), TK=LD?LD.best.m.key:(MGMT[0]||{}).key, tname=LD?LD.best.m.name:'';
  const perf=sub=>{ const st=fullStats(sub.map(t=>RV(t,TK)).filter(x=>x!=null));
    if(!st.n) return '<td class="spn mut">—</td><td class="spn mut">—</td>';
    const thin=st.n<5;
    return `<td class="spn"><b>${Math.round(st.winRate*100)}%</b> <span class="mini">${st.wins}/${st.scratches}/${st.losses}${thin?' · thin':''}</span></td>
      <td class="spn"><b class="${cls(st.mean)}">${fR(st.mean)}</b> <span class="mini">${st.n<2?'':st.degenerate?'±0':`[${fR(st.lo)}, ${fR(st.hi)}]`}</span></td>`; };
  let rows='';
  ss.forEach(se=>{
    const sub=pool.filter(t=>t.session===se);
    const d=new Set(sub.filter(t=>t.date).map(t=>t.date)).size;
    const rp=sub.filter(t=>t.rangePct!=null).map(t=>t.rangePct);
    const avg = rp.length ? (rp.reduce((a,b)=>a+b,0)/rp.length).toFixed(2)+'%' : '—';
    rows+=`<tr><td><span class="pill">${se}</span></td>
      <td class="spn"><b>${sub.length}</b></td>
      <td class="spn"><b>${d?(sub.length/d).toFixed(1):'0'}</b> <span class="mini">/day</span></td>
      <td class="spn mut">${d}d</td>
      ${perf(sub)}
      <td class="spn"><b>${avg}</b></td></tr>`;
  });
  // Totals. Two different averages, and they answer different questions: how busy a
  // trading day is, and how many of those trades a given session accounts for.
  const perDay = allDays ? (pool.length/allDays).toFixed(1) : '0';
  const perSession = ss.length ? (pool.length/ss.length).toFixed(1) : '0';
  const allRp = pool.filter(t=>t.rangePct!=null).map(t=>t.rangePct);
  const allAvg = allRp.length ? (allRp.reduce((a,b)=>a+b,0)/allRp.length).toFixed(2)+'%' : '—';
  // Per-session sits beside the trade count, not in the range column — it is a count, and
  // a count in a column headed "Avg range %" reads as a percentage.
  rows+=`<tr class="sptot"><td><b>All</b></td>
      <td class="spn"><b>${pool.length}</b> <span class="mini">${perSession}/session</span></td>
      <td class="spn"><b>${perDay}</b> <span class="mini">/day</span></td>
      <td class="spn mut">${allDays}d</td>
      ${perf(pool)}
      <td class="spn"><b>${allAvg}</b></td></tr>`;
  return `<table class="sp"><thead><tr><th>Session</th><th>Trades</th><th>Rate</th><th>Days</th><th>Win</th><th>Expectancy</th><th>Avg range %</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="mnote">Win and expectancy are scored on <b>${tname}</b>, the method leading the board; win column is W/scratch/L, thin = fewer than 5 trades, and the bracket is the 95% interval — at these counts it is wide, and a session with a fat expectancy on four trades is a fact about four trades. Counts and rates are descriptive at any sample size.</div>`;
}

function primerBlock(){
  return `<div class="card prim">
    <div class="primhd" id="primTog"><span>How to read this board</span><span class="mini">${PRIMER_OPEN?'– collapse':'+ expand'}</span></div>
    ${PRIMER_OPEN?`<div class="primbody">
      <p><b>Every row is the same trades read a different way.</b> Every exit rule scored against one log — not ten separate samples. Do not add the n column up.</p>
      <p><b>One ruler.</b> The fib is the ladder: stop at 0, L1 at 0.17, entry at 0.382, swing at 1. You type the stop, the swing, Max Run and your exit; the orders are solved and snapped to the tick, and 1R is the full two-fill risk of those orders on every trade whether or not L1 filled — about 0.552 of the fib, so an entry-only base hit is about +0.43R and an L1 fill closed back at entry about +0.38R. Three exits are scored on the same trades: close it all at 0.618; take half there and run the rest to 1.272 with the stop at entry; or the same run with the stop under the swing low. The exit price settles what each would have paid; the trade as traded is drawn beside them on the reach curve.</p>
      <p><b>Ranked by expectancy</b> — mean R per trade. The 95% interval is printed on every row so you can see how much of a mean rests on one outlier; it no longer decides the order. A wide interval that crosses zero is a lean, not a verdict, and the card above says so.</p>
      <p><b>Worst run and streak sit behind a divider</b> because they depend on the order the trades happened in. Reshuffle the log and they change; expectancy and win% do not. When more than one pair is in view they are computed per pair and the worst pair is shown, named — a streak that alternates instruments is a fact about the day, not about either instrument.</p>
    </div>`:''}
  </div>`;
}

function render(){
  const pool=TRADES, board=document.getElementById('board');
  if(!pool.length){
    const e='<div class="card"><div class="empty-note">No trades match this filter yet — try switching the PAIR toggle, or log trades to '+BOARD.log+'.</div></div>';
    if(e!==_lastBoardHTML){ _lastBoardHTML=e; board.innerHTML=e; }   // cache here too, or
    return;                                                          // empty→data→empty restores a stale string
  }
  _eqSeq=0;     // deterministic ids — see the note on _lastBoardHTML
  const matrixSummary=(()=>{
    const rows=MGMT.map(m=>statsFor(m.key,pool)).filter(x=>x.n);
    const clear=rows.filter(x=>x.lo>0).length;
    return `${MGMT.length} outcomes on the same ${pool.length} trades · ${clear} clear zero`;
  })();
  const html=`
    ${evidenceBar(pool, ALL_TRADES)}
    ${primerBlock()}
    ${winnerCard(pool)}
    <div class="card" style="margin-bottom:12px">
      <div class="primhd" id="matTog"><span>Full numbers — every outcome, ranked</span>
        <span class="mini">${matrixSummary} &nbsp; ${MATRIX_OPEN?'– collapse':'+ expand'}</span></div>
      ${MATRIX_OPEN?matrixTable(pool):''}
    </div>
    <div class="card" style="margin-bottom:12px"><div class="lbl">Session profile</div>${sessionProfile(pool)}</div>
    ${timeCard(pool)}
    <div class="card" style="margin-bottom:12px">
      ${intervalStripSVG(pool)}
      <div style="height:1px;background:#1d2430;margin:14px 0"></div>
      ${reachLadderSVG(pool)}
    </div>
    ${rangeCard(pool)}
    ${CARDS.ema?emaCard(pool):''}
    ${CARDS.anchor?anchorCard(pool):''}
    ${CARDS.minutes?minutesCard(pool):''}
    ${CARDS.emas?emaAlignedCard(pool):''}
    ${dayWinnerCard(pool)}
    <div class="foot" id="foot"></div>`;
  // Nothing changed — leave the DOM alone. Skipping the write also skips the rewiring
  // below, which is correct: the existing nodes and their handlers are still the live ones.
  // Anything that SHOULD redraw (a filter, a sort, a toggle, new trades) changes this
  // string, so it writes.
  if(html===_lastBoardHTML) return;
  _lastBoardHTML=html;
  board.innerHTML=html;
  const f=document.getElementById('foot'); if(f) f.innerHTML = FOOT_OBVS;
  const pt=document.getElementById('primTog'); if(pt) pt.onclick=()=>{PRIMER_OPEN=!PRIMER_OPEN; render();};
  const mt=document.getElementById('matTog'); if(mt) mt.onclick=()=>{MATRIX_OPEN=!MATRIX_OPEN; render();};
  if(MATRIX_OPEN) wireMatrix();
  wireControls();
}

function ym(d){ return d? d.slice(0,7):null; }

function applyModel(){
  MGMTS = MGMTS_OBVS.slice();
  normalizeMethods();
}
// FUTURES / CRYPTO. Changing class changes which pairs exist, so the pair toggle is
// rebuilt and a pair that no longer belongs falls back to ALL — otherwise switching
// class while filtered to MNQ would silently show an empty board.
function wireClassTg(){
  document.querySelectorAll('#classTg button').forEach(b=>{
    b.onclick=()=>{ const v=b.dataset.c; if(v===CLASS) return;
      document.querySelectorAll('#classTg button').forEach(x=>x.classList.toggle('on',x===b));
      CLASS=v; buildPairTg(); buildFacetTgs(); applyFilters(); writeStatus(); render(); };
  });
}
// The pair toggle is built from the log and scoped to the current class, not declared in
// the markup: a new instrument in Notion must reach the toggle without a code change, and
// the futures pairs must not appear while CRYPTO is selected.
function buildPairTg(){
  const el=document.getElementById('pairTg'); if(!el) return;
  const inClass = t => CLASS==='all' || isFutures(t.pair)===(CLASS==='futures');
  const opts=[...new Set(ALL_TRADES.filter(inClass).map(t=>t.pair).filter(Boolean))]
    .sort((a,b)=>{ const fa=isFutures(a), fb=isFutures(b);
                   return fa===fb ? a.localeCompare(b) : (fa?-1:1); });
  // A filter offering one choice is not a filter.
  if(opts.length<2){ el.innerHTML=''; el.style.display='none'; PAIR='all'; return; }
  el.style.display='';
  // Switching class can strip the selected pair out from under the filter — fall back to
  // ALL rather than silently rendering an empty board.
  if(PAIR!=='all' && !opts.includes(PAIR)) PAIR='all';
  const sig=[CLASS,'all',...opts].join('|');
  if(el.dataset.sig===sig){
    el.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.p===PAIR));
    return;
  }
  el.dataset.sig=sig;
  el.innerHTML=['all',...opts].map(o=>
    `<button data-p="${o}"${o===PAIR?' class="on"':''}>${o==='all'?'ALL':o}</button>`).join('');
  el.querySelectorAll('button').forEach(b=>{
    b.onclick=()=>{ const v=b.dataset.p; if(v===PAIR) return;
      el.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
      PAIR=v; applyFilters(); writeStatus(); render(); };
  });
}

// Header count is written from one place. It used to be written only inside poll(), so a
// filter click showed the unfiltered count until the next 5s tick — the number on screen
// disagreed with the board under it.
let LAST_SRC='live';
// ── trader + timeframe facets ────────────────────────────────────────────────
// Built from the data like the pair toggle, canonical order first, and hidden while the log
// offers only one choice — a filter offering one choice is not a filter.
const FACETS=[
  {id:'traderTg', field:'trader',    order:['POTUS','Gonza'], get:()=>TRADER, set:v=>{TRADER=v;}},
  {id:'tfTg',     field:'timeframe', order:['15s','1m'],      get:()=>TF,     set:v=>{TF=v;}},
];
function buildFacetTgs(){
  FACETS.forEach(f=>{
    const el=document.getElementById(f.id); if(!el) return;
    const seen=[...new Set(ALL_TRADES.map(t=>t[f.field]).filter(Boolean))];
    const opts=f.order.filter(o=>seen.includes(o)).concat(seen.filter(o=>!f.order.includes(o)).sort());
    if(opts.length<2){ el.innerHTML=''; el.style.display='none'; f.set('all'); return; }
    el.style.display='';
    if(f.get()!=='all' && !opts.includes(f.get())) f.set('all');
    const sig=['all',...opts].join('|');
    if(el.dataset.sig===sig){ el.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.v===f.get())); return; }
    el.dataset.sig=sig;
    el.innerHTML=['all',...opts].map(o=>`<button data-v="${o}"${o===f.get()?' class="on"':''}>${o==='all'?'ALL':o}</button>`).join('');
    el.querySelectorAll('button').forEach(b=>{
      b.onclick=()=>{ const v=b.dataset.v; if(v===f.get()) return;
        el.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
        f.set(v); applyFilters(); writeStatus(); render(); };
    });
  });
}
function writeStatus(){
  const st=document.getElementById('status'); if(!st) return;
  st.textContent=`${TRADES.length} of ${ALL_TRADES.length} trade${ALL_TRADES.length===1?'':'s'} · ${PAIR.toUpperCase()}${CLASS==='all'?'':' · '+CLASS.toUpperCase()}${TRADER==='all'?'':' · '+TRADER}${TF==='all'?'':' · '+TF} · ${LAST_SRC} · ${new Date().toLocaleTimeString()}`;
}
const WORKER='https://vcl-clarity-scoreboard.potus-eth.workers.dev/?view='+BOARD.view;
let firstLoad=true;
async function fetchTrades(){
  // Dev: ?src=tclv-sample.json renders a local payload, so the board can be checked before
  // the worker's integration is connected to the log.
  const src=new URLSearchParams(location.search).get('src');
  if(src){ const res=await fetch(src+'?t='+Date.now(),{cache:'no-store'}); if(!res.ok) throw new Error('src '+res.status); return {j:await res.json(), src:'file'}; }
  try{
    const res=await fetch(WORKER+'&t='+Date.now(),{cache:'no-store'});
    if(!res.ok) throw new Error('worker '+res.status);
    const j=await res.json();
    if(j.error) throw new Error(j.error);
    return {j, src:'live'};
  }catch(e){
    const res=await fetch(BOARD.view+'-data.json?t='+Date.now(),{cache:'no-store'});
    if(!res.ok) throw new Error('data '+res.status);
    return {j:await res.json(), src:'cached'};
  }
}
// One poll at a time. The worker takes 1.5–5s per answer and the timer fires every 5s,
// so without this a slow answer had the next poll stacking on top of it — two Notion
// round-trips in flight for one board, and a status clock that skipped a beat.
async function poll(){
  if(poll.busy) return;
  poll.busy=true;
  try{ await pollOnce(); } finally{ poll.busy=false; }
}
async function pollOnce(){
  const st=document.getElementById('status');
  try{
    const {j,src}=await fetchTrades();
    const rows=(j&&j.trades)||[];
    ALL_TRADES=rows.map(computeR).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    buildPairTg(); buildFacetTgs();  // may reset a selection whose option vanished — must run before filtering
    applyFilters();
    LAST_SRC=src; writeStatus();
    render();
    firstLoad=false;
  }catch(e){
    if(firstLoad){
      st.innerHTML='<span class="err">Worker unreachable: '+(e.message||'')+'</span>';
      document.getElementById('board').innerHTML='<div class="card"><div class="empty-note">Worker unreachable and no cached snapshot available. Retrying every 5s.</div></div>';
    }
  }
}
wireClassTg();
// A futures-only board has nothing to toggle between — hide the class switch rather
// than show a button that can only ever empty the board.
if(BOARD.futuresOnly){ const b=document.querySelector('[data-c]'); if(b) (b.closest('.tg')||b.parentElement).style.display='none'; }
applyModel();
poll();
setInterval(poll,5000);
</script>
</body></html>
