<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VCL v3 — Craig · 18 Outcomes</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:ui-monospace,'JetBrains Mono',SFMono-Regular,Menlo,monospace;background:#0e1117;color:#e6e8ec;padding:16px;font-size:13px}
.wrap{max-width:1040px;margin:0 auto}
.hd{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.hd h1{font-size:18px;font-weight:700;letter-spacing:.5px}
.hd .sub{font-size:11px;color:#8b93a1}
.tg{display:inline-flex;border:1px solid #2a3140;border-radius:6px;overflow:hidden}
.tg button{border:0;background:#161b24;padding:5px 11px;font:inherit;font-size:11px;cursor:pointer;color:#c3c9d4;border-left:1px solid #2a3140}
.tg button:first-child{border-left:0}
.tg button.on{background:#3b82f6;color:#fff}
.card{background:#161b24;border:1px solid #232a36;border-radius:12px;padding:16px}
.top{border:2px solid #3b82f6;margin-bottom:12px}
.top .crown{font-size:11px;letter-spacing:1.5px;color:#e0b341;text-transform:uppercase;margin-bottom:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.matrix{width:100%;border-collapse:collapse;font-size:12px}
.matrix th,.matrix td{padding:7px 9px;text-align:right;border-bottom:1px solid #232a36}
.matrix th{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:#7b8494;font-weight:600}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.matrix td:nth-child(2),.matrix th:nth-child(2){text-align:left}
.matrix tr.best td{background:#182335}
.lbl{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:#8b93a1;margin-bottom:6px}
.combo-md{font-size:16px;font-weight:700;margin-bottom:8px}
.stats{display:flex;flex-wrap:wrap;gap:12px 18px}
.stat .k{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:#6b7280}
.stat .v{font-size:16px;font-weight:700}
.pos{color:#4ade80}.neg{color:#f87171}.mut{color:#6b7280}
.rowline{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-top:1px solid #232a36;font-size:12px}
.rowline:first-of-type{border-top:0}
.pill{font-size:10px;padding:1px 7px;border-radius:999px;background:#1e2938;color:#9dc0f6;font-weight:600}
.mini{font-size:11px;color:#8b93a1}
.empty-note{color:#6b7280;font-size:12px;padding:6px 0}
.err{color:#f87171;font-size:12px}
.foot{font-size:10px;color:#6b7280;margin-top:14px;line-height:1.6}
.tf{display:flex;gap:6px}
.matrix td.oc{color:#9aa3b2;width:38px}
.tag{font-size:9px;padding:1px 6px;border-radius:4px;background:#1b2130;color:#8b93a1;letter-spacing:.5px}
.bar{height:6px;border-radius:3px;background:#1b2130;overflow:hidden;margin-top:3px}
.bar>i{display:block;height:100%;border-radius:3px}
.cmp{display:grid;grid-template-columns:132px repeat(3,1fr);gap:6px;align-items:center}
.cmp .h{font-size:10px;color:#8b93a1;letter-spacing:1px;text-transform:uppercase}
.cmpgrp{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:#7b8494;margin:12px 0 4px;padding-top:8px;border-top:1px solid #232a36}
.cmpgrp:first-of-type{border-top:0;padding-top:0;margin-top:8px}
.cell{background:#141a24;border:1px solid #1f2735;border-radius:6px;padding:7px 9px}
.cell .v{font-size:15px;font-weight:700}
.cell .k{font-size:9px;color:#6b7280}
.cell.win{border-color:#2d5a3d;background:#131f18}
.na{color:#3d4553}
.seg{display:flex;height:8px;border-radius:4px;overflow:hidden;background:#1b2130;margin:5px 0 3px}
.seg>i{display:block;height:100%}
</style></head><body>
<div class="wrap">
  <div class="hd">
    <div><h1>VCL v3 — CRAIG</h1><div class="sub">Eighteen managements off one entry · R read live from the Notion outcome formulas</div></div>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="tg" id="assetTg"><button data-a="all" class="on">ALL</button><button data-a="eth">ETH</button><button data-a="sol">SOL</button><button data-a="btc">BTC</button></div>
      <div class="tg tf" id="tfTg"><button data-t="all" class="on">ALL TF</button><button data-t="1m">1m</button><button data-t="15s">15s</button></div>
      <div class="mini" id="status">loading…</div>
    </div>
  </div>
  <div id="board"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
// 18 = stop management (be / evs / pvs) x target (1.618 / 2.272) x fill (solo / lad / sc)
const OUT=[
 {k:'O1', mg:'be', tgt:'1.618', fill:'solo'},
 {k:'O2', mg:'be', tgt:'1.618', fill:'lad' },
 {k:'O3', mg:'be', tgt:'1.618', fill:'sc'  },
 {k:'O4', mg:'be', tgt:'2.272', fill:'solo'},
 {k:'O5', mg:'be', tgt:'2.272', fill:'lad' },
 {k:'O6', mg:'be', tgt:'2.272', fill:'sc'  },
 {k:'O7', mg:'evs',tgt:'1.618', fill:'solo'},
 {k:'O8', mg:'evs',tgt:'1.618', fill:'lad' },
 {k:'O9', mg:'evs',tgt:'1.618', fill:'sc'  },
 {k:'O10',mg:'evs',tgt:'2.272', fill:'solo'},
 {k:'O11',mg:'evs',tgt:'2.272', fill:'lad' },
 {k:'O12',mg:'evs',tgt:'2.272', fill:'sc'  },
 {k:'O13',mg:'pvs',tgt:'1.618', fill:'solo'},
 {k:'O14',mg:'pvs',tgt:'1.618', fill:'lad' },
 {k:'O15',mg:'pvs',tgt:'1.618', fill:'sc'  },
 {k:'O16',mg:'pvs',tgt:'2.272', fill:'solo'},
 {k:'O17',mg:'pvs',tgt:'2.272', fill:'lad' },
 {k:'O18',mg:'pvs',tgt:'2.272', fill:'sc'  },
];
const FILL={solo:'Entry only', lad:'Entry + L1', sc:'50% off'};
const FILLS=['solo','lad','sc'];
const MG  ={be:'Break-even at the anchor', evs:'Entry-VWAP trail', pvs:'Position-VWAP trail'};
const MGS =['be','evs','pvs'];
const MGSHORT={be:'BE', evs:'EVS', pvs:'PVS'};
const TGTS=['1.618','2.272'];
const name=o=>`${MGSHORT[o.mg]} · ${o.tgt} · ${FILL[o.fill]}`;
// which outcome keys belong to each management, in order
const MGKEYS={be:['O1','O2','O3','O4','O5','O6'],
              evs:['O7','O8','O9','O10','O11','O12'],
              pvs:['O13','O14','O15','O16','O17','O18']};

let TRADES=[], ALL=[], ASSET='all', TF='all', firstLoad=true;

const num=x=>(x===null||x===undefined||x==='')?null:Number(x);
const fR=x=>{const v=Math.abs(x)<0.005?0:x; return (v>=0?'+':'')+v.toFixed(2)+'R';};
const fDD=d=>d<0.005?'0.00R':'-'+d.toFixed(2)+'R';
const cls=x=>x>0?'pos':(x<0?'neg':'mut');
function stats(s){const n=s.length; if(!n) return {n:0};
  const w=s.filter(r=>r>0).length, t=s.reduce((a,b)=>a+b,0);
  return {n, wins:w, wr:w/n, exp:t/n, total:t};}
function maxDD(s){let c=0,p=0,m=0; for(const r of s){c+=r; if(c>p)p=c; const d=p-c; if(d>m)m=d;} return m;}
const ser=(k,pool)=>pool.map(t=>num(t.o&&t.o[k])).filter(x=>x!=null);
const stat=(k,pool)=>{const s=ser(k,pool), o=stats(s); o.dd=maxDD(s); return o;};

function applyFilters(){
  TRADES = ALL.filter(t =>
    (ASSET==='all' || String(t.Pair||'').toLowerCase()===ASSET) &&
    (TF==='all'    || t.Timeframe===TF));
}
const MIN_N=5;
function bestOf(list){const v=list.filter(x=>x.s.n>0); if(!v.length) return null;
  return v.slice().sort((a,b)=>b.s.exp-a.s.exp)[0];}
// prefer an outcome with a real sample; fall back to thin only if nothing qualifies
function bestSolid(list){
  const solid=list.filter(x=>x.s.n>=MIN_N);
  if(solid.length) return {pick:bestOf(solid), fellBack:false, skipped:bestOf(list)};
  return {pick:bestOf(list), fellBack:true, skipped:null};}

function matrix(pool){
  const rows=OUT.map(o=>({o, s:stat(o.k,pool)}));
  rows.sort((a,b)=>((a.s.n?0:1)-(b.s.n?0:1)) || ((b.s.exp||-999)-(a.s.exp||-999)));
  const top=Math.max(...rows.map(r=>r.s.n?Math.abs(r.s.exp):0),0.01);
  const N=pool.length||1;
  let h='';
  rows.forEach((r,i)=>{const s=r.s, thin=s.n>0&&s.n<MIN_N;
    const best=s.n>=MIN_N && !rows.slice(0,i).some(x=>x.s.n>=MIN_N);
    const w=s.n?Math.min(100,Math.abs(s.exp)/top*100):0;
    h+=`<tr class="${best?'best':''}" style="${thin?'opacity:.5':''}"><td class="oc">${r.o.k}</td>`+
       `<td><span class="tag">${MGSHORT[r.o.mg]}</span> ${r.o.tgt} · ${FILL[r.o.fill]}`+
       (thin?` <span class="mini" style="color:#e0b341">thin</span>`:'')+
       ` <span class="mini">${Math.round(s.n/N*100)}% cov</span>`+
       (s.n?`<div class="bar"><i style="width:${w}%;background:${s.exp>=0?'#3fb950':'#f85149'}"></i></div>`:'')+
       `</td><td class="${s.n?cls(s.exp):'na'}">${s.n?fR(s.exp):'—'}</td>`+
       `<td>${s.n?Math.round(s.wr*100)+'%':'<span class="na">—</span>'}</td>`+
       `<td class="${s.n?cls(s.total):'na'}">${s.n?fR(s.total):'—'}</td>`+
       `<td class="${s.n?'neg':'na'}">${s.n?fDD(s.dd):'—'}</td>`+
       `<td class="mut">${s.n||'—'}</td></tr>`;});
  return `<table class="matrix"><thead><tr><th></th><th>Stop · target · fill</th><th>Exp</th><th>Win%</th><th>Total</th><th>Max DD</th><th>n</th></tr></thead><tbody>${h}</tbody></table>`;
}

// 6 management x target rows, 3 fill columns — every one of the 18 has a cell
function compare(pool){
  let h='';
  MGS.forEach(m=>{
    h+=`<div class="cmpgrp">${MG[m]}</div>`;
    h+=`<div class="cmp"><div></div>`+FILLS.map(f=>`<div class="h">${FILL[f]}</div>`).join('')+`</div>`;
    TGTS.forEach(tg=>{
      // highlight the strongest cell in this row that clears MIN_N
      const cells=FILLS.map(f=>{const o=OUT.find(x=>x.mg===m&&x.tgt===tg&&x.fill===f); return {o,s:stat(o.k,pool)};});
      const solid=cells.filter(c=>c.s.n>=MIN_N);
      const win=solid.length?solid.slice().sort((a,b)=>b.s.exp-a.s.exp)[0]:null;
      h+=`<div class="cmp" style="margin-top:6px"><div class="h">→ ${tg}</div>`;
      cells.forEach(c=>{
        const st=c.s, thin=st.n>0&&st.n<MIN_N?' <span style="color:#e0b341">thin</span>':'';
        h+=`<div class="cell${win&&win.o.k===c.o.k?' win':''}"><div class="v ${st.n?cls(st.exp):'na'}">${st.n?fR(st.exp):'—'}</div>`+
           `<div class="k">${c.o.k} · ${st.n?Math.round(st.wr*100)+'% · n'+st.n+thin:'no data'}</div></div>`;});
      h+=`</div>`;});});
  return h;
}

function bestBy(pool, groups){
  let h='';
  groups.forEach(([lbl,keys])=>{
    const sub=OUT.filter(o=>keys.includes(o.k)).map(o=>({o,s:stat(o.k,pool)}));
    const r=bestSolid(sub), b=r.pick;
    h+=`<div class="rowline"><span><span class="pill">${lbl}</span> ${b?b.o.k+' · '+name(b.o):'—'}</span>`+
       `<span class="${b?cls(b.s.exp):'mut'}">${b?fR(b.s.exp)+' <span class="mini">n'+b.s.n+(r.fellBack&&b.s.n<MIN_N?' thin':'')+'</span>':'—'}</span></div>`;});
  return h;
}
const byMg  = pool=>bestBy(pool, MGS.map(m=>[MGSHORT[m], MGKEYS[m]]));
const byFill= pool=>bestBy(pool, FILLS.map(f=>[FILL[f], OUT.filter(o=>o.fill===f).map(o=>o.k)]));
const byTgt = pool=>bestBy(pool, TGTS.map(t=>['→ '+t, OUT.filter(o=>o.tgt===t).map(o=>o.k)]));

function sessions(pool){
  const ses=[...new Set(pool.map(t=>t.Session).filter(Boolean))];
  if(!ses.length) return '<div class="empty-note">No Session tagged yet.</div>';
  const order=['Asia','London','NY AM','NY PM'];
  ses.sort((a,b)=>order.indexOf(a)-order.indexOf(b));
  let h='';
  ses.forEach(se=>{const sub=pool.filter(t=>t.Session===se);
    const b=bestOf(OUT.map(o=>({o,s:stat(o.k,sub)})));
    h+=`<div class="rowline"><span><span class="pill">${se}</span> ${b?b.o.k+' · '+name(b.o):'—'}</span>`+
       `<span class="${b?cls(b.s.exp):'mut'}">${b?fR(b.s.exp)+' <span class="mini">n'+b.s.n+'</span>':'—'}</span></div>`;});
  return h;
}
function fillMix(pool){
  const c={solo:0,lad:0};
  pool.forEach(t=>{ if(t.L1Filled) c.lad++; else c.solo++; });
  const tot=c.solo+c.lad||1;
  return `<div class="rowline"><span>Entry only</span><span><b>${c.solo}</b> <span class="mini">${Math.round(c.solo/tot*100)}%</span></span></div>`+
         `<div class="rowline"><span>Entry + L1 filled</span><span><b>${c.lad}</b> <span class="mini">${Math.round(c.lad/tot*100)}%</span></span></div>`+
         `<div class="mini" style="margin-top:6px">The 50%-off outcomes need both fills, so they score the same rows as Entry + L1.</div>`;
}

// How far each trail actually got, on the rows where that trail was logged.
// A trail firing short of the target is NOT automatically a loss — a BoS stop
// can fire well in profit — so each bucket carries its own mean R.
function trailReach(pool){
  const defs=[['Entry-VWAP trail','evsHit1','evsHit2', MGKEYS.evs],
              ['Position-VWAP trail','pvsHit1','pvsHit2', MGKEYS.pvs]];
  // what that trail actually paid on this trade, scored to 2.272 at its own fill
  const paid=(t,keys)=>num(t.o&&t.o[keys[t.L1Filled?4:3]]);
  const meanR=g=>{const v=g.map(x=>x.r).filter(x=>x!=null); return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;};
  let h='';
  defs.forEach(([lbl,h1,h2,keys])=>{
    const logged=pool.filter(t=>t.o&&keys.some(k=>num(t.o[k])!=null))
                     .map(t=>({t, r:paid(t,keys)}));
    const n=logged.length;
    if(!n){ h+=`<div class="rowline"><span>${lbl}</span><span class="mut">not logged yet</span></div>`; return; }
    const far=logged.filter(x=>x.t[h2]);
    const mid=logged.filter(x=>!x.t[h2]&&x.t[h1]);
    const early=logged.filter(x=>!x.t[h2]&&!x.t[h1]);
    const p=g=>Math.round(g.length/n*100);
    const leg=(g,c,txt)=>{const m=meanR(g);
      return `<div style="display:flex;justify-content:space-between;gap:8px">`+
             `<span><span style="color:${c}">■</span> ${txt}</span>`+
             `<span><b>${g.length}</b> <span class="${m==null?'mut':cls(m)}">${m==null?'—':'avg '+fR(m)}</span></span></div>`;};
    h+=`<div class="rowline" style="display:block">`+
       `<div style="display:flex;justify-content:space-between"><span>${lbl}</span><span class="mini">n${n}</span></div>`+
       `<div class="seg"><i style="width:${p(far)}%;background:#3fb950"></i>`+
       `<i style="width:${p(mid)}%;background:#2d7dd2"></i>`+
       `<i style="width:${p(early)}%;background:#c9a227"></i></div>`+
       `<div class="mini">`+
         leg(far,'#3fb950','ran all the way to 2.272')+
         leg(mid,'#2d7dd2','stopped between 1.618 and 2.272')+
         leg(early,'#c9a227','stopped before 1.618')+
       `</div></div>`;});
  h+=`<div class="mini" style="margin-top:6px">This is the question the trails exist to answer: how often letting it run got paid. Stopping short is not a loss — the average R on each bucket says what it was actually worth. Scored to 2.272 at each trade&rsquo;s own fill.</div>`;
  return h;
}

function coverage(pool){
  const n=pool.length||1;
  const rows=[['Break-even at the anchor — needs 1.618 + 2.272 price and Max Run', MGKEYS.be],
              ['Entry-VWAP trail — needs an EVS hit tick or an EVS Price',        MGKEYS.evs],
              ['Position-VWAP trail — needs a PVS hit tick or a PVS Price',       MGKEYS.pvs]];
  let h='';
  rows.forEach(([lbl,keys])=>{
    const c=pool.filter(t=>t.o&&keys.some(k=>num(t.o[k])!=null)).length;
    const pct=Math.round(c/n*100), low=pct<50;
    h+=`<div class="rowline"><span>${low?'<span style="color:#e0b341">⚠ </span>':''}${lbl}</span>`+
       `<span><b class="${low?'neg':''}">${c}/${pool.length}</b> <span class="mini">${pct}%</span></span></div>`;});
  h+=`<div class="mini" style="margin-top:6px">An outcome can only score a trade whose inputs are filled in. Low coverage means that management is being judged on a fraction of the sample — not that it performed badly.</div>`;
  return h;
}

function render(){
  const pool=TRADES, board=document.getElementById('board');
  document.getElementById('foot').innerHTML =
    'Each trade is scored under all eighteen managements at once; only those matching its fill type and logged inputs carry a value, the rest are blank and excluded from every average. '+
    'R comes straight from the Notion outcome formulas — this board aggregates, it does not recompute. '+
    'Max DD is the worst peak-to-trough in cumulative R for that outcome alone. An outcome is only crowned once it has n'+MIN_N+'.';
  if(!pool.length){ board.innerHTML='<div class="card"><div class="empty-note">No trades match this filter yet.</div></div>'; return; }
  const cards=OUT.map(o=>({o,s:stat(o.k,pool)}));
  const bres=bestSolid(cards), best=bres.pick, bs=best?best.s:{n:0};
  const outranked = (!bres.fellBack && bres.skipped && best && bres.skipped.o.k!==best.o.k && bres.skipped.s.exp>bs.exp)
    ? bres.skipped : null;
  board.innerHTML=`
    <div class="grid2">
      <div><div class="card top"><div class="crown">🏆 Best outcome</div>
        <div class="combo-md">${best?best.o.k+' · '+name(best.o):'—'}</div>
        <div class="mini" style="margin-bottom:6px">${best?MG[best.o.mg]+' · target '+best.o.tgt:''}${bres.fellBack&&bs.n<MIN_N?' <span style="color:#e0b341">· thin sample, n'+bs.n+' — nothing has reached n'+MIN_N+' yet</span>':''}</div>
        ${outranked?`<div class="mini" style="color:#e0b341;margin-bottom:6px">${outranked.o.k} shows a higher ${fR(outranked.s.exp)} but only n${outranked.s.n} — ignored as too thin to rank.</div>`:''}
        <div class="stats">
          <div class="stat"><div class="k">Expectancy</div><div class="v ${bs.n?cls(bs.exp):'mut'}">${bs.n?fR(bs.exp):'—'}</div></div>
          <div class="stat"><div class="k">Win rate</div><div class="v">${bs.n?Math.round(bs.wr*100)+'%':'—'}</div></div>
          <div class="stat"><div class="k">Total R</div><div class="v ${bs.n?cls(bs.total):'mut'}">${bs.n?fR(bs.total):'—'}</div></div>
          <div class="stat"><div class="k">Max DD</div><div class="v neg">${bs.n?fDD(bs.dd):'—'}</div></div>
        </div></div>
        <div class="card" style="margin-bottom:12px"><div class="lbl">Best per stop management</div>${byMg(pool)}</div>
        <div class="card" style="margin-bottom:12px"><div class="lbl">Best per target</div>${byTgt(pool)}</div>
        <div class="card" style="margin-bottom:12px"><div class="lbl">Best per fill type</div>${byFill(pool)}</div>
        <div class="card"><div class="lbl">How the fills actually landed</div>${fillMix(pool)}</div></div>
      <div><div class="card" style="margin-bottom:12px"><div class="lbl">How far the trails ran</div>${trailReach(pool)}</div>
        <div class="card"><div class="lbl">Input coverage — what each management can actually score</div>${coverage(pool)}</div></div>
    </div>
    <div class="card" style="margin-bottom:12px"><div class="lbl">Stop × target × fill — expectancy</div>
      ${compare(pool)}
      <div class="mini" style="margin-top:10px">Read across a row for what the ladder is worth, down a block for whether the further target pays, and between blocks for which stop wins. The outlined cell is the strongest in that row with at least n${MIN_N}.</div>
    </div>
    <div class="card" style="margin-bottom:12px"><div class="lbl">All eighteen, ranked by expectancy</div>
      <div style="margin-top:8px">${matrix(pool)}</div>
    </div>
    <div class="card"><div class="lbl">Best outcome by session</div>${sessions(pool)}</div>`;
}

const WORKER='https://vcl-clarity-scoreboard.potus-eth.workers.dev/?view=v3-craig';
async function poll(){
  const st=document.getElementById('status');
  try{
    const res=await fetch(WORKER+'&t='+Date.now(),{cache:'no-store'});
    if(!res.ok) throw new Error('worker '+res.status);
    const j=await res.json();
    ALL=(j&&j.trades)||[];
    applyFilters(); render();
    st.textContent=`${ASSET.toUpperCase()} · ${TF.toUpperCase()} · ${TRADES.length} trade${TRADES.length===1?'':'s'} · ${new Date().toLocaleTimeString()}`;
    firstLoad=false;
  }catch(e){
    if(firstLoad){ st.innerHTML='<span class="err">Connecting… '+(e.message||'')+'</span>';
      document.getElementById('board').innerHTML='<div class="card"><div class="empty-note">Waiting on the live Worker.</div></div>'; }
  }
}
function wire(id,attr,set){
  document.querySelectorAll('#'+id+' button').forEach(b=>{
    b.onclick=()=>{ const v=b.dataset[attr]; if(v===set()) return;
      document.querySelectorAll('#'+id+' button').forEach(x=>x.classList.toggle('on',x===b));
      set(v); applyFilters(); render();
      document.getElementById('status').textContent=
        `${ASSET.toUpperCase()} · ${TF.toUpperCase()} · ${TRADES.length} trade${TRADES.length===1?'':'s'} · switched`; };});
}
wire('assetTg','a',v=>{ if(v===undefined) return ASSET; ASSET=v; });
wire('tfTg','t',  v=>{ if(v===undefined) return TF;    TF=v;    });
poll(); setInterval(poll,5000);
</script>
</body></html>
