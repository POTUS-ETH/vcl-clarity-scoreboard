<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VCL v3 — Craig · 12 Outcomes</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:ui-monospace,'JetBrains Mono',SFMono-Regular,Menlo,monospace;background:#0e1117;color:#e6e8ec;padding:16px;font-size:13px}
.wrap{max-width:980px;margin:0 auto}
.hd{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.hd h1{font-size:18px;font-weight:700;letter-spacing:.5px}
.hd .sub{font-size:11px;color:#8b93a1}
.tg{display:inline-flex;border:1px solid #2a3140;border-radius:6px;overflow:hidden}
.tg button{border:0;background:#161b24;padding:5px 11px;font:inherit;font-size:11px;cursor:pointer;color:#c3c9d4;border-left:1px solid #2a3140}
.tg button:first-child{border-left:0}
.tg button.on{background:#3b82f6;color:#fff}
.card{background:#161b24;border:1px solid #232a36;border-radius:12px;padding:16px}
.top{border:2px solid #3b82f6;margin-bottom:12px}
.top .crown{font-size:11px;letter-spacing:1.5px;color:#e0b341;text-transform:uppercase;margin-bottom:6px}
.top .combo{font-size:26px;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px}
.daysbadge-row{display:flex;justify-content:center;margin-bottom:10px}
.daysbadge{display:inline-flex;align-items:baseline;gap:8px;padding:6px 16px;border-color:#3b82f6}
.daysbadge .midval{font-size:16px;font-weight:700}
.matrix{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:16px}
.matrix th,.matrix td{padding:7px 9px;text-align:right;border-bottom:1px solid #232a36}
.matrix th{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:#7b8494;font-weight:600}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.matrix tr.best td{background:#182335}
.lbl{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:#8b93a1;margin-bottom:6px}
.combo-md{font-size:16px;font-weight:700;margin-bottom:8px}
.stats{display:flex;flex-wrap:wrap;gap:12px 18px}
.stat .k{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:#6b7280}
.stat .v{font-size:16px;font-weight:700}
.pos{color:#4ade80}.neg{color:#f87171}.mut{color:#6b7280}
.rowline{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-top:1px solid #232a36;font-size:12px}
.rowline:first-of-type{border-top:0}
.pill{font-size:10px;padding:1px 7px;border-radius:999px;background:#1e2938;color:#9dc0f6;font-weight:600}
.mini{font-size:11px;color:#8b93a1}
.cal{margin-top:4px}
.calfilters{display:flex;flex-direction:column;gap:7px;margin:8px 0 14px}
.cf{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.cflbl{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:#8b93a1;width:74px;flex:none}
.calsel{background:#161b24;color:#e6e8ec;border:1px solid #2a3140;border-radius:6px;padding:4px 9px;font:inherit;font-size:11px;cursor:pointer}
.cal .calhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal .calhd button{border:1px solid #2a3140;background:#161b24;color:#e6e8ec;border-radius:6px;padding:3px 9px;cursor:pointer;font:inherit;font-size:12px}
.cal .month{font-size:13px;font-weight:700}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.dow div{font-size:9px;color:#6b7280;text-align:center;letter-spacing:.5px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{aspect-ratio:1/.82;border:1px solid #202634;border-radius:7px;padding:4px 5px;display:flex;flex-direction:column;justify-content:space-between;background:#12161e}
.day.empty{background:transparent;border:0}
.day .dn{font-size:9px;color:#6b7280}
.day .dr{font-size:12px;font-weight:700}
.day .dc{font-size:8px;color:#6b7280}
.day.win{background:#122019;border-color:#1f4d33}
.day.loss{background:#221414;border-color:#5a2626}
.empty-note{color:#6b7280;font-size:12px;padding:6px 0}
.err{color:#f87171;font-size:12px}
.foot{font-size:10px;color:#6b7280;margin-top:14px;line-height:1.6}

.tf{display:flex;gap:6px}
.grp{margin:14px 0 6px;font-size:10px;letter-spacing:1.4px;color:#8b93a1;text-transform:uppercase}
.matrix td.oc{color:#9aa3b2;width:34px}
.bar{height:6px;border-radius:3px;background:#1b2130;overflow:hidden;margin-top:3px}
.bar>i{display:block;height:100%;border-radius:3px}
.cmp{display:grid;grid-template-columns:120px repeat(3,1fr);gap:6px;align-items:center}
.cmp .h{font-size:10px;color:#8b93a1;letter-spacing:1px;text-transform:uppercase}
.cell{background:#141a24;border:1px solid #1f2735;border-radius:6px;padding:7px 9px}
.cell .v{font-size:15px;font-weight:700}
.cell .k{font-size:9px;color:#6b7280}
.na{color:#3d4553}
</style></head><body>
<div class="wrap">
  <div class="hd">
    <div><h1>VCL v3 — CRAIG</h1><div class="sub">Twelve managements off one entry · R read live from the Notion outcome formulas</div></div>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="tg" id="assetTg"><button data-a="all" class="on">ALL</button><button data-a="eth">ETH</button><button data-a="sol">SOL</button><button data-a="btc">BTC</button></div>
      <div class="tg tf" id="tfTg"><button data-t="all" class="on">ALL TF</button><button data-t="1m">1m</button><button data-t="15s">15s</button></div>
      <div class="mini" id="status">loading…</div>
    </div>
  </div>
  <div id="board"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
const OUT=[
 {k:'O1', n:'Entry → 1.618',    fill:'solo', mg:'target', tgt:'1.618'},
 {k:'O2', n:'Entry → 2.272',    fill:'solo', mg:'target', tgt:'2.272'},
 {k:'O3', n:'Entry+L1 → 1.618', fill:'lad',  mg:'target', tgt:'1.618'},
 {k:'O4', n:'Entry+L1 → 2.272', fill:'lad',  mg:'target', tgt:'2.272'},
 {k:'O5', n:'Entry → EVS',      fill:'solo', mg:'evs',    tgt:'EVS'},
 {k:'O6', n:'Entry+L1 → EVS',   fill:'lad',  mg:'evs',    tgt:'EVS'},
 {k:'O7', n:'Entry → PVS',      fill:'solo', mg:'pvs',    tgt:'PVS'},
 {k:'O8', n:'Entry+L1 → PVS',   fill:'lad',  mg:'pvs',    tgt:'PVS'},
 {k:'O9', n:'50% → 1.618',      fill:'sc',   mg:'target', tgt:'1.618'},
 {k:'O10',n:'50% → 2.272',      fill:'sc',   mg:'target', tgt:'2.272'},
 {k:'O11',n:'50% → EVS',        fill:'sc',   mg:'evs',    tgt:'EVS'},
 {k:'O12',n:'50% → PVS',        fill:'sc',   mg:'pvs',    tgt:'PVS'},
];
const FILL={solo:'Entry only', lad:'Entry + L1', sc:'50% off at entry'};
const MG  ={target:'Fixed target', evs:'Entry-VWAP stop', pvs:'Position-VWAP stop'};
let TRADES=[], ALL=[], ASSET='all', TF='all', firstLoad=true;
let CAL_OC='best', CAL_SESS='all', CAL_MONTH=null, calDefaulted=false;

const num=x=>(x===null||x===undefined||x==='')?null:Number(x);
const fR=x=>{const v=Math.abs(x)<0.005?0:x; return (v>=0?'+':'')+v.toFixed(2)+'R';};
const fDD=d=>d<0.005?'0.00R':'-'+d.toFixed(2)+'R';
const cls=x=>x>0?'pos':(x<0?'neg':'mut');
function stats(s){const n=s.length; if(!n) return {n:0};
  const w=s.filter(r=>r>0).length, t=s.reduce((a,b)=>a+b,0);
  return {n, wins:w, wr:w/n, exp:t/n, total:t};}
function maxDD(s){let c=0,p=0,m=0; for(const r of s){c+=r; if(c>p)p=c; const d=p-c; if(d>m)m=d;} return m;}
function lossStreak(s){let run=0,len=0,worst=0,wl=0;
  for(const r of s){ if(r<0){run+=r;len++; if(run<worst){worst=run;wl=len;}} else {run=0;len=0;} }
  return {dd:Math.abs(worst), len:wl};}
const ser=(k,pool)=>pool.map(t=>num(t.o&&t.o[k])).filter(x=>x!=null);
const stat=(k,pool)=>{const s=stats(ser(k,pool)); s.dd=maxDD(ser(k,pool)); s.ls=lossStreak(ser(k,pool)); return s;};

function applyFilters(){
  TRADES = ALL.filter(t =>
    (ASSET==='all' || String(t.Pair||'').toLowerCase()===ASSET) &&
    (TF==='all'    || t.Timeframe===TF));
}
function bestOf(list){const v=list.filter(x=>x.s.n>0); if(!v.length) return null;
  return v.sort((a,b)=>b.s.exp-a.s.exp)[0];}

function matrix(pool){
  const rows=OUT.map(o=>({o, s:stat(o.k,pool)}));
  rows.sort((a,b)=>((a.s.n?0:1)-(b.s.n?0:1)) || ((b.s.exp||-999)-(a.s.exp||-999)));
  const top=Math.max(...rows.map(r=>r.s.n?Math.abs(r.s.exp):0),0.01);
  let h='';
  rows.forEach((r,i)=>{const s=r.s, best=i===0&&s.n>0;
    const w=s.n?Math.min(100,Math.abs(s.exp)/top*100):0;
    h+=`<tr class="${best?'best':''}"><td class="oc">${r.o.k}</td><td>${r.o.n}`+
       (s.n?`<div class="bar"><i style="width:${w}%;background:${s.exp>=0?'#3fb950':'#f85149'}"></i></div>`:'')+
       `</td><td class="${s.n?cls(s.exp):'na'}">${s.n?fR(s.exp):'—'}</td>`+
       `<td>${s.n?Math.round(s.wr*100)+'%':'<span class="na">—</span>'}</td>`+
       `<td class="${s.n?cls(s.total):'na'}">${s.n?fR(s.total):'—'}</td>`+
       `<td class="${s.n?'neg':'na'}">${s.n?fDD(s.dd):'—'}</td>`+
       `<td class="mut">${s.n||'—'}</td></tr>`;});
  return `<table class="matrix"><thead><tr><th></th><th>Outcome</th><th>Exp</th><th>Win%</th><th>Total</th><th>Max DD</th><th>n</th></tr></thead><tbody>${h}</tbody></table>`;
}
function compare(pool){
  const rows=[['target','1.618','→ 1.618'],['target','2.272','→ 2.272'],
              ['evs',null,'Entry-VWAP stop'],['pvs',null,'Position-VWAP stop']];
  const fills=['solo','lad','sc'];
  let h=`<div class="cmp"><div></div>`+fills.map(f=>`<div class="h">${FILL[f]}</div>`).join('')+`</div>`;
  rows.forEach(([m,tg,label])=>{
    h+=`<div class="cmp" style="margin-top:6px"><div class="h">${label}</div>`;
    fills.forEach(f=>{
      const o=OUT.find(x=>x.mg===m&&x.fill===f&&(tg===null||x.tgt===tg));
      if(!o){h+=`<div class="cell"><div class="v na">—</div><div class="k">n/a</div></div>`; return;}
      const st=stat(o.k,pool);
      const thin=st.n>0&&st.n<5?' <span style="color:#e0b341">thin</span>':'';
      h+=`<div class="cell"><div class="v ${st.n?cls(st.exp):'na'}">${st.n?fR(st.exp):'—'}</div>`+
         `<div class="k">${o.k} · ${st.n?Math.round(st.wr*100)+'% · n'+st.n+thin:'no data'}</div></div>`;});
    h+=`</div>`;});
  return h;
}
function byFill(pool){
  let h='';
  ['solo','lad','sc'].forEach(f=>{
    const sub=OUT.filter(o=>o.fill===f).map(o=>({o,s:stat(o.k,pool)}));
    const b=bestOf(sub);
    h+=`<div class="rowline"><span><span class="pill">${FILL[f]}</span> ${b?b.o.k+' · '+b.o.n:'—'}</span>`+
       `<span class="${b?cls(b.s.exp):'mut'}">${b?fR(b.s.exp):'—'}</span></div>`;});
  return h;
}
function sessions(pool){
  const ses=[...new Set(pool.map(t=>t.Session).filter(Boolean))];
  if(!ses.length) return '<div class="empty-note">No Session tagged yet.</div>';
  const order=['Asia','London','NY AM','NY PM'];
  ses.sort((a,b)=>order.indexOf(a)-order.indexOf(b));
  let h='';
  ses.forEach(se=>{const sub=pool.filter(t=>t.Session===se);
    const b=bestOf(OUT.map(o=>({o,s:stat(o.k,sub)})));
    h+=`<div class="rowline"><span><span class="pill">${se}</span> ${b?b.o.k+' · '+b.o.n:'—'}</span>`+
       `<span class="${b?cls(b.s.exp):'mut'}">${b?fR(b.s.exp)+' <span class="mini">n'+b.s.n+'</span>':'—'}</span></div>`;});
  return h;
}
function fillMix(pool){
  const c={solo:0,lad:0};
  pool.forEach(t=>{ if(t.L1Filled) c.lad++; else c.solo++; });
  const tot=c.solo+c.lad||1;
  return `<div class="rowline"><span>Entry only</span><span><b>${c.solo}</b> <span class="mini">${Math.round(c.solo/tot*100)}%</span></span></div>`+
         `<div class="rowline"><span>Entry + L1 filled</span><span><b>${c.lad}</b> <span class="mini">${Math.round(c.lad/tot*100)}%</span></span></div>`;
}
function coverage(pool){
  const n=pool.length||1;
  const rows=[['Fixed target (needs 1.618 + 2.272 price)', ser('O1',pool).length+ser('O3',pool).length+ser('O9',pool).length>0
                 ? pool.filter(t=>t.o&&(t.o.O1!=null||t.o.O3!=null||t.o.O9!=null)).length : 0],
              ['Entry-VWAP stop (needs EVS Price)',  pool.filter(t=>t.o&&(t.o.O5!=null||t.o.O6!=null)).length],
              ['Position-VWAP stop (needs PVS Price)',pool.filter(t=>t.o&&(t.o.O7!=null||t.o.O8!=null)).length]];
  let h='';
  rows.forEach(([lbl,c])=>{
    const pct=Math.round(c/n*100), low=pct<50;
    h+=`<div class="rowline"><span>${lbl}</span><span><b class="${low?'neg':''}">${c}/${pool.length}</b> `+
       `<span class="mini">${pct}%</span></span></div>`;});
  h+=`<div class="mini" style="margin-top:6px">An outcome can only score a trade whose inputs are filled in. Low coverage means that management is being judged on a fraction of the sample — not that it performed badly.</div>`;
  return h;
}
function render(){
  const pool=TRADES, board=document.getElementById('board');
  document.getElementById('foot').innerHTML =
    'Each trade is scored under all twelve managements at once; only those matching its fill type carry a value, the rest are blank and excluded from every average. '+
    'R comes straight from the Notion outcome formulas — this board aggregates, it does not recompute. '+
    'Max DD is the worst peak-to-trough in cumulative R for that outcome alone.';
  if(!pool.length){ board.innerHTML='<div class="card"><div class="empty-note">No trades match this filter yet.</div></div>'; return; }
  const best=bestOf(OUT.map(o=>({o,s:stat(o.k,pool)})));
  const bs=best?best.s:{n:0};
  board.innerHTML=`
    <div class="grid2">
      <div class="card top" style="margin-bottom:12px"><div class="crown">🏆 Best outcome</div>
        <div class="combo-md">${best?best.o.k+' · '+best.o.n:'—'}</div>
        <div class="mini" style="margin-bottom:6px">${best?FILL[best.o.fill]+' · '+MG[best.o.mg]:''}${bs.n>0&&bs.n<5?' <span style="color:#e0b341">· thin sample, n'+bs.n+'</span>':''}</div>
        <div class="stats">
          <div class="stat"><div class="k">Expectancy</div><div class="v ${bs.n?cls(bs.exp):'mut'}">${bs.n?fR(bs.exp):'—'}</div></div>
          <div class="stat"><div class="k">Win rate</div><div class="v">${bs.n?Math.round(bs.wr*100)+'%':'—'}</div></div>
          <div class="stat"><div class="k">Total R</div><div class="v ${bs.n?cls(bs.total):'mut'}">${bs.n?fR(bs.total):'—'}</div></div>
          <div class="stat"><div class="k">Max DD</div><div class="v neg">${bs.n?fDD(bs.dd):'—'}</div></div>
        </div></div>
      <div><div class="card" style="margin-bottom:12px"><div class="lbl">Best per fill type</div>${byFill(pool)}</div>
        <div class="card"><div class="lbl">How the fills actually landed</div>${fillMix(pool)}</div></div>
    </div>
    <div class="card" style="margin-bottom:12px"><div class="lbl">Management × fill type — expectancy</div>
      <div style="margin-top:8px">${compare(pool)}</div>
      <div class="mini" style="margin-top:8px">Reads down for what the ladder is worth, across for which management wins. The 50% column has no entry-only cell — it needs both fills.</div>
    </div>
    <div class="card" style="margin-bottom:12px"><div class="lbl">All twelve, ranked by expectancy</div>
      <div style="margin-top:8px">${matrix(pool)}</div>
    </div>
    <div class="grid2">
      <div class="card"><div class="lbl">Best outcome by session</div>${sessions(pool)}</div>
      <div class="card"><div class="lbl">Input coverage — what each management can actually score</div>${coverage(pool)}</div>
    </div>`;
}

const WORKER='https://vcl-clarity-scoreboard.potus-eth.workers.dev/?view=v3-craig';
async function poll(){
  const st=document.getElementById('status');
  try{
    const res=await fetch(WORKER+'&t='+Date.now(),{cache:'no-store'});
    if(!res.ok) throw new Error('worker '+res.status);
    const j=await res.json();
    ALL=(j&&j.trades)||[];
    applyFilters(); render();
    st.textContent=`${ASSET.toUpperCase()} · ${TF.toUpperCase()} · ${TRADES.length} trade${TRADES.length===1?'':'s'} · ${new Date().toLocaleTimeString()}`;
    firstLoad=false;
  }catch(e){
    if(firstLoad){ st.innerHTML='<span class="err">Connecting… '+(e.message||'')+'</span>';
      document.getElementById('board').innerHTML='<div class="card"><div class="empty-note">Waiting on the live Worker.</div></div>'; }
  }
}
function wire(id,attr,set){
  document.querySelectorAll('#'+id+' button').forEach(b=>{
    b.onclick=()=>{ const v=b.dataset[attr]; if(v===set()) return;
      document.querySelectorAll('#'+id+' button').forEach(x=>x.classList.toggle('on',x===b));
      set(v); applyFilters(); render();
      document.getElementById('status').textContent=
        `${ASSET.toUpperCase()} · ${TF.toUpperCase()} · ${TRADES.length} trade${TRADES.length===1?'':'s'} · switched`; };});
}
wire('assetTg','a',v=>{ if(v===undefined) return ASSET; ASSET=v; });
wire('tfTg','t',  v=>{ if(v===undefined) return TF;    TF=v;    });
poll(); setInterval(poll,5000);
</script>
</body></html>
