</style></head><body>
<div class="wrap">
  <div class="hd">
    <div><h1>VCS SIMPLICITY V6</h1><div class="sub">VWAP Scalp · single fill · futures 15s + crypto 1m · fib 0 stop / fib 1 entry / XR at fib X+1</div></div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <div class="tg" id="classTg"><button data-c="all" class="on">ALL</button><button data-c="futures">FUTURES</button><button data-c="crypto">CRYPTO</button></div>
      <div class="tg" id="pairTg"></div>
      <div class="mini" id="status">loading…</div>
    </div>
  </div>
  <div id="board"></div>

</div>
<script>
// Two models scored off the SAME logged row. They share the fib geometry and differ only
// in where the stop sits and whether there is an L1 leg — so one set of typed prices
// settles both, and neither is a counterfactual needing bar data to reconstruct.
// Nine methods, all named by what they DELIVER on the whole position. The partial is
// banked before the runner sets off, so only half the position is still working:
//   partial at 1R -> delivering NR needs the runner at 2N-1
//   partial at 2R -> delivering NR needs the runner at 2N-2
// The fib is drawn stop-to-entry, so the box IS 1R and XR sits at fib X+1. Runner caps:
// on the 1R-partial fib the cap delivering N is fib 2N; on the 2R-partial fib it is 2N-1.
const MGMTS_OBVS=[
  {k:'f1',label:'Full @ 1R · fib 2',short:'F1'},
  {k:'f2',label:'Full @ 2R · fib 3',short:'F2'},
  {k:'f3',label:'Full @ 3R · fib 4',short:'F3'},
  {k:'f4',label:'Full @ 4R · fib 5',short:'F4'},
  {k:'f5',label:'Full @ 5R · fib 6',short:'F5'},
  {k:'a2',label:'50% @1R → 2R · runner fib 4',short:'A2'},
  {k:'a3',label:'50% @1R → 3R · runner fib 6',short:'A3'},
  {k:'a4',label:'50% @1R → 4R · runner fib 8',short:'A4'},
  {k:'a5',label:'50% @1R → 5R · runner fib 10',short:'A5'},
  {k:'b3',label:'50% @2R → 3R · runner fib 5',short:'B3'},
  {k:'b4',label:'50% @2R → 4R · runner fib 7',short:'B4'},
  {k:'b5',label:'50% @2R → 5R · runner fib 9',short:'B5'}];
const FOOT_OBVS='R math: one order, one stop, no L1 leg — 1R is simply |entry − stop|, so nothing here may be cross-compared against a two-fill ladder board. The stop is <b>typed from structure</b>, not solved from a ratio; the fib is drawn stop-to-entry as a reading aid only, so <b>fib 0 = stop, fib 1 = entry, and XR sits at fib X+1</b>. Both ends are on-grid prices, so no tick rounding is applied anywhere. Stop-outs are read off the <b>logged Trail Stop</b> reaching the stop — there is no break-even move, the stop only steps on a break of structure — so the trail exit is complete evidence of where the trade ended and no Max Adverse column is needed. A target that never printed is <b>not</b> a loss — the position exits at the logged Trail Stop.';
let MGMTS=MGMTS_OBVS.slice();
// Instrument class filter — futures and crypto share this log, so the top toggle splits
// them. 'all' is legitimate: the R math is identical, only the tick grid differs.
let CLASS='all';
const FUTURES=['MNQ','MES','MGC'];
const isFutures=p=>FUTURES.includes(p);
let ALL_TRADES=[], TRADES=[];
let PAIR='all';

function num(x){ return (x===null||x===undefined||x==='')?null:Number(x); }

// ── VCS scorer ────────────────────────────────────────────────────────────────
// One order, one stop. The stop is TYPED from market structure — a swing point — and 1R is
// simply |entry − stop|. Every target is a whole multiple of it, so with both ends on-grid
// nothing needs rounding and no tolerance exists. The fib is a reading aid only: drawn
// stop-to-entry, fib 0 = stop, fib 1 = entry, XR at fib X+1.
//
// No Max Adverse here and none is needed: the stop only moves on a break of structure
// (there is no break-even step), so the logged Trail Stop reaching the stop is complete
// evidence of a stop-out, and a Trail Stop above it is complete evidence of survival.
function computeR(row){
  const E=num(row.EntryPrice), S=num(row.StopPrice),
        MR=num(row.MaxRun), BX=num(row.TrailStop);
  const r={f1:null,f2:null,f3:null,f4:null,f5:null,a2:null,a3:null,a4:null,a5:null,b3:null,b4:null,b5:null};
  const base={pair:row.Pair||null, session:row.Session||null, date:row.date||null,
              n:row.n??null, dir:row.Direction||null,
              ema200:num(row.ema200), mfSignal:row.mfSignal||null,
              poi:Array.isArray(row.poi)?row.poi:[], poiTf:row.poiTf||null, sweep:row.sweep===true,
              entry:E, stop:S, r, raw:row};
  if(E==null||S==null||MR==null||BX==null) return base;
  // Direction is logged, not inferred from the prices: a stop typed on the wrong side of
  // entry is a logging error and must read as unscored, not silently flip the trade.
  const dir = row.Direction==='Long' ? 1 : row.Direction==='Short' ? -1 : null;
  if(dir==null) return base;
  if(dir*(E-S)<=0){ base.badStop=true; return base; }
  // The stop is typed from structure. 1R is the box, both ends are on-grid prices, and
  // every target is a whole multiple of it — so no tick rounding is needed and none is done.
  const oneR=Math.abs(E-S), EPS=1e-9, R=p=>dir*(p-E)/oneR;
  // Trail Stop at or through the stop IS a stop-out — but it is NOT "everything books -1R".
  // Max Run is the furthest favourable price BEFORE the position closed, so a target it
  // reached printed before the stop did. With no break-even move this case is real: hit
  // 1R, reverse, stop at the original level. Full @1R closed at +1R before any of that;
  // a 1R partial banked half and lost the runner, 0.5 + 0.5*(-1) = 0R. Only a method whose
  // first target never printed takes the full -1R. `be` is simply -1 (or worse, on a gap)
  // and every formula below already does the right thing with it — so no short-circuit.
  base.stopped = dir*(BX-S)<=EPS;
  const mr=R(MR), be=R(BX), hit=N=>mr>=N-EPS;
  // A target that never printed is NOT a loss — the position rode the trail to its
  // logged exit. There is no break-even move: if the runner came back to the original
  // stop with no BoS, `be` is -1 and a 1R partial scores 0.5 + 0.5*(-1) = 0R. That is
  // the real cost of the partial without BE, and it must show.
  const runA=c=>hit(1)?0.5*1+0.5*(hit(c)?c:be):be;   // partial banked at 1R
  const runB=c=>hit(2)?0.5*2+0.5*(hit(c)?c:be):be;   // partial banked at 2R
  r.f1=hit(1)?1:be; r.f2=hit(2)?2:be; r.f3=hit(3)?3:be; r.f4=hit(4)?4:be; r.f5=hit(5)?5:be;
  r.a2=runA(3); r.a3=runA(5); r.a4=runA(7); r.a5=runA(9);   // deliver N off a 1R partial => runner 2N-1
  r.b3=runB(4); r.b4=runB(6); r.b5=runB(8);                 // deliver N off a 2R partial => runner 2N-2
  base.maxRunR=mr; base.exitR=be;
  return base;
}

function applyFilters(){
  let pool=ALL_TRADES.slice();
  if(PAIR!=='all') pool=pool.filter(t=>t.pair===PAIR);
  if(CLASS!=='all') pool=pool.filter(t=>isFutures(t.pair)===(CLASS==='futures'));
  TRADES = decorate(pool);
}

// ── stats engine, shared verbatim with the crypto board ──────────────────────
// Futures previously had no interval of any kind: stats() returned n/wins/wr/exp/total.
// The board with 4 trades on one day had none of the hedging the 28-trade board has.
const TTAB={2:4.303,3:3.182,4:2.776,5:2.571,6:2.447,7:2.365,8:2.306,9:2.262,10:2.228,11:2.201,12:2.179,13:2.160,14:2.145,15:2.131,16:2.120,17:2.110,18:2.101,19:2.093,20:2.086,21:2.080,22:2.074,23:2.069,24:2.064,25:2.060,26:2.056,27:2.052,28:2.048,29:2.045,30:2.042};
const tCrit=df=>df<2?12.7:df>30?1.96:TTAB[df];

// ── THE SEAM ─────────────────────────────────────────────────────────────────
// The only structural difference between this board and the crypto one. Futures nests
// outcomes under t.r (the widget computes both models itself); crypto reads them straight
// off the trade (Notion formulas wrote them). Everything else above and below is identical

const RV=(t,k)=>(t&&t.r)?t.r[k]:null;

function stats(series){ const n=series.length; if(!n) return {n:0};

function bestMethod(rows){

  // runs on both.

    const s=fullStats(rows.map(t=>RV(t,m.key)).filter(x=>x!=null));
    if(!s.n) return;

    sess+=`<tr><td><span class="pill">${x.se}</span></td>
      <td class="pm">${x.b.label}${weak?' <span class="mini" style="color:#e0b341">weak</span>':''}${thin?' <span class="mini">thin</span>':''}</td>

// ── 200 EMA at entry ─────────────────────────────────────────────────────────
// The log stores ONE number — the 200 EMA's price on the entry candle. Every state the
// board reports is solved from it, because a number can be re-bucketed later and a
// category cannot be un-bucketed.
//
// Entry is fib 0.382, one tick beyond the AVWAP, so "above/below the AVWAP we entered on"
// and "above/below Entry Price" are the same comparison to within a tick — there is no
// separate VWAP field to log. The killbox is the fib envelope, 1.0 (the anchor) down to
// 0, and fib 0 is solved from the two prices already typed:
//   entry = fib0 + 0.382·(anchor − fib0)  ⟹  fib0 = (entry − 0.382·anchor) / 0.618
// A 200 outside that envelope is not interacting with the setup at all, which is why it
// is its own bucket rather than a wider "above".
// The log records the RAW position — what the chart plainly shows — and this converts it
// to the trade's frame. That split is deliberate: reading "the 200 is above the AVWAP" off
// a chart is instant and never wrong, whereas deciding whether that is protection or a
// headwind depends on Direction and is exactly what a human gets backwards on a short.
//
//   Behind entry      — the 200 is on the far side of entry from the target, backing the trade
//   In front of entry — the 200 sits between entry and the target, in the path of the run
//
// A long feeds DOWN into the AVWAP, so a 200 below it is the backstop; a short feeds UP
// into it, so a 200 above it is. Labelling by raw price put structurally identical setups
// in opposite buckets, mixing the protected case with the headwind case in each.
const EMA_STATES = ['In front of entry','Inside box','Beyond stop'];
function emaState(t){
  // The 200 EMA is logged as a PRICE. Its position is worked out here against the box
  // (stop → entry), oriented to the trade, so the logger never has to decide whether it
  // was protection or a headwind — that flips with direction and is the bit a human gets
  // backwards on a short.
  const p=t.ema200, E=t.entry, S=t.stop;
  if(p==null||E==null||S==null) return null;
  const d = t.dir==='Long' ? 1 : t.dir==='Short' ? -1 : null;
  if(d==null) return null;
  if(d*(p-E)>0) return 'In front of entry';   // on the target side of entry
  if(d*(p-S)<0) return 'Beyond stop';         // behind the box entirely
  return 'Inside box';                        // between stop and entry
}
// ── shared bucket card ───────────────────────────────────────────────────────

//
// Scored on whatever method currently leads, the same key the direction tilt uses, so this
// can never name a method the rest of the board has just ranked last.
function bucketCard({pool, label, keyFn, order, note, emptyNote, multi=false}){
  // multi: keyFn returns an array and a trade can sit in several buckets (Anchor POI).
  const has = multi ? (t=>Array.isArray(keyFn(t))&&keyFn(t).length>0) : (t=>keyFn(t)!=null);
  const inB = multi ? ((t,k)=>keyFn(t).includes(k)) : ((t,k)=>keyFn(t)===k);
  const scored=pool.filter(has);
  const missing=pool.length-scored.length;
  if(!scored.length) return `<div class="card" style="margin-bottom:12px"><div class="lbl">${label}</div>
    <div class="empty-note">${emptyNote}</div></div>`;
  const LD=leaderOf(pool), TK=LD?LD.best.m.key:(MGMT[0]||{}).key, tname=LD?LD.best.m.name:'';
  const keys = order || [...new Set(multi ? scored.flatMap(keyFn) : scored.map(keyFn))];
  const rows=keys.map(k=>({k, s:fullStats(scored.filter(t=>inB(t,k)).map(t=>RV(t,TK)).filter(x=>x!=null))}))
                 .filter(x=>x.s.n);
  const ranked=[...rows].sort((a,b)=>(rankKey(b.s)-rankKey(a.s))||((b.s.lo??-999)-(a.s.lo??-999)));
  const top=ranked[0];
  // A winner is only named when the bucket is not thin AND its interval clears zero.
  // The failure mode this exists to stop is a 100% win rate off one trade reading as edge.
  const solid = top && top.s.n>=5 && top.s.lo>0 && !top.s.degenerate;
  const head = solid
    ? `<div class="band" style="margin:4px 0 2px">
         <div class="bandnum ${cls(top.s.mean)}">${top.k}</div>
         <div class="bandci">best of the set · ${fR(top.s.mean)} per trade · 95% CI [${fR(top.s.lo)}, ${fR(top.s.hi)}] · n${top.s.n}</div></div>`
    : `<div class="band" style="margin:4px 0 2px">
         <div class="bandnum mut">${top?top.k:'—'}</div>
         <div class="bandci">leading so far — <b>not</b> yet an edge${top?` · ${fR(top.s.mean)} on n${top.s.n}${top.s.n<5?', needs 5+':(top.s.lo<=0?', interval still spans zero':'')}`:''}</div></div>`;
  let body='';
  rows.forEach(x=>{ const thin=x.s.n<5;
    body+=`<tr><td><span class="pill">${x.k}</span></td>
      <td class="pm">${Math.round(x.s.winRate*100)}% win <span class="mini">${x.s.wins}/${x.s.scratches}/${x.s.losses}</span>${thin?' <span class="mini">thin</span>':''}</td>

    <div class="mini" style="margin-bottom:6px">scored on <b>${tname}</b> · ${scored.length} of ${pool.length} trades carry a reading${missing?` · ${missing} unfilled` : ''}</div>
    <table class="ptab">${body}</table>
    <div class="mini" style="margin-top:8px">win column is W/scratch/L · thin = &lt;5 trades · ${note}</div></div>`;

// ── optimal range ────────────────────────────────────────────────────────────
// "Where does each scenario actually earn?" Every method's expectancy in each Range-%
// tercile. Terciles are cut PER INSTRUMENT — an MNQ box and a SOL box are not on one scale
// — and a pair only contributes once it has 6+ scored trades, because a tercile of two is
// not a tercile. Best cell per method is highlighted; a cell with n<3 is shown but dimmed.
const RANGE_TERCILES=['Small','Medium','Large'];
function rangeCard(pool){
  const scored=pool.filter(t=>t.rangePct!=null && MGMT.some(m=>RV(t,m.key)!=null));
  const byPair={}; scored.forEach(t=>(byPair[t.pair]=byPair[t.pair]||[]).push(t));
  const cuts={}, skipped=[];
  for(const pr in byPair){
    const v=byPair[pr].map(t=>t.rangePct).sort((a,b)=>a-b);
    if(v.length<6){ skipped.push(`${pr} (${v.length}, needs 6)`); continue; }
    const c=[v[Math.floor(v.length/3)], v[Math.floor(2*v.length/3)]];
    // Equal cut points mean the boxes are too uniform to split — every trade would land in
    // one bucket and the card would read as if that size were "optimal". Say so instead.
    if(c[0]===c[1]){ skipped.push(`${pr} (boxes too uniform)`); continue; }
    cuts[pr]=c;

  if(!eligible.length) return `<div class="card" style="margin-bottom:12px"><div class="lbl">Optimal range · expectancy by box size</div>

  const terc=t=>{ const c=cuts[t.pair]; return t.rangePct<c[0]?'Small':t.rangePct<c[1]?'Medium':'Large'; };

  let body='';
  MGMT.forEach(mm=>{
    const cells=RANGE_TERCILES.map(k=>fullStats(eligible.filter(t=>terc(t)===k).map(t=>RV(t,mm.key)).filter(x=>x!=null)));
    const best=cells.reduce((b,c,i)=>(c.n>=3&&(b<0||c.mean>cells[b].mean))?i:b,-1);
    body+=`<tr><td>${mm.short}</td>`+cells.map((c,i)=>c.n
      ? `<td class="pr ${cls(c.mean)}${c.n<3?' mut':''}${i===best?' best':''}">${fR(c.mean)} <span class="mini">n${c.n}</span></td>`
      : `<td class="pr mut">—</td>`).join('')+`</tr>`;
  });
  return `<div class="card" style="margin-bottom:12px"><div class="lbl">Optimal range · expectancy by box size</div>
    <div class="mini" style="margin-bottom:6px">terciles per instrument · ${bounds.join(' · ')}${skipped.length?` · not yet bucketed: ${skipped.join(', ')}`:''}</div>
    <table class="ptab"><tr><td></td>${RANGE_TERCILES.map(k=>`<td class="pr mut">${k}</td>`).join('')}</tr>${body}</table>
    <div class="mini" style="margin-top:8px">box = entry to stop as % of entry · best cell per method highlighted once it has 3+ trades</div></div>`;
}
function fR(x){ return (x>=0?'+':'')+x.toFixed(2)+'R'; }
function cls(x){ return x>0?'pos':(x<0?'neg':'mut'); }
function normalizeMethods(){
  MGMT = MGMTS.map(m=>{ const i=METHOD_INFO[m.k]||{};
    return {...m, key:m.k, name:m.label, short:m.short||m.label,
            lvl:m.lvl||'', desc:i.what||''}; });
}
function seriesFor(prop,pool){ return pool.map(t=>RV(t,prop)).filter(v=>v!=null&&!isNaN(v)); }
function statsFor(prop,pool){ return fullStats(seriesFor(prop,pool)); }
function paired(a,b,pool){
  const d=[]; pool.forEach(t=>{const x=RV(t,a),y=RV(t,b); if(x!=null&&y!=null) d.push(y-x);});
  return ci95(d);
}
// Attach the flat fields the ported chart code reads. Called once per filter pass.
function decorate(pool){
  pool.forEach(t=>{
    const w=t.raw||{};
    t.Direction=w.Direction; t.entry=num(w.EntryPrice); t.stop=num(w.StopPrice);
    t.maxRun=num(w.MaxRun);
    const oneR=(t.entry!=null&&t.stop!=null)?Math.abs(t.entry-t.stop):null;
    t.oneR=oneR; t.rangePct=(oneR&&t.entry)?oneR/t.entry*100:null;
  });
  return pool;
}

function equityCurveSVG(series, w, h){
  w=w||300; h=h||44;
  if(!series.length) return `<svg viewBox="0 0 ${w} ${h}"><line x1="0" y1="${h/2}" x2="${w}" y2="${h/2}" stroke="var(--zero)" stroke-width="1"/><text x="4" y="${h/2+4}" fill="#3d4553" font-size="10">no data</text></svg>`;
  const cum=[0]; series.forEach(r=>cum.push(cum[cum.length-1]+r));
  const minV=Math.min(0,...cum), maxV=Math.max(0,...cum);
  const range=(maxV-minV)||1, n=cum.length-1;
  const pad=3;
  const px=i=>(i/n)*w;
  const py=v=>pad+(1-(v-minV)/range)*(h-2*pad);
  const base=py(0);
  const pts=cum.map((v,i)=>({x:px(i), y:py(v), v}));
  const segs=[];
  let seg=[pts[0]], segSign=pts[0].v<0?'neg':'pos';
  for(let i=1;i<pts.length;i++){
    const a=pts[i-1], b=pts[i];
    if((a.v<0&&b.v>0)||(a.v>0&&b.v<0)){
      const t=a.v/(a.v-b.v);
      const cross={x:a.x+(b.x-a.x)*t, y:base, v:0};
      seg.push(cross);
      segs.push({pts:seg, sign:segSign});
      segSign=b.v<0?'neg':'pos';
      seg=[cross,b];
    } else {
      seg.push(b);
      if(b.v<0) segSign='neg'; else if(b.v>0) segSign='pos';
    }
  }
  segs.push({pts:seg, sign:segSign});
  const COL={pos:'#3fb950', neg:'var(--neg)'};
  const gid='eqg'+(_eqSeq++);
  const defs=`<defs>
    <linearGradient id="${gid}p" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${COL.pos}" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="${COL.pos}" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="${gid}n" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${COL.neg}" stop-opacity="0"/>
      <stop offset="100%" stop-color="${COL.neg}" stop-opacity="0.32"/>
    </linearGradient>
  </defs>`;
  let body='';
  segs.forEach(s=>{
    if(s.pts.length<2) return;
    const line=s.pts.map((p,i)=>(i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
    const first=s.pts[0], last=s.pts[s.pts.length-1];
    const area=`${line} L${last.x.toFixed(1)},${base.toFixed(1)} L${first.x.toFixed(1)},${base.toFixed(1)} Z`;
    body += `<path d="${area}" fill="url(#${gid}${s.sign==='pos'?'p':'n'})" stroke="none"/><path d="${line}" fill="none" stroke="${COL[s.sign]}" stroke-width="1.5"/>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}">
    ${defs}
    <line x1="0" y1="${base.toFixed(1)}" x2="${w}" y2="${base.toFixed(1)}" stroke="var(--zero)" stroke-width="1"/>
    ${body}
  </svg>`;
}
const fDD=d=>d<0.005?'0.00R':'-'+d.toFixed(2)+'R';

let _eqSeq=0;

// ── PORTED VERBATIM FROM v3-grant.html — do not edit here without editing there ──
function verdictLine(pool){
  const rows=MGMT.map(m=>({m,s:statsFor(m.key,pool)})).filter(x=>x.s.n);
  if(!rows.length) return '';
  rows.sort((a,b)=>b.s.mean-a.s.mean);
  const sig=rows.filter(r=>r.s.lo>0);
  const days=new Set(pool.map(t=>t.date).filter(Boolean)).size;
  const n=rows[0].s.n;
  const width=rows[0].s.hi-rows[0].s.lo;
  const spread=rows[0].s.mean-rows[Math.min(3,rows.length-1)].s.mean;
  const head = sig.length
    ? `${n} TRADES · ${days} DAY${days===1?'':'S'} · ${sig.length} OUTCOME${sig.length===1?'':'S'} CLEAR ZERO`
    : `${n} TRADES · ${days} DAY${days===1?'':'S'} · NOTHING SEPARATES YET`;
  const body = sig.length
    ? `${sig.map(r=>r.m.name).join(', ')} hold${sig.length===1?'s':''} above zero at 95%. Everything else is still a lean.`
    : `The top four land within ${fR(spread)} of each other, and this board resolves about ${'±'+ (width/2).toFixed(1)}R. No change indicated — keep the trail.`;
  return `<div style="border-left:2px solid var(--closeable);padding:2px 0 2px 10px;margin-bottom:11px">
    <div style="font-size:15px;font-weight:700;color:var(--ink);letter-spacing:.3px">${head}</div>
    <div style="font-size:11px;color:var(--mut);line-height:1.5;margin-top:2px">${body}</div></div>`;
}

// One definition of the leader, used by every card that needs it. Ranked on the lower
// bound of the 95% interval; a zero-variance interval is every trade scoring the same
// number and cannot take the top spot. Previously the answer card and the prescription
// card each had their own rule and named different methods on the same screen.
// Ranking key. A zero-variance sample is NOT unrankable — every trade landing on the same
// number means the observed spread is zero, so the best estimate of the lower bound is the
// mean itself. Barring it outright (the earlier rule) handed session picks to strictly
// worse methods: in Asia it preferred 50% @1R at +0.65R over Full @1R at +1.00R purely
// because the better one had no spread. The ±0 flag still marks it, because zero observed
// variance in 2-4 binary outcomes is a short streak, not consistency.
// Ranking is by the lower bound of the 95% interval — POTUS's call 2026-09-07. It answers the
// question the board is actually asked: over many trades, which management earns the most
// per trade? The confidence interval stays printed on every row, so how much of that mean
// rests on one outlier is still visible — it just no longer decides the order. Exact ties
// fall back to the lower bound, so equal earners are led by the steadier one.
// Ranked on the LOWER BOUND of the 95% interval, not the mean — POTUS's call 2026-09-07.
// The mean rewards whichever method happened to catch the fattest tail: Full @4R has the
// highest mean on this log AND the widest spread of the nine, so it tops a mean ranking
// while being the least dependable. The lower bound asks the other question — what does
// this method clear even on an unlucky read of the same evidence — and drops it to fourth.
// A zero-width interval still cannot win (see rankKey), because that is not confidence,
// it is every observation landing on the same number.
// Ranking is by expectancy — mean R per trade — POTUS's call 2026-08-29. It answers the
// question the board is actually asked: over many trades, which management earns the most
// per trade? The confidence interval stays printed on every row, so how much of that mean
// rests on one outlier is still visible — it just no longer decides the order. Exact ties
// fall back to the lower bound, so equal earners are led by the steadier one.
const rankKey = s => s.mean ?? -999;
function rankRows(rows, pool){
  if(rows.length<2) return rows;
  return [...rows].sort((a,b)=>
    (rankKey(b.s)-rankKey(a.s)) || ((b.s.lo??-999)-(a.s.lo??-999)));
}

function leaderOf(pool){
  const rows=MGMT.map(m=>({m,s:statsFor(m.key,pool)})).filter(x=>x.s.n);
  if(!rows.length) return null;
  const order=rankRows(rows,pool);
  return {best:order[0], up:order[1], order};
}

function winnerCard(pool){
  const rows=MGMT.map(m=>({m,s:statsFor(m.key,pool)})).filter(x=>x.s.n);
  if(!rows.length) return '';
  // Same rule as the matrix: lower bound of the interval, and a zero-width interval
  // cannot take the top spot. Ranking this card by mean while the table below it ranks by
  // lower bound would put two different winners on one screen.
  const L=leaderOf(pool); const best=L.best, up=L.up, order=L.order, s=best.s;
  const beatsZero = s.lo>0;
  const margin = up ? paired(up.m.key,best.m.key,pool) : null;
  const beatsNext = margin && margin.n>0 && margin.lo>0;
  const solid = beatsZero && beatsNext;
  const ties = rows.slice(1).filter(r=>{
    const p=paired(best.m.key,r.m.key,pool); return p.n>0 && !(p.lo>0);
  });
  const days=new Set(pool.map(t=>t.date).filter(Boolean)).size;
  return `<div class="card answer">
    <div class="eyebrow">${solid?'Leader — clears zero and beats the runner-up':'Leading so far — not yet a separation'}</div>
    <div class="policy">${best.m.name} <span class="mut" style="font-size:12px;font-weight:400">${best.m.lvl}</span></div>
    <div class="band"><div class="bandnum ${cls(s.mean)}">${fR(s.mean)}</div>
      <div class="bandci">expectancy · 95% CI [${fR(s.lo)}, ${fR(s.hi)}] · n${s.n} over ${days} day${days===1?'':'s'}
      ${beatsZero?'<span class="sig">clears zero</span>':'<span class="mut">· interval still crosses zero</span>'}</div></div>
    <div class="curve">${equityCurveSVG(seriesFor(best.m.key,pool),600,70)}</div>
    <div class="fsub">${best.m.desc}</div>
    <div class="stats">
      <div class="stat"><div class="k">Win rate</div><div class="v">${Math.round(s.winRate*100)}% <span class="mini">${s.wins}/${s.scratches}/${s.losses}</span></div></div>
      <div class="stat"><div class="k">Total R</div><div class="v ${cls(s.total)}">${fR(s.total)}</div></div>
      <div class="stat"><div class="k">Max drawdown</div><div class="v neg">${fDD(s.dd)}</div></div>
      <div class="stat"><div class="k">LIS</div><div class="v ${s.streak?'neg':'mut'}">${s.streak}</div></div>
      <div class="stat"><div class="k">WIS</div><div class="v ${s.winStreak?'pos':'mut'}">${s.winStreak}</div></div>
      <div class="stat"><div class="k">Trading days</div><div class="v mut">${days}</div></div>
    </div>
    ${up?`<div class="ctlstrip" style="margin-top:9px">Runner-up: <b style="color:var(--ink)">${up.m.name}</b> at ${fR(up.s.mean)} — leader is ahead by
      <b class="${margin.n?cls(margin.mean):''}">${margin.n?fR(margin.mean):'—'}</b> paired${beatsNext?' <span class="sig">significant</span>':' · not significant'}.</div>`:''}
    ${solid?'':`<div class="caveat" style="margin-top:9px">
      <b>Read this as a lean, not a verdict.</b> ${ties.length?`Statistically tied with: ${ties.map(t=>t.m.name).join(', ')}. `:''}
      ${beatsZero?'The leader clears zero on its own, but its margin over the runner-up does not — those are different claims.':'The leader\'s own interval still includes zero.'}</div>`}
  </div>`;
}

function reachLadderSVG(pool){
  // Above ~24 trades the per-trade bars stop being readable, so the same data is
  // drawn as a survival curve instead: what share of trades reached at least X R.
  // Same information, and it gets MORE legible as n grows rather than less.
  // Always the survival curve — POTUS chose one format for both boards, and it is the
  // one that gets MORE legible as n grows. The per-trade bar variant is retired.
  return reachCurveSVG(pool);
  const dirOf=t=>t.Direction==='Long'?1:-1;
  const rOf=t=>{const d=dirOf(t),risk=d*(t.entry-t.stop);
    return (risk>0 && t.maxRun!=null) ? d*(t.maxRun-t.entry)/risk : null;};
  const rows=pool.map(t=>({t,r:rOf(t)})).filter(x=>x.r!=null);
  if(!rows.length) return '';
  const W=1000,H=250,padL=6,padR=138,padT=22,padB=36;
  const maxR=Math.max(5.6,...rows.map(x=>x.r))*1.06, minR=-1.7;
  const pw=W-padL-padR, ph=H-padT-padB;
  const y=r=>padT+(1-(r-minR)/(maxR-minR))*ph;
  const n=rows.length, slot=pw/n, bw=Math.min(46,slot*0.54);
  const LV=[{r:1,f:'fib 2'},{r:2,f:'fib 3'},{r:3,f:'fib 4'},{r:5,f:'fib 6'}];
  const zero=y(0);

  let grid='';
  LV.forEach(l=>{
    const hits=rows.filter(x=>x.r>=l.r).length, yy=y(l.r);
    grid+=`<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${(W-padR+6).toFixed(1)}" y2="${yy.toFixed(1)}" stroke="#2a3140" stroke-width="1"/>`
       +  `<text x="${W-padR+13}" y="${(yy+3.5).toFixed(1)}" font-size="11" fill="#8b93a1">`
       +  `<tspan font-weight="700" fill="#c3c9d4">${l.r}R</tspan>  fib ${l.f}  `
       +  `<tspan font-weight="700" fill="${hits?'#e6e8ec':'#4a5568'}">${hits}/${rows.length}</tspan></text>`;
  });

  let bars='';
  rows.forEach((x,i)=>{
    const cx=padL+slot*i+slot/2, win=x.r>0;
    const top=y(Math.max(x.r,0)), bot=y(Math.min(x.r,0));
    const col=win?'#3fb950':'var(--neg)';
    bars+=`<rect x="${(cx-bw/2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1,bot-top).toFixed(1)}" fill="${col}" fill-opacity="0.20"/>`
       +  `<line x1="${(cx-bw/2).toFixed(1)}" y1="${(win?top:bot).toFixed(1)}" x2="${(cx+bw/2).toFixed(1)}" y2="${(win?top:bot).toFixed(1)}" stroke="${col}" stroke-width="2"/>`
       +  `<text x="${cx.toFixed(1)}" y="${(win?top-5:bot+12).toFixed(1)}" font-size="10" font-weight="700" fill="${col}" text-anchor="middle">${(x.r>=0?'+':'')+x.r.toFixed(2)}R</text>`;
    const dt=(x.t.date||'').slice(5), ses=(x.t.Session||'').replace('London','Ldn').replace('NY AM','NYam').replace('NY PM','NYpm');
    bars+=`<text x="${cx.toFixed(1)}" y="${(H-padB+14).toFixed(1)}" font-size="8.5" fill="#8b93a1" text-anchor="middle">${dt}</text>`
       +  `<text x="${cx.toFixed(1)}" y="${(H-padB+24).toFixed(1)}" font-size="8.5" fill="#6b7280" text-anchor="middle">${ses}</text>`;
    // a visible seam wherever the log jumps to a different day — clustering you can see
    if(i>0 && rows[i-1].t.date && x.t.date && rows[i-1].t.date!==x.t.date){
      const dx=(padL+slot*i).toFixed(1);
      bars+=`<line x1="${dx}" y1="${padT-6}" x2="${dx}" y2="${H-padB+2}" stroke="#3d4553" stroke-width="1" stroke-dasharray="2 3"/>`;
    }
  });

  return `<div class="card" style="padding:12px 14px 8px">
    <div class="lbl">How far each trade actually ran — and what each exit level would have caught</div>
    <svg viewBox="0 0 ${W} ${H}" style="display:block;width:100%;height:auto">
      ${grid}
      <line x1="${padL}" y1="${zero.toFixed(1)}" x2="${(W-padR+6).toFixed(1)}" y2="${zero.toFixed(1)}" stroke="#5a6478" stroke-width="1.5"/>
      ${bars}
    </svg>
    <div class="fsub" style="margin:6px 0 0">Every outcome on this board is this one picture read at a different height. The levels do not fail independently — a trade that misses 3R misses 5R too — so two outcomes agreeing is not two pieces of evidence.</div>
  </div>`;
}

function reachCurveSVG(pool){
  const dirOf=t=>t.Direction==='Long'?1:-1;
  const rOf=t=>{const d=dirOf(t),risk=d*(t.entry-t.stop);
    return (risk>0 && t.maxRun!=null) ? d*(t.maxRun-t.entry)/risk : null;};
  const rs=pool.map(rOf).filter(v=>v!=null).sort((a,b)=>a-b);
  if(!rs.length) return '';
  const W=1000,H=230,padL=52,padR=130,padT=20,padB=34;
  const maxR=Math.max(6,rs[rs.length-1])*1.05, minR=Math.min(-1.5,rs[0]);
  const pw=W-padL-padR, ph=H-padT-padB;
  const x=r=>padL+(r-minR)/(maxR-minR)*pw, y=p=>padT+(1-p)*ph;
  const surv=r=>rs.filter(v=>v>=r).length/rs.length;
  let path='';
  for(let i=0;i<=160;i++){
    const r=minR+(maxR-minR)*i/160;
    path+=(i?'L':'M')+x(r).toFixed(1)+','+y(surv(r)).toFixed(1);
  }
  let grid='';
  [1,2,3,5].forEach((N,i)=>{
    const f=['fib 2','fib 3','fib 4','fib 6'][i], p=surv(N);
    grid+=`<line x1="${x(N).toFixed(1)}" y1="${padT-4}" x2="${x(N).toFixed(1)}" y2="${(H-padB).toFixed(1)}" stroke="#2a3140" stroke-width="1"/>`
       +  `<circle cx="${x(N).toFixed(1)}" cy="${y(p).toFixed(1)}" r="3.5" fill="#3fb950"/>`
       +  `<text x="${x(N).toFixed(1)}" y="${(H-padB+13).toFixed(1)}" font-size="9" fill="#c3c9d4" text-anchor="middle" font-weight="700">${N}R</text>`
       +  `<text x="${x(N).toFixed(1)}" y="${(H-padB+23).toFixed(1)}" font-size="8" fill="#6b7280" text-anchor="middle">${f}</text>`
       +  `<text x="${(x(N)+5).toFixed(1)}" y="${(y(p)-6).toFixed(1)}" font-size="9.5" font-weight="700" fill="#e6e8ec">${Math.round(p*100)}%</text>`;
  });
  let yax='';
  [0,0.25,0.5,0.75,1].forEach(p=>{
    yax+=`<line x1="${padL}" y1="${y(p).toFixed(1)}" x2="${(W-padR).toFixed(1)}" y2="${y(p).toFixed(1)}" stroke="#1f2735" stroke-width="1"/>`
      +  `<text x="${padL-7}" y="${(y(p)+3.5).toFixed(1)}" font-size="9" fill="#6b7280" text-anchor="end">${Math.round(p*100)}%</text>`;
  });
  return `<div class="card" style="padding:12px 14px 8px">
    <div class="lbl">Reach curve — share of trades that ran at least this far (n=${rs.length})</div>
    <svg viewBox="0 0 ${W} ${H}" style="display:block;width:100%;height:auto">
      ${yax}${grid}
      <path d="${path}" fill="none" stroke="#3fb950" stroke-width="2"/>
      <text x="${W-padR+12}" y="${padT+10}" font-size="10" fill="#8b93a1">median run</text>
      <text x="${W-padR+12}" y="${padT+24}" font-size="13" font-weight="700" fill="#e6e8ec">${rs[Math.floor(rs.length/2)].toFixed(2)}R</text>
    </svg>
    <div class="fsub" style="margin:6px 0 0">Each dot is one exit level: how often price reached it at all. Every outcome on this board is a point on this curve weighed against what it pays.</div>
  </div>`;
}

function intervalStripSVG(pool){
  const rows=MGMT.map(m=>({m,s:statsFor(m.key,pool)})).filter(x=>x.s.n);
  if(!rows.length) return '';
  rows.sort((a,b)=>b.s.mean-a.s.mean);
  const W=1000,labW=196,valW=66,padT=20,padB=20,rh=17;
  const H=padT+padB+rows.length*rh;
  const lo=Math.min(-1.3,...rows.map(r=>r.s.lo)), hi=Math.max(1.3,...rows.map(r=>r.s.hi));
  const pw=W-labW-valW, x=v=>labW+(v-lo)/(hi-lo)*pw;
  const lead=rows[0].s;

  let ticks='';
  for(let v=Math.ceil(lo);v<=Math.floor(hi);v++){
    if(v===0) continue;
    ticks+=`<line x1="${x(v).toFixed(1)}" y1="${padT-6}" x2="${x(v).toFixed(1)}" y2="${(H-padB+2).toFixed(1)}" stroke="#232a36" stroke-width="1"/>`
        +  `<text x="${x(v).toFixed(1)}" y="${(H-padB+14).toFixed(1)}" font-size="8.5" fill="#6b7280" text-anchor="middle">${v>0?'+':''}${v}R</text>`;
  }
  let body='';
  rows.forEach((r,i)=>{
    const yy=padT+i*rh+rh/2, s=r.s;
    const crosses=s.lo<0&&s.hi>0;
    const col=crosses?'#4a5568':(s.lo>0?'#3fb950':'var(--neg)');
    const dot=crosses?'#8b93a1':col;
    body+=`<text x="0" y="${(yy+3.5).toFixed(1)}" font-size="10" fill="#c3c9d4">${r.m.name}</text>`
       +  `<line x1="${x(s.lo).toFixed(1)}" y1="${yy.toFixed(1)}" x2="${x(s.hi).toFixed(1)}" y2="${yy.toFixed(1)}" stroke="${col}" stroke-width="2"/>`
       +  `<circle cx="${x(s.mean).toFixed(1)}" cy="${yy.toFixed(1)}" r="3.5" fill="${dot}"/>`
       +  `<text x="${W}" y="${(yy+3.5).toFixed(1)}" font-size="10" font-weight="700" fill="${crosses?'#8b93a1':col}" text-anchor="end">${fR(s.mean)}</text>`;
  });
  const allGrey=rows.every(r=>r.s.lo<0&&r.s.hi>0);
  return `<div class="card" style="padding:12px 14px 10px;margin-top:8px">
    <div class="lbl">All ${rows.length} outcomes · 95% confidence intervals on one axis</div>
    <svg viewBox="0 0 ${W} ${H}" style="display:block;width:100%;height:auto">
      <rect x="${x(lead.lo).toFixed(1)}" y="${padT-4}" width="${(x(lead.hi)-x(lead.lo)).toFixed(1)}" height="${(rows.length*rh+6).toFixed(1)}" fill="#9dc0f6" fill-opacity="0.06"/>
      ${ticks}
      <line x1="${x(0).toFixed(1)}" y1="${padT-8}" x2="${x(0).toFixed(1)}" y2="${(H-padB+2).toFixed(1)}" stroke="#5a6478" stroke-width="1.5"/>
      ${body}
    </svg>
    <div class="fsub" style="margin:6px 0 0">Dot = expectancy, bar = 95% interval. <b>Grey means the bar crosses zero</b> — that outcome is not yet distinguishable from no edge at all. The shaded band is the leader's interval: anything whose dot sits inside it is not distinguishable from the leader either${allGrey?', and right now every one of them does':''}.</div>
  </div>`;
}

// ── expectancy matrix with per-method drawer ─────────────────────────────────
// Module-level so the 5s poll cannot clobber it: render() rebuilds the whole board, and
// an open row must survive that.
let OPEN_ROW=null, OPEN_MONTH={}, SEL_DAY={};

// A compact month grid for ONE method, rendered inside its drawer. This replaces the big
// shared calendar at the foot of the board: the calendar always answered a per-method
// question, so it belongs with the method rather than behind its own selector.
function miniCal(key,pool){
  const dated=pool.filter(t=>t.date && RV(t,key)!=null);
  if(!dated.length) return '<div class="mini">No dated trades for this method.</div>';
  const months=[...new Set(dated.map(t=>ym(t.date)))].sort();
  const cur=OPEN_MONTH[key]&&months.includes(OPEN_MONTH[key])?OPEN_MONTH[key]:months[months.length-1];
  const idx=months.indexOf(cur), [Y,M]=cur.split('-').map(Number);
  const first=new Date(Y,M-1,1), start=first.getDay(), dim=new Date(Y,M,0).getDate();
  const byDay={};
  if(!SEL_DAY[key]){ const ds=[...new Set(dated.map(t=>t.date))].sort(); SEL_DAY[key]=ds[ds.length-1]; }
  dated.filter(t=>ym(t.date)===cur).forEach(t=>{ const d=Number(t.date.slice(8,10)), r=RV(t,key);
    (byDay[d]=byDay[d]||{sum:0,n:0}); byDay[d].sum+=r; byDay[d].n++; });
  let cells='';
  for(let i=0;i<start;i++) cells+='<div class="mc-d mc-e"></div>';
  for(let d=1;d<=dim;d++){ const x=byDay[d];
    const iso=`${cur}-${String(d).padStart(2,'0')}`, sel=SEL_DAY[key]===iso;
    cells+=`<div class="mc-d${x?(x.sum>0?' mc-w':(x.sum<0?' mc-l':' mc-f')):''}${sel?' mc-s':''}${x?' mc-c':''}" `+
           `${x?`data-day="${iso}" data-cal="${key}" title="${fR(x.sum)} · ${x.n} trade${x.n>1?'s':''}"`:''}>`+
           `<span class="mc-n">${d}</span>${x?`<span class="mc-r ${cls(x.sum)}">${fR(x.sum)}</span>`:''}</div>`; }
  const nav=months.length>1
    ? `<button class="mc-b" data-cal="${key}" data-mo="${months[idx-1]||''}" ${idx<=0?'disabled':''}>‹</button>`+
      `<button class="mc-b" data-cal="${key}" data-mo="${months[idx+1]||''}" ${idx>=months.length-1?'disabled':''}>›</button>` : '';
  return `<div class="mc-h"><span>${first.toLocaleString('en-US',{month:'long',year:'numeric'})}</span><span>${nav}</span></div>
    <div class="mc-w7"><i>S</i><i>M</i><i>T</i><i>W</i><i>T</i><i>F</i><i>S</i></div>
    <div class="mc-g">${cells}</div>`;
}

// Trades on one day, for the method whose drawer is open. The calendar answers "when";
// this answers "which trades, and what did they actually do". They belong side by side —
// the space to the right of a month grid was otherwise dead.
// Trades on one day, for the method whose drawer is open. Prices come through tradeFields(), which
// normalises the two payload shapes: futures nests them under t.raw with model-prefixed
// names (SMMaxRun / VCLTrailStop), crypto keeps them flat (maxRun / bosExit). A field a
// board does not have is simply omitted rather than rendered as a dash — crypto has no L1
// leg and no Max Adverse column, so those rows must not appear there at all.
function tradeFields(t){
  const w = t.raw || t;
  const pick = (...ks)=>{ for(const k of ks){ const v=num(w[k]); if(v!=null) return v; } return null; };
  return {
    pair: w.Pair || t.pair || null,
    dir:  w.Direction || t.dir || null,
    time: w.entryTime || w['Entry Time (HHMM)'] || null,
    tz:   w.tz || w.Timezone || null,
    entry:  pick('EntryPrice','entry'),
    anchor: pick('anchor','1 of Fib Price'),
    maxRun: pick('MaxRun','maxRun'),
    exit:   pick('TrailStop'),
    // OBVS has no L1 leg and no Max Adverse column. Both stay null so the shared detail
    // renderer omits their rows entirely rather than printing a dash for a field that
    // does not exist on this model.
    adverse: null,
    l1: null,
    l1Src: null,
  };
}
function dayDetail(key,pool){
  const day=SEL_DAY[key];
  const ts=pool.filter(t=>t.date===day && RV(t,key)!=null);
  if(!day||!ts.length) return `<div class="dd-empty">Select a day with trades.</div>`;
  const tot=ts.reduce((a,t)=>a+RV(t,key),0);
  const px=v=>v==null?null:Number(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  const rows=ts.map(t=>{
    const R=RV(t,key), f=tradeFields(t);
    const cell=(label,val)=>val==null?'':`<span>${label}</span><b>${val}</b>`;
    const fields=[
      cell('entry',px(f.entry)), cell('1 of fib',px(f.anchor)),
      cell('max run',px(f.maxRun)), cell('exit',px(f.exit)),
      cell('max adverse',px(f.adverse)),
      f.l1==null?'':cell('L1 filled',`${f.l1?'yes':'no'} <span class="mini">${f.l1Src==='maxAdverse'?'measured':'checkbox'}</span>`),
    ].filter(Boolean).join('');
    return `<div class="dd-t">
      <div class="dd-hd">
        <span><span class="pill">${f.pair||'—'}</span> <b>${f.dir||'—'}</b>
          <span class="mini">${t.session||''}${f.time?' · '+f.time:''}${f.tz?' '+f.tz:''}</span></span>
        <span class="dd-r ${cls(R)}">${fR(R)}</span>
      </div>
      <div class="dd-g">${fields}</div>
    </div>`;}).join('');
  return `<div class="dd-h"><span>${day}</span><span class="${cls(tot)}">${fR(tot)} · ${ts.length} trade${ts.length>1?'s':''}</span></div>`+
         `<div class="dd-l">${rows}</div>`;
}

function methodDrawer(m,pool){
  const inf=METHOD_INFO[m.key]||{}, s=fullStats(seriesFor(m.key,pool));
  const pre = String(m.key).startsWith('m_') ? MARIO_PREAMBLE : LADDER_PREAMBLE;
  return `<tr class="dr" data-drawer="${m.key}"><td colspan="8"><div class="dr-in">
    <div class="dr-g">
      <div class="dr-b"><div class="dr-k">What it is</div><p>${inf.what||'<span class="mut">Not yet described.</span>'}</p></div>
      <div class="dr-b"><div class="dr-k">How it is tested</div><p>${inf.test||'<span class="mut">—</span>'}</p></div>
    </div>
    <div class="dr-b dr-cal"><div class="dr-k">By day — this method only <span class="dr-hint">click a day</span></div>${miniCal(m.key,pool)}</div>
    <div class="dr-b dr-day"><div class="dr-k">Trades on the selected day</div>${dayDetail(m.key,pool)}</div>
    <div class="dr-pre">${pre}</div>
  </div></td></tr>`;
}

// Rank by the LOWER BOUND of the 95% interval, not raw expectancy. That is what "best
// return with least pain" actually is: a method that pays well and behaves consistently
// has a high lower bound; one that pays well by way of a single outlier does not. It is
// also order-independent, unlike drawdown or losing streak.
function matrixTable(pool){
  // MGMT, not MGMTS: the normalised list carries .key/.name on both boards. Reading
  // m.k here emitted data-row="undefined", which set OPEN_ROW to the string
  // "undefined" and made every drawer unopenable on the crypto side.
  let rows=MGMT.map(m=>({m, s:fullStats(seriesFor(m.key,pool))}));   // reassigned by rankRows below
  const scored=rows.filter(r=>r.s.n), unscored=rows.filter(r=>!r.s.n);
  rows = rankRows(scored,pool).concat(unscored);
  // A zero-width interval is every observation landing on the same number, not confidence.
  // It must not take the crown.
  const winner=rows.find(r=>r.s.n>0);
  // One trading day cannot produce a meaningful drawdown or streak — there is no order to
  // speak of. Grey the whole group below 10 days rather than printing numbers that look
  // like measurements.
  const days=new Set(pool.map(t=>t.date).filter(Boolean)).size;
  const dim = days<10 ? ' dimc' : '';
  let html='';
  rows.forEach(r=>{
    const s=r.s, open=OPEN_ROW===r.m.key, isBest=winner&&r.m.key===winner.m.key&&s.n>0;
    const ci = s.n>1
      ? `<span class="${s.degenerate?'mut':(s.lo>0?'pos':'')}">[${fR(s.lo)}, ${fR(s.hi)}]</span>${s.degenerate?' <span class="flag" title="Every trade scored the same number — zero variance, not confidence">±0</span>':''}`
      : '<span class="mut">—</span>';
    html+=`<tr class="mrow ${isBest?'best':''} ${open?'is-open':''}" data-row="${r.m.key}">`+
      `<td class="mname"><button class="chev" aria-expanded="${open}" data-row="${r.m.key}">${open?'▾':'▸'}</button>${r.m.name}</td>`+
      `<td class="${s.n?cls(s.mean):'mut'}">${s.n?fR(s.mean):'—'}</td>`+
      `<td class="cicol">${ci}</td>`+
      `<td>${s.n?Math.round(s.winRate*100)+'%':'—'}</td>`+
      `<td class="${s.n?cls(s.total):'mut'}">${s.n?fR(s.total):'—'}</td>`+
      `<td class="mut">${s.n||'—'}</td>`+
      // Path group. Drawdown and streak depend on the ORDER these trades happened in;
      // expectancy and win% do not. Reshuffle the log and only these two move — so they
      // sit behind a divider under their own heading rather than reading as peers.
      `<td class="pathc${dim}">${s.n?(s.losses===0?'<span class="mut">none</span>':'<b class="neg">-'+s.dd.toFixed(2)+'R</b>'):'—'}</td>`+
      `<td class="pathc${dim}">${s.n?(s.losses===0?'<span class="mut">—</span>':s.streak+'×'):'—'}</td></tr>`;
    if(open) html+=methodDrawer(r.m,pool);
  });
  const note = days<10
    ? `Worst run and streak describe the order these ${pool.length} trades happened in, not the strategy — and ${days} trading day${days===1?'':'s'} is not enough order to describe. Reshuffle the log and they change; expectancy and win% do not.`
    : `Worst run and streak describe the order these trades happened in, not the strategy. Reshuffle the log and they change; expectancy and win% do not.`;
  return `<table class="matrix"><thead>
    <tr class="grp"><th></th><th colspan="4">Distribution — order-independent</th><th></th>
        <th colspan="2" class="pathh${dim}">Path — depends on trade order</th></tr>
    <tr><th>Method</th><th>Exp</th><th>95% CI</th><th>Win%</th><th>Tot</th><th>n</th>
        <th class="pathc${dim}">Worst run</th><th class="pathc${dim}">Streak</th></tr>
    </thead><tbody>${html}</tbody></table>
    <div class="mnote">${note}</div>`;
}

function wireMatrix(){
  document.querySelectorAll('.matrix .chev, .matrix .mrow .mname').forEach(el=>{
    el.onclick=e=>{ e.stopPropagation();
      const k=(e.currentTarget.dataset.row)||(e.currentTarget.closest('tr').dataset.row);
      OPEN_ROW = OPEN_ROW===k ? null : k; render(); };
  });
  document.querySelectorAll('.mc-d[data-day]').forEach(c=>{
    c.onclick=e=>{ e.stopPropagation(); const {cal,day}=e.currentTarget.dataset;
      SEL_DAY[cal]=day; render(); };
  });
  document.querySelectorAll('.mc-b').forEach(b=>{
    b.onclick=e=>{ e.stopPropagation(); const {cal,mo}=e.currentTarget.dataset;
      if(mo){ OPEN_MONTH[cal]=mo; render(); } };
  });
}
// Rows that never reach the matrix, counted for the ACTIVE model only — each model reads
// its own excursion pair, and a row the ladder scores fine can be unscoreable for Super
// Mario. Excluded = the inputs that model needs are blank. Invalid = Max Adverse is
// exactly 0, which is never a legitimate reading because Max Adverse is a PRICE; it is
// counted apart from "excluded" so a mislogged row reads as a logging fault, not a gap.
// Ladder rows are never gated on Max Adverse — computeR() does not read it.
function dropCounts(pool){
  // Board-agnostic: a row is EXCLUDED when it scores no outcome at all, and INVALID when a
  // field the scorer depends on is present but impossible. Written against the method keys
  // rather than one board's column names so the same function runs on both.
  // OBVS carries no Max Adverse, so there is no placeholder-zero class of invalid row
  // here. A row is simply EXCLUDED when it scores no outcome — which on this model means
  // one of Entry, anchor, Max Run or Trail Stop is missing.
  let excluded=0;
  pool.forEach(t=>{ if(!MGMT.some(m=>RV(t,m.key)!=null)) excluded++; });
  return {excluded};
}
let MATRIX_OPEN=true, PRIMER_OPEN=false;

// Replaces the days badge, drop badge, pair-mix card and verdict line — roughly 230px of
// card chrome to show four integers and a sentence. How much evidence exists has to come
// BEFORE any claim, and it has to be one glance.
function evidenceBar(pool, all){
  const days=new Set(pool.map(t=>t.date).filter(Boolean)).size;
  // Pairs are derived from the data, not hardcoded — the same component runs on a board
  // of MNQ/MES/MGC and one of SOL/BTC/ETH. `all` is the unfiltered log, passed in because
  // the two boards hold it under different names.
  const src = all || pool;
  const mix = [...new Set(src.map(t=>t.pair||t.Pair).filter(Boolean))].sort()
    .map(k=>`${k} ${src.filter(t=>(t.pair||t.Pair)===k).length}`).join(' · ');
  const drops=dropCounts(pool), dropN=Object.values(drops).reduce((a,b)=>a+b,0);
  const notes=[];
  if(dropN) notes.push(`${dropN} row${dropN>1?'s':''} excluded from scoring`);
  return `<div class="ebar">
    ${verdictLine(pool)}
    <div class="eb2">${mix}${PAIR==='all'?'':' · filtered to '+PAIR}${CLASS==='all'?'':' · '+CLASS.toUpperCase()}${notes.length?' — '+notes.join(' · '):''}</div>
  </div>`;
}

// The three session cards were three cuts of one axis. One table, and per Franklin the
// "best method by session" column is gone entirely — at two trades a cell it was a
// recommendation dressed as a finding. Counts are true at any n; a ranking is not.
function sessionProfile(pool){
  const ss=[...new Set(pool.map(t=>t.session).filter(Boolean))].sort((a,b)=>sessRank(a)-sessRank(b));
  if(!ss.length) return '<div class="empty-note">No session tagged yet.</div>';
  const allDays=new Set(pool.filter(t=>t.date).map(t=>t.date)).size;
  let rows='';
  ss.forEach(se=>{
    const sub=pool.filter(t=>t.session===se);
    const d=new Set(sub.filter(t=>t.date).map(t=>t.date)).size;
    const rp=sub.filter(t=>t.rangePct!=null).map(t=>t.rangePct);
    const avg = rp.length ? (rp.reduce((a,b)=>a+b,0)/rp.length).toFixed(2)+'%' : '—';
    rows+=`<tr><td><span class="pill">${se}</span></td>
      <td class="spn"><b>${sub.length}</b></td>
      <td class="spn"><b>${d?(sub.length/d).toFixed(1):'0'}</b> <span class="mini">/day</span></td>
      <td class="spn mut">${d}d</td>
      <td class="spn"><b>${avg}</b></td></tr>`;
  });
  // Totals. Two different averages, and they answer different questions: how busy a
  // trading day is, and how many of those trades a given session accounts for.
  const perDay = allDays ? (pool.length/allDays).toFixed(1) : '0';
  const perSession = ss.length ? (pool.length/ss.length).toFixed(1) : '0';
  const allRp = pool.filter(t=>t.rangePct!=null).map(t=>t.rangePct);
  const allAvg = allRp.length ? (allRp.reduce((a,b)=>a+b,0)/allRp.length).toFixed(2)+'%' : '—';
  // Per-session sits beside the trade count, not in the range column — it is a count, and
  // a count in a column headed "Avg range %" reads as a percentage.
  rows+=`<tr class="sptot"><td><b>All</b></td>
      <td class="spn"><b>${pool.length}</b> <span class="mini">${perSession}/session</span></td>
      <td class="spn"><b>${perDay}</b> <span class="mini">/day</span></td>
      <td class="spn mut">${allDays}d</td>
      <td class="spn"><b>${allAvg}</b></td></tr>`;
  return `<table class="sp"><thead><tr><th>Session</th><th>Trades</th><th>Rate</th><th>Days</th><th>Avg range %</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="mnote">Counts and rates are descriptive at any sample size. Which exit is best <em>per session</em> is deliberately not shown — at these counts every cell would be two or three trades, and a method name in a cell reads as a recommendation.</div>`;
}

function primerBlock(){
  return `<div class="card prim">
    <div class="primhd" id="primTog"><span>How to read this board</span><span class="mini">${PRIMER_OPEN?'– collapse':'+ expand'}</span></div>
    ${PRIMER_OPEN?`<div class="primbody">
      <p><b>Every row is the same trades read a different way.</b> Twelve exit rules scored against one log — not ten separate samples. Do not add the n column up.</p>
      <p><b>One ruler.</b> The stop is typed where market structure puts it — a swing point, not a fib ratio — and 1R is entry to stop. The fib is drawn stop-to-entry purely to read the chart: fib 0 is the stop, fib 1 the entry, and every R is a whole number above (XR at fib X+1). Futures and crypto share the log and the ruler; the board splits them by instrument.</p>
      <p><b>Ranked by expectancy</b> — mean R per trade. The 95% interval is printed on every row so you can see how much of a mean rests on one outlier; it no longer decides the order. A wide interval that crosses zero is a lean, not a verdict, and the card above says so.</p>
      <p><b>Worst run and streak sit behind a divider</b> because they depend on the order the trades happened in. Reshuffle the log and they change; expectancy and win% do not.</p>
    </div>`:''}
  </div>`;
}

function render(){
  const pool=TRADES, board=document.getElementById('board');
  if(!pool.length){ board.innerHTML='<div class="card"><div class="empty-note">No trades match this filter yet — try switching the PAIR toggle, or log trades to Trade Log — VCS.</div></div>'; return; }
  const matrixSummary=(()=>{
    const rows=MGMT.map(m=>statsFor(m.key,pool)).filter(x=>x.n);
    const clear=rows.filter(x=>x.lo>0).length;
    return `${MGMT.length} outcomes on the same ${pool.length} trades · ${clear} clear zero`;
  })();
  board.innerHTML=`
    ${evidenceBar(pool, ALL_TRADES)}
    ${primerBlock()}
    <div class="grid2">
      <div>${winnerCard(pool)}</div>
      <div>
        <div class="card"><div class="lbl">Session profile</div>${sessionProfile(pool)}</div>
      </div>
    </div>
    <div class="card" style="margin-bottom:12px">
      <div class="primhd" id="matTog"><span>Full numbers — every outcome, ranked</span>
        <span class="mini">${matrixSummary} &nbsp; ${MATRIX_OPEN?'– collapse':'+ expand'}</span></div>
      ${MATRIX_OPEN?matrixTable(pool):''}
    </div>
    ${emaCard(pool)}
    ${mfCard(pool)}
    ${poiCard(pool)}
    ${poiTfCard(pool)}
    ${sweepCard(pool)}
    ${rangeCard(pool)}
    <div class="card" style="margin-bottom:12px">${intervalStripSVG(pool)}</div>
    <div class="card" style="margin-bottom:12px">${reachLadderSVG(pool)}</div>
    <div class="foot" id="foot"></div>`;
  const f=document.getElementById('foot'); if(f) f.innerHTML = FOOT_OBVS;
  const pt=document.getElementById('primTog'); if(pt) pt.onclick=()=>{PRIMER_OPEN=!PRIMER_OPEN; render();};
  const mt=document.getElementById('matTog'); if(mt) mt.onclick=()=>{MATRIX_OPEN=!MATRIX_OPEN; render();};
  if(MATRIX_OPEN) wireMatrix();
}

function ym(d){ return d? d.slice(0,7):null; }

function applyModel(){
  MGMTS = MGMTS_OBVS.slice();
  normalizeMethods();
}
// FUTURES / CRYPTO. Changing class changes which pairs exist, so the pair toggle is
// rebuilt and a pair that no longer belongs falls back to ALL — otherwise switching
// class while filtered to MNQ would silently show an empty board.
function wireClassTg(){
  document.querySelectorAll('#classTg button').forEach(b=>{
    b.onclick=()=>{ const v=b.dataset.c; if(v===CLASS) return;
      document.querySelectorAll('#classTg button').forEach(x=>x.classList.toggle('on',x===b));
      CLASS=v; buildPairTg(); applyFilters(); writeStatus(); render(); };
  });
}
// The pair toggle is built from the log and scoped to the current class, not declared in
// the markup: a new instrument in Notion must reach the toggle without a code change, and
// the futures pairs must not appear while CRYPTO is selected.
function buildPairTg(){
  const el=document.getElementById('pairTg'); if(!el) return;
  const inClass = t => CLASS==='all' || isFutures(t.pair)===(CLASS==='futures');
  const opts=[...new Set(ALL_TRADES.filter(inClass).map(t=>t.pair).filter(Boolean))]
    .sort((a,b)=>{ const fa=isFutures(a), fb=isFutures(b);
                   return fa===fb ? a.localeCompare(b) : (fa?-1:1); });
  // A filter offering one choice is not a filter.
  if(opts.length<2){ el.innerHTML=''; el.style.display='none'; PAIR='all'; return; }
  el.style.display='';
  // Switching class can strip the selected pair out from under the filter — fall back to
  // ALL rather than silently rendering an empty board.
  if(PAIR!=='all' && !opts.includes(PAIR)) PAIR='all';
  const sig=[CLASS,'all',...opts].join('|');
  if(el.dataset.sig===sig){
    el.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.p===PAIR));
    return;
  }
  el.dataset.sig=sig;
  el.innerHTML=['all',...opts].map(o=>
    `<button data-p="${o}"${o===PAIR?' class="on"':''}>${o==='all'?'ALL':o}</button>`).join('');
  el.querySelectorAll('button').forEach(b=>{
    b.onclick=()=>{ const v=b.dataset.p; if(v===PAIR) return;
      el.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
      PAIR=v; applyFilters(); writeStatus(); render(); };
  });
}

// Header count is written from one place. It used to be written only inside poll(), so a
// filter click showed the unfiltered count until the next 5s tick — the number on screen
// disagreed with the board under it.
let LAST_SRC='live';
function writeStatus(){
  const st=document.getElementById('status'); if(!st) return;
  st.textContent=`${TRADES.length} of ${ALL_TRADES.length} trade${ALL_TRADES.length===1?'':'s'} · ${PAIR.toUpperCase()}${CLASS==='all'?'':' · '+CLASS.toUpperCase()} · ${LAST_SRC} · ${new Date().toLocaleTimeString()}`;
}
const WORKER='https://vcl-clarity-scoreboard.potus-eth.workers.dev/?view=v6-obvs';
let firstLoad=true;
async function fetchTrades(){
  try{
    const res=await fetch(WORKER+'&t='+Date.now(),{cache:'no-store'});
    if(!res.ok) throw new Error('worker '+res.status);
    const j=await res.json();
    if(j.error) throw new Error(j.error);
    return {j, src:'live'};
  }catch(e){
    const res=await fetch('v6-obvs-data.json?t='+Date.now(),{cache:'no-store'});
    if(!res.ok) throw new Error('data '+res.status);
    return {j:await res.json(), src:'cached'};
  }
}
async function poll(){
  const st=document.getElementById('status');
  try{
    const {j,src}=await fetchTrades();
    const rows=(j&&j.trades)||[];
    ALL_TRADES=rows.map(computeR).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    buildPairTg();  // may reset PAIR if its option vanished — must run before filtering
    applyFilters();
    LAST_SRC=src; writeStatus();
    render();
    firstLoad=false;
  }catch(e){
    if(firstLoad){
      st.innerHTML='<span class="err">Worker unreachable: '+(e.message||'')+'</span>';
      document.getElementById('board').innerHTML='<div class="card"><div class="empty-note">Worker unreachable and no cached snapshot available. Retrying every 5s.</div></div>';
    }
  }
}
wireClassTg(); applyModel();
poll();
setInterval(poll,5000);
</script>
