name: Refresh scoreboard data

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes
  workflow_dispatch:          # manual trigger from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run refresh script
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node refresh.js

      - name: Commit data.json if changed
        run: |
          if [[ -n "$(git status --porcelain data.json)" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data.json
            git commit -m "chore: refresh scoreboard data"
            # Race-safe push: rebase against remote in case another run / human pushed first
            for i in 1 2 3; do
              git pull --rebase --autostash || true
              if git push; then
                echo "pushed on attempt $i"
                break
              fi
              echo "push attempt $i failed; retrying..."
              sleep $((i * 2))
            done
          else
            echo "No changes to data.json"
          fi
