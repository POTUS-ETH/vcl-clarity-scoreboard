name: Refresh scoreboard data

on:
  schedule:
    - cron: '*/5 * * * *'    # every 5 minutes (GitHub Actions floor — actual cadence may be 6–10 min during peak load)
  workflow_dispatch:          # manual trigger from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed for rebase against remote

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run refresh script
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node refresh.js

      - name: Commit data.json if changed
        shell: bash
        run: |
          set +e   # we explicitly handle push failures below
          if [[ -z "$(git status --porcelain data.json)" ]]; then
            echo "No changes to data.json"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json
          git commit -m "chore: refresh scoreboard data"

          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            git push
            if [[ $? -eq 0 ]]; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push attempt $i failed; retrying in $((i * 3))s..."
            sleep $((i * 3))
          done

          echo "all push attempts failed; giving up but not failing the step (data.json was still computed)"
          exit 0
